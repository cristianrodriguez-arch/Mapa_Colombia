<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
/* ══════════════════════════════════════════════════════════════════════
   Visor PDV + Bricks · hoja de estilos
   Lenguaje visual: lienzo gris claro + tarjetas blancas (Power BI) con la
   densidad de información de Zebra BI (IBCS): tipografía chica, números
   tabulares, color solo cuando significa algo (semáforo), cero adornos.
   ══════════════════════════════════════════════════════════════════════ */

:root{
  /* Identidad visual ISDIN (repo manual-identidad-visual-ISDIN, 2026-10-27):
     neutros + durazno + arena del manual; Montserrat como sustituta web de Gotham.
     Superficies */
  --lienzo:#f5f3ee;  --surface:#ffffff;  --surface-2:#fcf5ed;
  /* Texto */
  --ink:#414141;     --ink-2:#525151;    --muted:#6d6d6d;   --ink-fuerte:#2e2e2b;
  /* Líneas */
  --borde:#e1e1e1;   --borde-2:#cecece;
  /* Acento de marca: durazno. --accent (90) para texto, enlaces y controles activos
     (7.1:1 sobre blanco); --accent-suave para fondos de selección; --serie para la
     serie principal de los gráficos (sell-out). El botón principal es --ink. */
  --accent:#725140;  --accent-2:#433026; --accent-suave:#fff2ec;
  --foco:#d09375;    --serie:#d09375;    --durazno:#ffc7ab;
  /* Estados: el rojo es solo "requiere atención" (variación negativa, aviso grave). */
  --desel:#cecece;   --error:#b71c1c;    --aviso:#b06a00;  --producto:#7f77dd;
  /* Semáforo de rendimiento del mapa (color con significado: alto/medio/bajo/brecha). */
  --sem-alto:#1e8e3e; --sem-medio:#f2b600; --sem-bajo:#ef7d00;
  --sem-muybajo:#e41f33; --sem-sin:#9ca3af;
  /* Riel de navegación (Material 3 Expressive) */
  --rail-col:96px;   --rail-exp:240px;
  /* Forma */
  --radio:6px; --radio-lg:12px; --radio-pill:999px;
  --sombra:0 1px 2px rgba(46,46,43,.05), 0 1px 3px rgba(46,46,43,.04);
  --font:'Montserrat','Gotham',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Una sola tipografía en todo el visor (2026-10-29): tablas y gráficas también van en
     Montserrat, con cifras tabulares (mismo ancho por dígito) para que los números alineen. */
  --font-dense:var(--font);
  --rojo-marca:#d7352d;   /* barra central del logo ISDIN */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--lienzo);color:var(--ink);
  font-family:var(--font);font-size:14px;font-variant-numeric:tabular-nums lining-nums}
/* Misma letra y mismos números en tablas, gráficas SVG, tooltips y el mapa. */
table,svg,svg text,.leaflet-container,.leaflet-tooltip,.leaflet-popup-content{
  font-family:var(--font-dense);font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline-color:var(--foco)}

/* ── Rejilla general: cabecera / avisos / cuerpo. 100vh, scroll interno ── */
.shell{display:grid;grid-template-columns:var(--rail-col) minmax(0,1fr);height:100vh;
  transition:grid-template-columns .2s cubic-bezier(.2,0,0,1)}
.shell.rail-expandido{grid-template-columns:var(--rail-exp) minmax(0,1fr)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;height:100vh;padding:10px 10px 10px 0;min-width:0}

/* ══════════ Riel de navegación · Material 3 Expressive ══════════
   COLAPSADO: 96 px, cada destino = indicador en píldora (56×32) con el icono y la
   etiqueta debajo. EXPANDIDO: 240 px, logo completo y el indicador ocupa toda la
   fila (icono + etiqueta). Activo = indicador durazno; hover = capa de estado. */
.nav-rail{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden auto;
  background:var(--lienzo);padding:12px 12px 16px;font-family:var(--font)}
.rail-cab{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.rail-menu{width:56px;height:40px;border:none;border-radius:var(--radio-pill);background:transparent;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rail-menu:hover{background:rgba(65,65,65,.08)}
.rail-menu svg,.rail-ind svg{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.rail-logo{color:var(--ink);display:flex;align-items:center;height:28px}
.rail-logo .logo-emblema{height:22px;width:auto}
.rail-logo .logo-completo{display:none;height:40px;width:auto}
/* Logo ISDIN según el manual: barras y letras en el gris de marca, barra central roja
   y el lema "LOVE YOUR SKIN" en Montserrat ligera, del ancho del logotipo. */
.rail-logo .logo-rojo{fill:var(--rojo-marca)}
.rail-logo .logo-lema{font-family:var(--font);font-weight:300;font-size:15px;fill:currentColor;letter-spacing:.02em}
.rail-items{display:flex;flex-direction:column;gap:6px}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:4px 0;
  border:none;background:none;color:var(--ink-2);font:inherit;font-size:12px;font-weight:500;
  cursor:pointer;text-align:center}
.rail-ind{display:flex;align-items:center;justify-content:center;width:56px;height:32px;
  border-radius:var(--radio-pill);transition:background .15s ease,width .2s cubic-bezier(.2,0,0,1)}
.rail-item:hover .rail-ind{background:rgba(65,65,65,.08)}
.rail-item.activo{color:var(--ink-fuerte);font-weight:700}
.rail-item.activo .rail-ind{background:var(--durazno);color:var(--accent-2)}
.rail-item:focus-visible{outline:none}
.rail-item:focus-visible .rail-ind{box-shadow:0 0 0 2px var(--foco)}
.rail-lbl{line-height:1.2;max-width:84px}
.rail-item.clasico{color:var(--muted)}
.rail-sep{height:1px;background:var(--borde);margin:10px 12px}
.rail-sep span{display:none}
/* Expandido */
.rail-expandido .rail-cab{flex-direction:row;align-items:center;gap:8px}
.rail-expandido .rail-logo .logo-emblema{display:none}
.rail-expandido .rail-logo .logo-completo{display:block}
.rail-expandido .rail-item{flex-direction:row;padding:0}
.rail-expandido .rail-ind{width:100%;height:56px;justify-content:flex-start;gap:12px;padding:0 16px}
.rail-expandido .rail-ind .rail-lbl-dup{display:none}
.rail-expandido .rail-item{position:relative}
.rail-expandido .rail-lbl{position:absolute;left:52px;top:50%;transform:translateY(-50%);
  max-width:none;white-space:nowrap;font-size:14px}
.rail-expandido .rail-sep{height:auto;background:none;margin:14px 16px 4px}
.rail-expandido .rail-sep span{display:block;font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 10px var(--ancho-rail,400px);
  grid-template-rows:minmax(0,1fr);gap:0;min-height:0}
/* Divisor arrastrable entre mapa y panel (el hueco de 10 px que antes era gap). */
.divisor{position:relative;cursor:col-resize;touch-action:none;outline:none}
.divisor::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:2px;border-radius:2px;
  background:transparent;transition:background .15s ease}
.divisor:hover::after,.divisor:focus-visible::after,.divisor.arrastrando::after{background:var(--accent)}
.divisor::before{content:'';position:absolute;top:50%;left:3px;width:4px;height:28px;margin-top:-14px;
  border-radius:3px;background:var(--borde-2)}
body.redimensionando{cursor:col-resize;user-select:none}
body.redimensionando #map{pointer-events:none}
.card{background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio-lg);
  box-shadow:var(--sombra)}

/* ── Cabecera: marca · filtros · acciones ───────────────────────────── */
/* Flex, no grid: con `grid-template-columns:auto minmax(0,1fr) auto` la
   columna de filtros reservaba TODO el ancho sobrante aunque solo hubiera
   dos controles (Período/Meses), empujando "Centrar/Diagnóstico" al borde
   derecho y dejando un vacío enorme en medio en pantallas anchas. Con flex
   y sin flex-grow en ningún hijo, marca+filtros+acciones se agrupan a la
   izquierda y el sobrante de ancho queda como margen normal a la derecha,
   no como un hueco entre los controles. */
.topbar{position:relative;z-index:1200;display:flex;flex-wrap:wrap;gap:10px 18px;
  padding:8px 12px;align-items:flex-start;
  max-height:45vh}   /* tope: si el CSS de Choices tarda, la cabecera no ahoga al mapa */
.topbar>.filtros{flex:0 1 auto}
.marca{display:flex;align-items:center;gap:9px;padding-top:2px}
.marca h1{margin:0;font-size:16px;font-weight:700;white-space:nowrap;color:var(--ink-fuerte);letter-spacing:-.02em}
/* Subpestañas de "Ventas" (Sell Out · SI vs SO · Ventas MTD): pestañas secundarias de
   Material 3, en la cabecera; indicador inferior durazno en la activa. */
.ventas-subtabs{display:flex;align-items:flex-end;gap:2px;align-self:stretch;margin:-8px 0;
  border-left:1px solid var(--borde);padding-left:10px}
.ventas-subtabs[hidden]{display:none}
.ventas-subtabs .subtab{position:relative;border:none;background:none;cursor:pointer;font:inherit;
  font-size:13.5px;font-weight:500;color:var(--ink-2);padding:16px 16px 14px;border-radius:8px 8px 0 0;white-space:nowrap}
.ventas-subtabs .subtab:hover{background:rgba(65,65,65,.06)}
.ventas-subtabs .subtab.activo{color:var(--ink-fuerte);font-weight:700}
.ventas-subtabs .subtab.activo::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;
  border-radius:3px 3px 0 0;background:var(--foco)}
.ventas-subtabs .subtab:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
@media(max-width:600px){.ventas-subtabs{order:5;width:100%;border-left:none;padding-left:0;margin:0;
  border-top:1px solid var(--borde);overflow-x:auto}.ventas-subtabs .subtab{flex:1;padding:12px 8px 10px}}
.marca .sub{display:block;font-size:11px;color:var(--muted);white-space:nowrap}

.filtros{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end}
/* El [hidden] del navegador es una regla de baja prioridad y pierde contra
   `.filtros{display:flex}` de arriba (misma especificidad, esta gana por ir
   despues en la cascada): sin esta regla por ID, ocultar la barra desde JS
   (bf.hidden=true al entrar a Ventas MTD) no tenia ningun efecto visual. */
#barraFiltros[hidden]{display:none}
.filtro{min-width:0;flex:0 1 168px}
.filtro-fijo{flex:0 1 150px}
.filtro>span{display:block;font-size:10px;font-weight:600;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtro select{width:100%;padding:6px 7px;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-family:inherit}
.filtro select[multiple]{height:60px}           /* solo se ve si el CDN falla */
.filtro select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-suave)}

/* ── Filtros bajo demanda: chip + "+ Nuevo filtro" ──────────────── */
/* Cada filtro opcional es su propio chip: nombre de la dimensión, su ✕ y el
   control real (el mismo <select> de siempre). El contenedor es un <div> y no
   un <label> a propósito: un label sin 'for' activa su primer descendiente
   labelable ante un clic en CUALQUIER punto suyo, y aquí el primero es el
   <button> de la ✕ — abrir el desplegable borraba el filtro. */
.filtro-chip>span{display:flex;align-items:center;gap:4px}
.chip-nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-x{flex:0 0 auto;width:16px;height:16px;margin-left:auto;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:50%;background:none;line-height:1;
  color:var(--muted);font-size:11px;font-family:inherit;cursor:pointer}
.chip-x:hover{background:var(--lienzo);color:var(--error)}

.filtro-acc{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-bottom:1px}
.pop-anclaje{position:relative}
.btn-nuevo{border-style:dashed;color:var(--accent);border-color:var(--borde-2)}
.btn-nuevo:hover{border-style:solid;background:var(--accent-suave)}
.btn-icono{padding:6px 9px;line-height:1.1}
.btn-ok{color:var(--sem-alto)}
.btn-ok:hover{border-color:var(--sem-alto);color:var(--sem-alto);background:var(--lienzo)}

.pop-filtros{position:absolute;top:calc(100% + 5px);left:0;z-index:3200;width:230px;
  background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio);
  box-shadow:0 8px 22px rgba(17,24,39,.14);padding:7px}
.pop-filtros input{width:100%;padding:6px 7px;margin-bottom:5px;font-family:inherit;
  font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--borde);border-radius:var(--radio)}
.pop-filtros input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-suave)}
.pop-lista{max-height:240px;overflow-y:auto;display:flex;flex-direction:column}
.pop-op{display:block;width:100%;text-align:left;padding:6px 8px;border:none;
  border-radius:var(--radio);background:none;color:var(--ink-2);font-size:12.5px;
  font-family:inherit;cursor:pointer}
.pop-op:hover{background:var(--accent-suave);color:var(--accent)}
.pop-vacio{padding:7px 8px;font-size:12px;color:var(--muted)}

.acciones{display:flex;gap:6px;align-items:center;padding-top:12px}
.btn{padding:6px 11px;border:1px solid var(--borde-2);border-radius:var(--radio);
  background:var(--surface);color:var(--ink-2);font-size:12px;font-family:inherit;
  cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-suave);border-color:var(--foco);color:var(--accent)}
.btn-primario{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn-primario:hover{background:var(--ink-fuerte);border-color:var(--ink-fuerte);color:#fff}
.contador-filtros{display:inline-block;min-width:15px;padding:0 4px;margin-left:4px;
  border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700}
.contador-filtros[hidden]{display:none}

/* ── Avisos ─────────────────────────────────────────────────────────── */
.avisos{display:none;flex-direction:column;gap:6px}
.aviso{padding:7px 12px;border-radius:var(--radio);font-size:12.5px;white-space:pre-wrap;
  background:#fff8ec;border:1px solid var(--aviso);color:var(--aviso)}
.aviso.grave{background:#fdf0f0;border-color:var(--error);color:var(--error)}

/* ── Área central: mapa ─────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.barra-mapa{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 12px;border-bottom:1px solid var(--borde)}
.barra-mapa label{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.barra-mapa select{padding:4px 6px;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--surface);color:var(--ink);font-size:12px;font-family:inherit}
.leyenda-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.leyenda-inline .item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.leyenda-inline .swatch{width:11px;height:11px;border-radius:3px;border:1px solid rgba(17,24,39,.12)}
/* Leyenda de "Delegado asignado": clic = resaltar; el LAM lleva anillo como su punto. */
.leyenda-inline .ley-clic{cursor:pointer;border-radius:4px;padding:1px 3px}
.leyenda-inline .ley-clic:hover{background:var(--lienzo)}
.leyenda-inline .ley-clic.activo{color:var(--ink);font-weight:700}
.leyenda-inline .ley-clic.apagado{opacity:.4}
.leyenda-inline .swatch.anillo{border-radius:50%;box-shadow:0 0 0 2px #1f2937}
.mapa-wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;border-radius:0 0 var(--radio-lg) var(--radio-lg)}
.banda-prod{position:absolute;top:10px;left:52px;right:10px;z-index:600;
  background:var(--producto);color:#fff;padding:6px 12px;border-radius:var(--radio);
  font-size:12.5px;font-weight:600;display:none;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(17,24,39,.18)}
.banda-prod .x{margin-left:auto;cursor:pointer;font-weight:700;padding:0 4px}

/* ── Panel derecho: KPIs + tabla + análisis ─────────────────────────── */
.rail{display:flex;flex-direction:column;min-height:0;gap:10px}
/* KPIs: flex (no grid) a proposito — el primero (siempre el total/hero, sea
   "Total Sell Out" o "Sell Out producto") se pone flex-basis:100% y ocupa su
   propia fila con tratamiento destacado; los demas se acomodan debajo en la
   fila que haga falta, sirvan 3 (modo general) o 4 (modo producto). Antes
   las 4 tarjetas eran identicas sin ninguna jerarquia entre ellas. */
.kpis{display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0}
/* KPIs del mapa en UNA franja (2026-10-09): las 4 tarjetas ocupaban ~370 px de
   alto y le quitaban espacio a la tabla, que es lo que de verdad se usa. */
#kpis{gap:0;background:var(--surface);border:1px solid var(--borde);
  border-radius:var(--radio);box-shadow:var(--sombra)}
#kpis .kpi,#kpis .kpi:first-child{flex:1 1 92px;border:none;border-radius:0;box-shadow:none;
  background:transparent;padding:6px 9px;text-align:left}
#kpis .kpi+.kpi{border-left:1px solid var(--borde)}
#kpis .kpi .kpi-valor,#kpis .kpi:first-child .kpi-valor{font-size:16px;margin-top:1px}
#kpis .kpi:first-child .kpi-valor{color:var(--accent-2)}
#kpis .kpi:first-child .kpi-label,#kpis .kpi:first-child .kpi-nota{color:inherit;opacity:1}
#kpis .kpi-label{font-size:9px}
#kpis .kpi-nota{font-size:9.5px}
.kpi{flex:1 1 130px;min-width:0;background:var(--surface);border:1px solid var(--borde);
  border-radius:var(--radio);box-shadow:var(--sombra);padding:9px 8px;text-align:center}
.kpi:first-child{flex-basis:100%;text-align:left;padding:13px 16px;
  background:var(--accent-suave);border-color:transparent}
.kpi:first-child .kpi-label{color:var(--accent-2);opacity:.8}
.kpi:first-child .kpi-valor{font-size:28px;color:var(--accent-2)}
.kpi:first-child .kpi-nota{color:var(--accent-2);opacity:.7}
.kpi.modo-prod:not(:first-child){border-left:3px solid var(--producto)}
.kpi-label{font-size:9.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-valor{font-size:21px;font-weight:700;line-height:1.15;margin-top:2px;
  font-variant-numeric:tabular-nums}
.kpi-nota{font-size:10px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio-lg);
  box-shadow:var(--sombra);overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--borde);flex-shrink:0}
.tab{padding:6px 12px;border:none;background:transparent;color:var(--ink-2);
  font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.activa{color:var(--accent);border-bottom-color:var(--accent)}
.panel-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 16px}
#tablaRail td:first-child{overflow-wrap:anywhere}
.bloque{margin-bottom:18px}
.bloque h2{margin:0 0 6px;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-2)}
.bloque h2 .acc{float:right;font-size:11px;font-weight:600;color:var(--accent);
  cursor:pointer;text-transform:none;letter-spacing:0}
.hint{font-size:11px;color:var(--muted);margin:-2px 0 8px}
.mini{color:var(--muted);font-size:11.5px}

/* ── Barras (etiqueta de valor directa sobre la barra — regla IBCS) ─── */
.barra-fila{display:grid;grid-template-columns:minmax(0,1fr) 66px;align-items:center;
  gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer}
.barra-fila:hover{background:var(--lienzo)}
.barra-fila .cat{font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.barra-fila .valor{grid-row:span 2;font-size:11.5px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;text-align:right}
.barra-pista{height:9px;position:relative}
.barra-relleno{position:absolute;left:0;top:0;bottom:0;background:var(--accent);
  border-radius:0 3px 3px 0;min-width:2px;transition:width .2s ease}
.barra-fila.apagada .barra-relleno{background:var(--desel)}
.barra-fila.activa .cat{color:var(--ink);font-weight:700}
.barra-fila.prod .barra-relleno{background:var(--producto)}
.barra-fila.brecha .barra-relleno{background:var(--sem-muybajo)}
.barra-fila:hover .barra-relleno{background:var(--accent-2)}

/* ── Tablas ─────────────────────────────────────────────────────────── */
.tabla-cab{display:flex;align-items:center;gap:8px;margin-bottom:4px}
/* Encabezado compacto de la tabla del panel: la tabla es lo que importa. */
.tabla-rail-tit{margin:0;flex:1;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink-2)}
.btn-mini{padding:3px 9px;font-size:11.5px}
.tab-datos{width:100%;border-collapse:collapse;font-size:11.5px}
.tab-datos th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;
  padding:5px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-2);border-bottom:1px solid var(--borde-2);white-space:nowrap}
.tab-datos td{padding:4px 6px;border-bottom:1px solid var(--borde);vertical-align:top}
.tab-datos th.num,.tab-datos td.num{text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tab-datos tbody tr:hover{background:var(--lienzo);cursor:pointer}
.tab-datos .sub{display:block;font-size:10px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tab-datos tr.fila-total td{font-weight:700;border-top:2px solid var(--ink);
  border-bottom:none;background:var(--lienzo)}
.tab-datos tr.fila-total:hover{background:var(--lienzo);cursor:default}
/* Encabezados ordenables (Tabla Detalle PDV y Ficha PDV) */
.tab-datos th.ordenable{cursor:pointer;user-select:none}
.tab-datos th.ordenable:hover{color:var(--ink)}
.tab-datos th.ordenable.activa{color:var(--ink)}
.tab-datos th .flecha{display:inline-block;width:10px;margin-left:2px;font-size:8px}
/* TOTAL fijo al pie de su contenedor con scroll (como el encabezado arriba).
   Con border-collapse el borde de una celda sticky no viaja con ella: la raya
   superior se pinta con box-shadow. */
.tab-datos tfoot tr.fila-total td{position:sticky;bottom:0;z-index:1;border-top:none;
  box-shadow:inset 0 2px 0 var(--ink)}
/* El sticky se ancla dentro del padding del .panel-body (16 px abajo): sin este
   desplazamiento las filas se asomaban por debajo del TOTAL. */
#tablaRail tfoot tr.fila-total td{bottom:-16px}

/* ── Overlay y modales ──────────────────────────────────────────────── */
.overlay{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;
  background:rgba(243,244,246,.8);font-weight:600;color:var(--ink-2)}
/* Antes era position:fixed sobre TODA la app y esperaba los 5 endpoints del mapa
   aunque la pestaña visible fuera Ventas MTD: ahora vive dentro de .mapa-wrap y
   solo tapa el mapa mientras este carga. */
.overlay .caja{background:var(--surface);border:1px solid var(--borde);padding:14px 28px;
  border-radius:var(--radio-lg);box-shadow:0 6px 20px rgba(17,24,39,.10)}
/* rgba(17,24,39,.35) sobre un fondo claro se ve casi igual de brillante que
   sin modal (un velo gris tenue, no un fondo oscurecido reconocible) —
   subido a .55 para que de verdad separe el modal del contenido de atras. */
.modal{display:none;position:fixed;inset:0;z-index:4000;background:rgba(17,24,39,.55);
  align-items:center;justify-content:center;padding:20px}
.modal .caja{background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio-lg);
  max-width:760px;width:100%;max-height:82vh;overflow:auto;padding:16px 18px;
  box-shadow:0 10px 30px rgba(17,24,39,.20)}
.modal h3{margin:0 0 10px;font-size:14.5px}
.modal pre{background:var(--lienzo);border:1px solid var(--borde);border-radius:var(--radio);
  padding:12px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;margin:0}
/* Tabla ampliada: ocupa casi toda la pantalla y la tabla todo el alto libre.
   Antes era 760 px × 58 vh y en un portátil había que deslizar con 15 PDV. */
#modalTabla{padding:16px}
.modal .caja.caja-tabla{max-width:none;width:100%;height:100%;max-height:none;
  display:flex;flex-direction:column;overflow:hidden}
.caja-tabla .tabla-wrap{flex:1;min-height:0;max-height:none}
.caja-tabla [hidden]{display:none!important}
.tabla-cab-modal{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.modal .tabla-cab-modal h3{margin:0}
.tabla-acciones{margin-left:auto;display:flex;gap:8px}
/* Barra de filtros de la Tabla Detalle PDV (mismo control que la cabecera). */
.t-filtros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin:0 0 10px}
.t-campos{display:contents}
.t-filtros .campo{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:1 1 150px;max-width:230px}
.t-filtros label{display:flex;align-items:center;gap:4px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-2)}
.t-filtros .acciones{display:flex;gap:8px;align-items:flex-end}
.t-filtros .pop-filtros{left:auto;right:0}
/* Ficha de un PDV (clic en una fila de la tabla ampliada) */
.ficha-pdv{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.ficha-info{font-size:12px;color:var(--ink-2);line-height:1.5}
.ficha-kpis{display:flex;gap:8px;flex-wrap:wrap}
.ficha-kpi{flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--borde);
  border-radius:var(--radio);box-shadow:var(--sombra);padding:8px 10px}
.ficha-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:16px}
.ficha-col{min-height:0;display:flex;flex-direction:column;gap:6px;overflow:auto}
.ficha-col h4{margin:4px 0 0;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.ficha-col .tabla-wrap{flex:1;min-height:0;max-height:none}
.ficha-col .tab-datos tbody tr:hover{cursor:default}
.ficha-col .btn-portafolio{flex:none}
@media(max-width:900px){
  .ficha-pdv{overflow:auto}
  .ficha-cuerpo{grid-template-columns:1fr;flex:none}
  .ficha-col{overflow:visible}
  .ficha-col .tabla-wrap{max-height:60vh}}
.tabla-controles{display:flex;align-items:center;gap:14px;margin:6px 0 10px;flex-wrap:wrap}
.tabla-controles select{padding:4px 6px;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-family:inherit}
.tabla-wrap{max-height:58vh;overflow:auto;border:1px solid var(--borde);border-radius:var(--radio)}
.tabla-wrap .tab-datos{font-size:12px}
.tabla-wrap .tab-datos .sub{max-width:none}

/* ── Popups del mapa y etiquetas ────────────────────────────────────── */
.popup-pdv h3{margin:0 0 5px;font-size:14px}
.popup-pdv,.popup-brick{font-size:12.5px;max-width:295px}
.popup-pdv a.enlace{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;
  padding:5px 10px;border-radius:5px;text-decoration:none;font-size:12.5px}
.popup-sellout{margin:7px 0;padding:7px 9px;background:var(--lienzo);
  border:1px solid var(--borde);border-radius:var(--radio);font-variant-numeric:tabular-nums}
.popup-sellout.prod{border-color:var(--producto);background:#f4f3fe}
.popup-sellout .grande{font-size:15px;font-weight:700}
.badge-pot{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--ink);
  color:#fff;font-size:10.5px;font-weight:700;vertical-align:middle;margin-left:4px}
.badge-agente{display:inline-block;font-size:11px;vertical-align:middle;margin-left:3px;cursor:default}
.tag-tipo{display:inline-block;padding:0 5px;border-radius:4px;background:var(--ink);
  color:#fff;font-size:9.5px;font-weight:700;vertical-align:middle;margin-left:3px;letter-spacing:.02em}
.tag-tipo.lam{background:var(--ink-2)}
.popup-brick ol{margin:5px 0 0;padding-left:18px}
.popup-brick li{margin-bottom:3px}
.btn-portafolio{display:block;width:100%;margin-top:8px;padding:6px;border:1px solid var(--accent);
  border-radius:var(--radio);background:var(--surface);color:var(--accent);font-size:12.5px;
  font-weight:600;font-family:inherit;cursor:pointer}
.btn-portafolio:hover{background:var(--accent);color:#fff}

/* ── Choices.js: repintado al lenguaje visual Power BI ──────────────── */
.choices{margin-bottom:0;font-size:12.5px}
.choices:focus{outline:none}
.choices__inner{background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio);
  min-height:31px;padding:3px 6px;font-size:12.5px;
  /* Dos filas de chips exactas: con más, el cuadro hace scroll en vez de
     dejar un chip cortado por la mitad ni estirar la cabecera. */
  max-height:52px;overflow-y:auto}
.choices.is-focused .choices__inner,.choices.is-open .choices__inner{
  border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-suave)}
.choices.is-open .choices__inner{border-radius:var(--radio)}
.choices[data-type*=select-one] .choices__inner{padding-bottom:3px}
.choices[data-type*=select-one]::after{border-color:var(--muted) transparent transparent}
.choices__list--multiple .choices__item{background:var(--accent-suave);border:1px solid #cfe0f6;
  color:var(--accent-2);border-radius:4px;font-size:11px;font-weight:600;
  padding:1px 6px;margin:1px 3px 1px 0;line-height:1.5}
.choices__list--multiple .choices__item.is-highlighted{background:#d8e7fa;border-color:var(--accent)}
.choices__list--multiple .choices__item .choices__button{border-left-color:#cfe0f6;
  margin:0 -2px 0 6px;padding-left:8px;opacity:.6}
/* Ancho propio del desplegable: los controles de la cabecera son angostos y los
   nombres de PDV/brick largos. Selector de 3 clases a propósito: el CSS de
   Choices trae `.choices__list[aria-expanded]{width:100%}`, que por especificidad
   (0,2,0) gana a un `.choices__list--dropdown` pelado. */
.filtros .choices .choices__list--dropdown,
.t-filtros .choices .choices__list--dropdown,
.mtd-filtros .choices .choices__list--dropdown{border:1px solid var(--borde);
  border-radius:var(--radio);box-shadow:0 8px 22px rgba(17,24,39,.14);z-index:3000;
  width:270px;min-width:100%;max-width:90vw}
.choices__list--dropdown .choices__list{max-height:270px}
.choices__list--dropdown .choices__item{font-size:12.5px;padding:6px 9px;
  word-break:normal;white-space:normal;overflow-wrap:break-word}
.choices__list--dropdown .choices__item--selectable.is-highlighted{background:var(--accent-suave)}
.choices__list--dropdown .choices__item--selectable::after{display:none}
.choices__input{background:transparent;font-size:12.5px;padding:2px 0;margin-bottom:2px;
  font-family:inherit}
.choices__placeholder{opacity:.55}
.choices__list--single{padding:1px 14px 1px 2px}
.choices__list--single .choices__item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-disabled .choices__inner{background:var(--surface-2)}

/* ── Responsivo: el panel baja, pero cada zona conserva scroll propio ─ */
@media(max-width:1180px){
  .topbar{gap:8px 14px}
  .acciones{padding-top:0}
}
@media(max-width:1000px){
  .cuerpo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,55fr) minmax(0,45fr);gap:10px}
  .divisor{display:none}
}
@media(max-width:780px){
  /* El mapa manda: la leyenda pasa a su propia línea en vez de apretarse
     junto a "Colorear por" y los checkboxes en una sola fila angosta. */
  .leyenda-inline{margin-left:0;flex-basis:100%;order:99}
  /* El reparto 55/45 de arriba es sobre el alto de .cuerpo, que ya viene
     recortado por la cabecera + pestañas de encima; sin un piso explícito,
     el mapa terminaba con ~28% de la pantalla real, no el 55% que parece.
     Con el piso, el panel derecho (KPIs+tabla) cede y hace scroll: el mapa
     es lo primero que se ve completo. */
  #vistaMapa .cuerpo{grid-template-rows:minmax(54vh,55fr) minmax(0,45fr)}
}

/* ══════════ Vistas de nivel superior + dashboard Ventas MTD ══════════
   .mtdtabs-top/.mtdtab-top llevan prefijo porque .tabs/.tab ya son del rail.
   #vistaMapa recibe el minmax(0,1fr) de .app y debe propagar ese alto a .cuerpo,
   que es quien hace que el mapa tenga altura; con flex, .avisos (display:none
   cuando no hay avisos) no consume espacio. #vistaVentasMtd hace su propio scroll.
   ══════════════════════════════════════════════════════════════════ */
#vistaMapa{display:flex;flex-direction:column;gap:10px;min-height:0}
#vistaMapa .cuerpo{flex:1 1 auto;min-height:0}
#vistaVentasMtd,#vistaSIvsSO,#vistaYoobic,#vistaSO{min-height:0;overflow-y:auto;padding:2px}
#vistaSO[hidden]{display:none}
/* El [hidden] del navegador es una regla del user-agent y pierde contra el
   display:flex de arriba, que va por ID: sin estas reglas la vista oculta
   se sigue pintando y se superpone con la activa en el grid de .app. */
#vistaMapa[hidden],
#vistaVentasMtd[hidden],
#vistaSIvsSO[hidden],
#vistaYoobic[hidden]{display:none}

.mtd-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mtd-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.mtd-head .sub{color:var(--muted);font-size:12.5px}
.mtd-head .acc{margin-left:auto;display:flex;gap:8px;align-items:center}

.mtd-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  padding:12px 14px;margin-bottom:12px}
.mtd-filtros .campo{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1 1 170px}
.mtd-filtros label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.mtd-filtros select,.mtd-filtros input[type=text]{padding:7px 8px;border:1px solid var(--borde);
  border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;width:100%}
.mtd-filtros .campo-ancho{flex:2 1 300px}
.mtd-filtros .acciones{display:flex;gap:8px}
.mtd-btn{padding:8px 14px;border:1px solid var(--ink);border-radius:6px;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.mtd-btn:hover{background:var(--accent-2);border-color:var(--accent-2)}

.mtd-estado{padding:26px 14px;text-align:center;color:var(--ink-2);font-size:13px}
.mtd-spinner{display:inline-block;width:15px;height:15px;margin-right:8px;vertical-align:-3px;
  border:2px solid var(--borde);border-top-color:var(--accent);border-radius:50%;
  animation:mtd-giro .8s linear infinite}
@keyframes mtd-giro{to{transform:rotate(360deg)}}

/* Antes topaba en 900px: en un monitor ancho la tarjeta se veía cortada a
   la mitad, con un vacío enorme a la derecha sin ninguna razón visual. */
.mtd-kpi{padding:16px 20px;margin-bottom:14px}
.mtd-kpi .cifras{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.mtd-kpi .bloque{min-width:230px}
.mtd-kpi .etq{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.mtd-kpi .num{font-size:23px;font-weight:700;line-height:1.2;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.mtd-kpi .num.pct{font-size:30px}
.mtd-kpi .det{font-size:12px;color:var(--muted);margin-top:3px}
.mtd-barra{margin-top:12px;height:12px;border-radius:999px;background:var(--lienzo);
  border:1px solid var(--borde);overflow:hidden}
.mtd-barra span{display:block;height:100%;border-radius:999px;transition:width .3s ease}

.mtd-grid{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:14px}
@media(max-width:1100px){.mtd-grid{grid-template-columns:1fr}}
.mtd-grid.mtd-grid-apilado{grid-template-columns:1fr}
.mtd-panel{padding:12px 14px;min-width:0}
.mtd-panel-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mtd-btn-csv{padding:3px 9px;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--surface);color:var(--ink-2);font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0}
.mtd-btn-csv:hover{color:var(--accent);border-color:var(--accent)}
.mtd-panel h3{margin:0 0 4px;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-2)}
.mtd-panel .hint{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.mtd-scroll{overflow-x:auto;max-height:430px;overflow-y:auto}

.mtd-tabla{width:100%;border-collapse:collapse;font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* Mismo lenguaje de encabezado que .tab-datos th (pestaña Mapa): antes esta
   tabla usaba una franja negra solida que no aparecia en ningun otro lugar
   de la app y la hacia sentir como una hoja de calculo pegada aparte. */
.mtd-tabla th{position:sticky;top:0;z-index:1;background:var(--surface);color:var(--ink-2);
  text-align:right;font-weight:700;font-size:9.5px;padding:6px 10px;
  text-transform:uppercase;letter-spacing:.04em;
  /* box-shadow y no border-bottom: con border-collapse el borde del th sticky se
     queda atrás al hacer scroll y la línea del encabezado desaparece. */
  box-shadow:inset 0 -1px 0 var(--borde-2)}
/* Encabezados ordenables (mtdTabla en JsVentasMtd.html). La flecha aparece solo
   en la columna activa; las demás muestran una pista suave al pasar el mouse. */
.mtd-tabla th.ord{cursor:pointer;user-select:none}
.mtd-tabla th.ord:hover{color:var(--accent)}
.mtd-tabla th.ord:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mtd-tabla th.ord::after{content:'';display:inline-block;width:0;margin-left:0}
.mtd-tabla th[aria-sort=descending]::after{content:'▼';font-size:8px;margin-left:4px;width:auto;color:var(--accent)}
.mtd-tabla th[aria-sort=ascending]::after{content:'▲';font-size:8px;margin-left:4px;width:auto;color:var(--accent)}
.mtd-tabla th[aria-sort=descending],.mtd-tabla th[aria-sort=ascending]{color:var(--ink)}
.mtd-tabla caption.ord-movil{display:none}
.mtd-tabla tbody tr.clicable{cursor:pointer}
.mtd-tabla tbody tr.clicable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Filtrado cruzado: fila elegida = fondo suave + franja fina de acento; con una
   selección activa, las no elegidas se atenúan (mismo criterio que .apagada). */
.mtd-tabla tbody tr.sel,.mtd-tabla tbody tr.sel:nth-child(even){background:var(--accent-suave)}
.mtd-tabla tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.mtd-tabla tbody tr.atenuada td{opacity:.45}
.mtd-tabla tbody tr.atenuada:hover td{opacity:.8}
.mtd-tabla td.nd{color:var(--muted);font-style:italic}
.mtd-tabla .nuevo{color:var(--ink-2);font-style:italic}
.mtd-avisos{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mtd-avisos[hidden]{display:none}
.mtd-tabla th:first-child,.mtd-tabla td:first-child{text-align:left;white-space:normal;min-width:150px}
.mtd-tabla td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--borde);color:var(--ink)}
.mtd-tabla tbody tr:nth-child(even){background:rgba(11,11,11,.02)}
.mtd-tabla tbody tr:hover{background:var(--lienzo)}
.mtd-tabla tbody tr.total{font-weight:700;background:var(--lienzo);color:var(--ink)}
.mtd-tabla tbody tr.total td{border-top:2px solid var(--ink);border-bottom:none}
/* Antes: celda con fondo solido plano (estilo formato condicional de Excel).
   Ahora: punto de color + texto, mismo patron que .pct-badge del resto de la
   app, para que "% Cumplimiento" no se lea como una hoja de calculo exportada. */
.mtd-tabla .celda-pct{font-weight:700}
.pct-badge{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.pct-badge .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mtd-tabla .pos{color:var(--sem-alto);font-weight:600}
.mtd-tabla .neg{color:var(--error);font-weight:600}

/* Sección 2: histórico. Mismo reparto 3fr/2fr que .mtd-grid de arriba. */
#mtdHistorico{margin-top:22px;padding-top:18px;border-top:2px solid var(--borde)}
.mtd-filtros-historico{padding:12px 14px;margin-bottom:12px}
.mtd-filtros-historico .campo{flex:0 1 150px;min-width:130px}
/* Año/Trimestre/Mes lado a lado en vez de tres bloques apilados: antes la
   tarjeta terminaba a la mitad de su ancho con un vacío grande a la derecha. */
.hist-filtros-fila{display:flex;flex-wrap:wrap;gap:10px 32px;align-items:flex-start}
.mtd-historico-layout{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
@media(max-width:1100px){.mtd-historico-layout{grid-template-columns:1fr}}
.mtd-historico-derecha{display:flex;flex-direction:column;gap:12px;min-width:0}
.mtd-historico-derecha .mtd-kpi{margin-bottom:0;max-width:none}
.mtd-historico-derecha .mtd-kpi .num{font-size:20px}
.mtd-historico-derecha .mtd-kpi .cifras{gap:18px}
.mtd-historico-derecha .mtd-kpi .bloque{min-width:150px}
.mtd-vacio{padding:18px 4px;color:var(--muted);font-size:12.5px;text-align:center}

/* ── Chips de Año/Trimestre del histórico (reemplazan los <select> — un
   clic en vez de un menú desplegable para el caso de uso más común) ──── */
.chips-etq{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:8px 0 4px}
.chips-periodo{display:flex;flex-wrap:wrap;gap:6px}
.chip-periodo{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--borde-2);
  cursor:pointer;white-space:nowrap;font-family:inherit}
.chip-periodo:hover{border-color:var(--ink)}
.chip-periodo.activo{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── Filtros activos (filtrado cruzado): mismo chip oscuro que .chip-periodo.activo
   con una × para quitarlo; "Quitar todos" es texto plano. ── */
.chips-activos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.chips-activos[hidden]{display:none}
.chips-activos-etq{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip-filtro{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;border-radius:999px;
  font-size:12px;font-weight:600;font-family:inherit;color:#fff;background:var(--ink);
  border:1px solid var(--ink);cursor:pointer;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-filtro .x{font-size:14px;line-height:1;opacity:.7;padding:0 3px}
.chip-filtro:hover .x{opacity:1}
.chip-filtro:focus-visible,.chip-filtro-limpiar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip-filtro-limpiar{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;
  color:var(--ink-2);cursor:pointer;text-decoration:underline;padding:4px 6px}
.chip-filtro-limpiar:hover{color:var(--accent)}

/* ── Gráficos clicables (barras de trimestre/mes, leyenda del donut): mismo
   estado seleccionado/atenuado que las filas de tabla ── */
.hist-barcol.clicable,.sivso-mescol.clicable{cursor:pointer;border-radius:6px}
.hist-barcol.clicable:hover,.sivso-mescol.clicable:hover{background:var(--lienzo)}
.hist-barcol.clicable:focus-visible,.sivso-mescol.clicable:focus-visible,.sivso-donut-it.clicable:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.hist-barcol.sel,.sivso-mescol.sel{background:var(--accent-suave);box-shadow:inset 0 -3px 0 var(--accent)}
.hist-barcol.atenuada .hist-bar,.sivso-mescol.atenuada .sivso-bar{opacity:.35}
.hist-barcol.atenuada .hist-barval,.hist-barcol.atenuada .hist-barcat,.sivso-mescol.atenuada .sivso-mescat{opacity:.5}

/* ── Gráfico Venta vs. Plan por trimestre (reemplaza la tabla "Por
   Trimestre": la misma información, más legible de un vistazo) ────────── */
.hist-chart{display:flex;align-items:flex-end;gap:20px;height:190px;padding:0 8px 4px;margin:10px 0 4px}
.hist-barcol{flex:1;max-width:110px;height:100%;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-end}
.hist-barval{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
/* La barra es el valor real (neutro, "esto pasó"); la línea de meta es el
   único rojo aquí (marca, "esto es lo que hay que alcanzar"). Antes la barra
   era roja siempre, sin importar si superaba el plan — el mismo rojo de
   marca terminaba leyéndose como alerta incluso en trimestres buenos, y
   además la línea de meta (negra) se confundía con el borde de la barra
   cuando venta≈plan. El halo blanco de hist-plantick la mantiene visible
   caiga sobre la barra o sobre el lienzo vacío encima de ella. */
.hist-bar{width:40px;border-radius:5px 5px 2px 2px;background:var(--ink)}
.hist-plantick{position:absolute;left:calc(50% - 26px);width:52px;height:3px;
  background:var(--accent);border-radius:2px;box-shadow:0 0 0 1.5px var(--surface)}
.hist-barcat{font-size:11px;color:var(--ink-2);font-weight:600;position:absolute;bottom:-20px}
.hist-legend{display:flex;gap:14px;padding:24px 4px 0;font-size:11px;color:var(--ink-2)}
.hist-legend .it{display:flex;align-items:center;gap:5px}
.hist-legend .sw-venta{width:9px;height:9px;border-radius:3px;background:var(--ink)}
.hist-legend .sw-plan{width:11px;height:3px;border-radius:2px;background:var(--accent)}

/* ══════════ SI vs SO ══════════
   Reutiliza .mtd-*/.card/.chips-periodo tal cual; solo lo específico de esta
   pestaña vive aquí: el detalle ΔSI%/ΔSO% de las tarjetas KPI, el gráfico de
   barras agrupadas SI/SO por mes y el donut de %Participación por BU. ────── */
.sivso-pos{color:var(--sem-alto);font-weight:600}
.sivso-neg{color:var(--error);font-weight:600}

/* Gráfico mensual: 2 barras por mes (Sell In oscuro, Sell Out rojo de marca)
   en vez de 1 sola como en hist-chart — mismo alto/etiquetado de categoría. */
.sivso-chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding:0 8px 22px;margin:10px 0 4px}
.sivso-mescol{flex:1;height:100%;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end}
.sivso-parbar{display:flex;align-items:flex-end;gap:3px;height:100%}
.sivso-bar{width:11px;border-radius:3px 3px 1px 1px}
.sivso-bar.si{background:var(--ink)}
.sivso-bar.so{background:var(--serie)}
.sivso-mescat{font-size:10.5px;color:var(--ink-2);font-weight:600;position:absolute;bottom:-18px}
.hist-legend .sw-so{width:9px;height:9px;border-radius:3px;background:var(--serie)}

/* ── SI vs SO (2026-10-29): KPIs + torta arriba; gráfico de 5 vistas a todo el ancho ── */
.sivso-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin-bottom:14px;align-items:stretch}
.sivso-top>.card{margin-bottom:0}
.sivso-top .mtd-kpi{display:flex;align-items:center}
/* KPIs de SI vs SO: 3 cifras en columnas iguales con divisor y, debajo, Sell In contra
   Sell Out de este año y del anterior en barras de una sola escala (llena la tarjeta). */
.sivso-top .sivso-kpis{flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding:12px 18px}
.sivso-kpis .cifras{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,.8fr);gap:0}
.sivso-kpis .bloque{min-width:0;padding:2px 18px;border-left:1px solid var(--borde)}
.sivso-kpis .bloque:first-child{border-left:none;padding-left:0}
.sivso-kpis .num{font-size:clamp(16px,1.3vw,25px);white-space:normal;overflow-wrap:anywhere}
.sivso-kpis .num.pct{font-size:clamp(24px,2.4vw,32px)}
.sivso-kpi-comp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--borde);padding-top:10px}
.kc-fila{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:12px;align-items:center}
.kc-anio{font-size:12px;font-weight:700;color:var(--ink-fuerte)}
.kc-fila.ant .kc-anio{font-weight:500;color:var(--muted)}
.kc-barras{display:flex;flex-direction:column;gap:3px}
.kc-b{position:relative;height:17px;display:flex;align-items:center}
.kc-b i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.kc-b i.si{background:#414141}.kc-b i.so{background:#d09375}
.kc-b i.si-py{background:#d2cfc9}.kc-b i.so-py{background:#ffc7ab}
.kc-b span{position:relative;font-size:11px;color:#fff;padding-left:8px;white-space:nowrap;
  text-shadow:0 0 3px rgba(0,0,0,.35)}
.kc-fila.ant .kc-b span{color:var(--ink);text-shadow:none}
.kc-b span b{font-weight:700}
.kc-ratio{text-align:right;font-size:17px;font-weight:700;color:var(--ink-fuerte);line-height:1.1}
.kc-ratio small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.kc-fila.ant .kc-ratio{color:var(--muted);font-size:15px}
@media(max-width:600px){.sivso-kpis .cifras{grid-template-columns:1fr;gap:12px}
  .sivso-kpis .bloque{border-left:none;padding:0}.kc-fila{grid-template-columns:64px minmax(0,1fr) 52px}}

/* ── Botón ⓘ de las gráficas: la explicación solo aparece al pasar el cursor / con foco ── */
.info{position:relative;display:inline-flex;vertical-align:middle;margin-left:7px;cursor:help;
  text-transform:none;letter-spacing:0;font-weight:400;outline:none}
.info-i{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--borde-2);color:var(--muted);
  font:700 10.5px/1 var(--font);font-style:italic;display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s ease,color .15s ease,border-color .15s ease}
.info:hover .info-i,.info:focus-visible .info-i{background:var(--durazno);border-color:var(--foco);color:var(--accent-2)}
.info .info-pop,.mtd-panel .info .info-pop{display:none;position:absolute;left:-12px;top:calc(100% + 9px);z-index:1500;
  width:max-content;max-width:min(340px,80vw);margin:0;padding:10px 13px;border-radius:10px;
  background:var(--ink-fuerte);color:#fff;font:400 12px/1.55 var(--font);white-space:pre-line;text-align:left;
  box-shadow:0 6px 22px rgba(46,46,43,.25)}
.info .info-pop::before{content:'';position:absolute;left:16px;top:-6px;border:6px solid transparent;border-top:none;
  border-bottom-color:var(--ink-fuerte)}
.info:hover .info-pop,.info:focus .info-pop{display:block}
/* En las tarjetas pegadas al borde derecho el globo abre hacia la izquierda. */
.so-abajo>.card:last-child .info .info-pop,.sivso-donut-card .info .info-pop{left:auto;right:-12px}
.so-abajo>.card:last-child .info .info-pop::before,.sivso-donut-card .info .info-pop::before{left:auto;right:16px}
.info:has(.info-pop:empty){display:none}
.sivso-donut-card{display:flex;flex-direction:column}
/* La torta y su leyenda centradas en todo el ancho de la tarjeta (antes quedaba un hueco a la derecha). */
.sivso-donut-card #sivsoDonutBu{flex:1;display:flex;flex-direction:column;justify-content:center}
.sivso-donut-card .sivso-donut-wrap{padding:4px 0;justify-content:center;gap:clamp(16px,3vw,40px);flex-wrap:nowrap}
.sivso-donut-card .sivso-donut{width:132px;height:132px}
.sivso-donut-card .sivso-donut-hueco{inset:20px}
.sivso-donut-card .sivso-donut-leyenda{min-width:150px}
.sivso-donut-card .sivso-donut-it{font-size:12.5px;padding:3px 8px}
@media(max-width:420px){.sivso-donut-card .sivso-donut-wrap{flex-wrap:wrap}}
.sivso-graf-card{position:relative}
.sivso-graf-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sivso-graf-cab h3{margin:0}
.sivso-graf-pre{color:var(--muted);font-weight:600}
.sivso-graf-nav{display:flex;gap:4px;flex-wrap:wrap}
.sivso-punto{display:flex;align-items:center;gap:6px;border:1px solid var(--borde);background:var(--surface);
  border-radius:999px;padding:4px 10px;font:inherit;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.sivso-punto i{width:7px;height:7px;border-radius:50%;background:var(--borde-2)}
.sivso-punto:hover{border-color:var(--ink-2)}
.sivso-punto.activo{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sivso-punto.activo i{background:var(--durazno)}
.sivso-graf-cuerpo{position:relative;padding:0 34px}
.sivso-flecha{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:64px;border:1px solid var(--borde);
  background:var(--surface);border-radius:999px;font-size:26px;line-height:1;color:var(--ink-2);cursor:pointer;z-index:2}
.sivso-flecha:hover{background:var(--surface-2);color:var(--ink);border-color:var(--foco)}
.sivso-flecha.izq{left:0}.sivso-flecha.der{right:0}
.sivso-med{margin:8px 0 0}
.sivso-svg{display:block;width:100%;height:auto;font-family:var(--font);margin-top:8px;overflow:visible}
.sivso-svg .sv-eje{font-size:11px;fill:var(--muted)}
.sivso-svg .sv-cat{font-size:12px;fill:var(--ink-2)}
.sivso-svg .sv-val{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.sivso-svg .sv-pct{font-size:12.5px;font-style:italic;fill:var(--ink);font-weight:600}
.sivso-svg .sv-fila{font-size:13px;fill:var(--ink);font-weight:600}
.sivso-svg .sv-py{fill:var(--muted);font-weight:500}
.sivso-svg .sv-b{font-weight:700;fill:var(--ink-fuerte)}
.sivso-svg .sv-titulo{font-size:18px;font-weight:700;fill:var(--ink-fuerte)}
.sivso-svg .sv-sub{font-size:12px;fill:var(--muted)}
.sivso-svg .sv-fin{font-size:12px;font-weight:700}
.sivso-svg .sv-fin-v{font-size:11px;fill:var(--muted)}
.sivso-svg .sv-hit{fill:transparent}
.sivso-svg .sivso-mescol{cursor:pointer;outline:none}
.sivso-svg .sivso-mescol:hover .sv-hit,.sivso-svg .sivso-mescol:focus-visible .sv-hit{fill:rgba(65,65,65,.05)}
.sivso-svg .sivso-mescol.sel .sv-hit{fill:var(--accent-suave)}
.sivso-svg .sivso-mescol.atenuada{opacity:.35}
.sivso-svg .sv-lineas{pointer-events:none}
.sivso-ley{justify-content:center;margin-top:6px}
.sivso-ley .sw{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw-ac{background:#414141}.sw-py{background:#d2cfc9}.sw-pyl{background:#8a8a8a;height:3px!important}
.sw-so{background:#d09375;height:3px!important}
.sw-sopy{height:3px!important;background:repeating-linear-gradient(90deg,#d09375 0 6px,transparent 6px 9px)}
.sw-pos{background:#086124}.sw-neg{background:#b71c1c}
.sw-inv{background:#725140;height:3px!important}
.sw-invpy{height:3px!important;background:repeating-linear-gradient(90deg,#8a8a8a 0 6px,transparent 6px 9px)}
.sivso-tip{position:absolute;z-index:5;min-width:230px;background:var(--surface);border:1px solid var(--borde);
  border-radius:var(--radio);box-shadow:0 6px 18px rgba(46,46,43,.16);padding:8px 10px;font-size:12px;pointer-events:none}
.sivso-tip[hidden]{display:none}
.sivso-tip .t{font-weight:700;margin-bottom:4px;color:var(--ink-fuerte)}
.sivso-tip table{border-collapse:collapse;width:100%}
.sivso-tip td{padding:2px 0;font-variant-numeric:tabular-nums}
.sivso-tip td:last-child{text-align:right;font-weight:700;padding-left:14px}
.sivso-tip .sw{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px}
.sivso-tip .pie{margin-top:4px;font-size:10.5px;color:var(--muted)}
/* Histórico mensual */
.sivso-hist{font-size:11.5px}
.sivso-hist th,.sivso-hist td{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding:6px 5px}
.sivso-hist .anio{text-align:left;font-weight:700}
.sivso-hist th.clicable,.sivso-hist tbody tr.clicable{cursor:pointer}
.sivso-hist th.clicable:hover{color:var(--ink-fuerte);background:var(--surface-2)}
.sivso-hist th.sel{background:var(--accent-suave);box-shadow:inset 0 -3px 0 var(--accent)}
.sivso-hist td.msel{background:#fff8f3}
.sivso-hist tbody tr.sel td{background:var(--surface-2);font-weight:600}
.sivso-hist tbody tr.clicable:hover td{background:var(--lienzo)}
.sivso-hist .tot{font-weight:700;color:var(--ink-fuerte)}
.sivso-hist tfoot td{font-weight:700;border-top:2px solid var(--borde-2)}
@media(max-width:1000px){.sivso-top{grid-template-columns:1fr}}
@media(max-width:600px){
  .sivso-graf-cuerpo{padding:0}
  .sivso-flecha{display:none}
  .sivso-punto span{display:none}
  .sivso-punto{padding:6px}
  .sivso-graf-pre{display:none}
}

/* ══════════ SO · Sell Out PDV (JsSO) ══════════ */
/* Barra compacta: Año y Vista fijos; Mes / Trimestre / Promedio Selec / dimensiones con "+ Añadir filtro". */
.so-filtros{align-items:flex-end;padding:8px 12px;gap:8px 10px;margin-bottom:10px}
.so-filtros .chips-etq{margin-bottom:3px}
.so-filtros .chip-periodo{padding:4px 10px;font-size:11.5px}
.so-filtros .campo{min-width:150px;flex:1 1 160px;gap:2px}
.so-filtros .campo.so-chips{flex:0 1 auto;min-width:0}
.so-filtros .choices__inner{min-height:32px;padding:3px 6px 1px}
.so-filtros .acciones .btn{padding:6px 11px}
.so-meses .chip-periodo{padding:4px 8px}
/* SI vs SO: separación pareja entre tarjetas (antes quedaban pegadas unas a otras). */
#sivsoContenido>.card{margin-bottom:14px}
/* Tarjetas colapsables (iniciarColapsables): botón arriba a la derecha; plegada = solo la cabecera. */
.card.con-colapsar{position:relative}
.card.con-colapsar>.cab-col{padding-right:36px}
.btn-colapsar{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;border:1px solid var(--borde);
  background:var(--surface);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.btn-colapsar svg{width:18px;height:18px;fill:currentColor;transition:transform .2s ease}
.btn-colapsar:hover{border-color:var(--foco);background:var(--durazno);color:var(--accent-2)}
.card.colapsada>.btn-colapsar svg{transform:rotate(180deg)}
.card.colapsada>:not(.cab-col):not(.btn-colapsar){display:none!important}
.card.colapsada{align-self:start;padding-bottom:10px}
.card.colapsada>.cab-col{margin-bottom:0}
.sivso-top>.card.colapsada{gap:0}
/* Inventario en barras */
.sivso-svg .sv-inv-v{font-size:11px;font-weight:600;fill:#725140}
.sivso-svg .sv-inv-dentro{font-size:10.5px;font-weight:600;fill:#fff}
.sivso-svg .sv-cat-p{font-size:9.5px}
.sw-invb{background:#725140}
/* Sell Out PDV: cabecera de la visual con buscador + CSV */
.so-cab-acc{display:flex;align-items:center;gap:8px}
/* SI vs SO: botón ★ Lanzamientos (encendido = solo productos INNOVACIÓN de Products 2026) */
.chip-lanz{white-space:nowrap}
/* Vista "Lanzamientos" del gráfico mensual */
.sivso-lz{margin-top:10px;font-variant-numeric:tabular-nums}
.lz-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--surface-2);margin-bottom:12px}
.lz-res>div{padding:10px 14px;border-left:1px solid var(--borde);display:flex;flex-direction:column;gap:2px;min-width:0}
.lz-res>div:first-child{border-left:none}
.lz-res .e{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.lz-res b{font-size:20px;font-weight:700;color:var(--ink-fuerte);line-height:1.2}
.lz-res small{font-size:11px;color:var(--muted)}
.lz-sw{display:inline-block;width:12px;height:8px;border-radius:2px}
.lz-sw.si{background:#414141}.lz-sw.so{background:#d09375}
.lz-cab,.lz-fila{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.4fr) 150px;gap:14px;align-items:center}
.lz-cab{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  padding:0 8px 6px;border-bottom:1px solid var(--borde-2)}
.lz-cab span:last-child{text-align:right}
.lz-lista{max-height:470px;overflow-y:auto}
.lz-fila{padding:8px;border-bottom:1px solid var(--borde);cursor:pointer;border-radius:4px}
.lz-fila:hover{background:var(--lienzo)}
.lz-fila:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lz-fila.sel{background:var(--accent-suave);box-shadow:inset 3px 0 0 var(--accent)}
.lz-fila.atenuada{opacity:.45}
.lz-nom{font-size:12.5px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lz-nom small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}
.lz-barras{display:flex;flex-direction:column;gap:3px;min-width:0}
.lz-b{display:flex;align-items:center;gap:6px;height:13px}
.lz-b i{display:block;height:100%;border-radius:0 3px 3px 0;min-width:2px;flex:0 0 auto;max-width:calc(100% - 70px)}
.lz-b i.si{background:#414141}.lz-b i.so{background:#d09375}
.lz-b em{font-style:normal;font-size:11px;color:var(--ink-2);white-space:nowrap}
.lz-abs{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.lz-p{font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--lienzo);color:var(--ink-2);white-space:nowrap}
.lz-p.ok{background:#e6f1e9;color:#086124}.lz-p.med{background:#f4ece6;color:#725140}.lz-p.baja{background:#fbe9e9;color:#b71c1c}
.lz-res .lz-p{font-size:20px;padding:0;background:none}
.lz-reg{position:relative;width:62px;height:6px;border-radius:3px;background:var(--borde)}
.lz-reg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#8a8a8a}
.lz-reg i.ok{background:#086124}.lz-reg i.med{background:#d09375}.lz-reg i.baja{background:#b71c1c}
.lz-reg u{position:absolute;left:66.67%;top:-3px;bottom:-3px;width:1.5px;background:var(--ink)}
.lz-ley{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--ink-2);align-items:center}
.lz-ley span{display:flex;align-items:center;gap:6px}
.lz-ley .lz-p{font-size:11px;padding:1px 7px}
.lz-reg-ley u{display:inline-block;width:1.5px;height:12px;background:var(--ink)}
@media(max-width:700px){
  .lz-res{grid-template-columns:1fr 1fr}.lz-res>div:nth-child(3){border-left:none}
  .lz-res>div:nth-child(n+3){border-top:1px solid var(--borde)}
  .lz-cab{display:none}
  .lz-fila{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nom abs" "bar bar";gap:6px 10px}
  .lz-nom{grid-area:nom}.lz-abs{grid-area:abs}.lz-barras{grid-area:bar}
  .lz-reg{display:none}
}
.chip-lanz.activo{background:var(--durazno);border-color:var(--foco);color:var(--accent-2)}
.chip-lanz .mtd-spinner{width:11px;height:11px;margin-right:6px;vertical-align:-1px}
#sivsoCampos .so-chips{flex:0 1 auto;min-width:0}
.sivso-hist .tot small{font-weight:500;color:var(--muted)}
.sivso-svg .sv-hit-tot{cursor:help}
@media(max-width:600px){.so-visual-cab{flex-wrap:wrap}.so-cab-acc{width:100%}.so-cab-acc>span{flex:1}.so-buscar{width:100%}}
.so-cuerpo{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
/* Tarjetas en fila arriba; el visual ocupa todo el ancho debajo */
.so-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.so-kpi{padding:14px 12px;text-align:center;margin:0}
/* Filtro "Promedio Selec": chips de mes + el valor */
.so-prom{min-width:260px}
.so-prom .chips-periodo{flex-wrap:wrap}
.so-prom-v{margin-top:6px;font-size:12px;color:var(--muted)}
.so-prom-v b{font-size:16px;color:var(--ink-fuerte);font-variant-numeric:tabular-nums}
.so-kpi .v{font-size:22px;font-weight:700;color:var(--ink-fuerte);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.so-kpi .e{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-top:2px}
.so-kpi .d{font-size:11px;margin-top:4px;color:var(--muted)}
.so-kpi .d.pos{color:var(--sem-alto)}.so-kpi .d.neg{color:var(--error)}
.so-visual-card{margin:0;min-width:0}
.so-visual-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.so-visual-cab h3{margin:0}
.so-buscar{padding:6px 12px;border:1px solid var(--borde);border-radius:999px;background:var(--lienzo);font-family:inherit;font-size:12.5px;width:220px}
.so-vistas{margin:8px 0 4px;border-bottom:1px solid var(--borde)}
.so-vistas{display:flex;overflow-x:auto;scrollbar-width:thin}
.so-vistas .tab{font-size:13px;white-space:nowrap;flex-shrink:0}
.so-visual{min-height:200px;position:relative}
.so-visual .vt3-chart{max-height:560px;overflow-y:auto}
.so-abajo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.so-abajo>.card{margin:0;min-width:0}
.so-donut-wrap{justify-content:center}
.so-compacto .vt3-fila{padding-top:3px;padding-bottom:3px}
/* Columna Inventario (Crecimiento por EAN y Top Clientes) */
.vt3-chart.con-inv .vt3-fila{grid-template-columns:minmax(150px,1.6fr) 64px minmax(130px,2.2fr) minmax(130px,2fr) minmax(120px,1.6fr) 74px 78px}
.vt3-fila .inv{justify-content:flex-end;color:#725140;font-weight:600;border-left:1px solid var(--borde);padding-left:4px}
.vt3-encab .inv,.so-th-inv{justify-content:flex-end}
.vt3-encab .so-th-inv .vt3-th{color:#725140;font-weight:700}
.so-abrir{border:none;background:none;cursor:pointer;color:var(--ink-2);font-size:15px;width:18px;padding:0;margin-right:4px;
  display:inline-block;transition:transform .15s ease}
.so-abrir.abierto{transform:rotate(90deg);color:var(--accent)}
.vt3-fila.so-hijo{background:var(--surface-2);font-size:11.5px}
.vt3-fila.so-hijo .nom{padding-left:22px}
/* La tabla de Crecimiento por BU necesita ~700 px: por debajo de 1700 px de pantalla las dos
   tortas van lado a lado y la tabla pasa a su propia fila, a todo el ancho. */
@media(max-width:1700px){.so-abajo{grid-template-columns:1fr 1fr}.so-abajo>.card:nth-child(2){grid-column:1/-1;order:3}}
@media(max-width:800px){.so-kpis{grid-template-columns:1fr 1fr}.so-abajo{grid-template-columns:1fr}}

/* Donut CSS puro (conic-gradient): sin librería de gráficos, consistente con
   el resto del visor (hist-chart también es divs a mano, no un chart.js). */
.sivso-donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:6px 0}
.sivso-donut{width:150px;height:150px;border-radius:50%;flex-shrink:0;position:relative}
.sivso-donut-hueco{position:absolute;inset:20px;border-radius:50%;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:inset 0 0 0 1px var(--borde)}
.sivso-donut-hueco span{display:block;font-size:13px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums}
.sivso-donut-hueco .et{font-size:9.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.sivso-donut-leyenda{display:flex;flex-direction:column;gap:6px;min-width:0}
.sivso-donut-it{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);
  background:none;border:none;font-family:inherit;text-align:left;padding:3px 6px;margin:-3px -6px;
  border-radius:6px;width:calc(100% + 12px)}
.sivso-donut-it.clicable{cursor:pointer}
.sivso-donut-it.clicable:hover{background:var(--lienzo)}
.sivso-donut-it.sel{background:var(--accent-suave);box-shadow:inset 3px 0 0 var(--accent);color:var(--ink)}
.sivso-donut-it.atenuada{opacity:.45}
.sivso-donut-it .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sivso-donut-it .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.sivso-donut-it .pct{margin-left:auto;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* ── Móvil: filtros colapsados detrás de un botón (Mapa y Ventas MTD) ───
   Antes la barra de filtros completa (Período/Meses/chips/+Filtro/acciones)
   competía por espacio con el mapa o el informe en cualquier ancho; ahora,
   por debajo de 780px, se oculta y aparece como un panel flotante solo
   mientras el usuario la pide. ── */
.btn-filtros-mv{display:none;justify-content:space-between;gap:8px;min-width:150px}
.btn-filtros-mv .chev{font-size:9px;color:var(--muted);transition:transform .15s ease}
.btn-filtros-mv.abierto{border-color:var(--accent);color:var(--accent)}
.btn-filtros-mv.abierto .chev{transform:rotate(180deg);color:var(--accent)}
#btnFiltrosMovil[hidden]{display:none}
@media(max-width:780px){
  .btn-filtros-mv{display:flex}
  .filtros{display:none;position:absolute;top:calc(100% + 6px);left:8px;right:8px;
    z-index:1300;background:var(--surface);border:1px solid var(--borde);
    border-radius:var(--radio-lg);box-shadow:0 10px 28px rgba(17,24,39,.18);
    padding:10px;max-height:min(60vh,420px);overflow-y:auto}
  .filtros.abierto{display:flex}
  .marca .sub{display:none}
  .acciones{flex-wrap:wrap}
  /* Mismo patrón para los filtros propios de Ventas MTD (Canal/KAM/Cliente):
     antes solo el mapa los colapsaba y el informe los dejaba siempre
     expandidos — inconsistente entre pestañas de la misma app. */
  .mtd-filtros{display:none;position:relative}
  .mtd-filtros.abierto{display:flex}
}

/* ── Móvil: las tablas anchas de Ventas MTD (hasta 8 columnas) se leen
   como tarjetas apiladas en vez de forzar scroll horizontal. Requiere que
   cada <td> (salvo el primero) traiga data-th="<mismo texto del th>". ── */
@media(max-width:700px){
  .mtd-tabla thead{display:none}
  .mtd-tabla caption.ord-movil{display:flex;gap:8px;align-items:center;padding:4px 0 8px;
    font-size:11px;color:var(--ink-2);text-align:left;caption-side:top}
  .mtd-tabla caption.ord-movil label{flex:1;display:flex;gap:6px;align-items:center}
  .mtd-tabla caption.ord-movil select{flex:1;padding:5px 6px;border:1px solid var(--borde);
    border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px}
  .mtd-tabla caption{display:block}
  .mtd-tabla,.mtd-tabla tbody,.mtd-tabla tr,.mtd-tabla td{display:block;width:100%}
  .mtd-tabla{white-space:normal}
  .mtd-tabla tr{padding:8px 2px;border-bottom:1px solid var(--borde)}
  .mtd-tabla tr.total{border-bottom:none}
  .mtd-tabla td{border:none;padding:2px 0;text-align:right}
  .mtd-tabla td:first-child{font-weight:700;text-align:left;color:var(--ink);padding-bottom:4px}
  .mtd-tabla td:not(:first-child)::before{content:attr(data-th);float:left;font-size:9.5px;
    font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
}

/* ══════════ Yoobic · Perfect Store (JsYoobic.html) ══════════
   Mismo lenguaje que Ventas MTD / SI vs SO (Zebra BI): etiquetas directas,
   color SOLO con significado (semáforo SEM del nivel del puntaje; rojo
   = agotado). Las tarjetas de foto imitan la galería de Yoobic.            */
.mtd-tabla td.txt{text-align:left;white-space:normal}
.mtd-tabla td .sub{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.yb-rojo{color:var(--sem-muybajo)}
.yb-nd{color:var(--muted)}
.yb-pt{display:inline-flex;align-items:center;gap:5px}
.yb-pt i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Barra de filtros: Fecha + selectores dinámicos + "+ Añadir filtro". */
.yb-filtros{align-items:flex-end}
.yb-campos{display:contents}
.yb-campo[hidden]{display:none}
.yb-campo label{display:flex;align-items:center;gap:4px}
.yb-campo-fecha{flex:0 1 230px;min-width:200px}
.yb-fecha-fila{display:flex;gap:6px;flex-wrap:wrap}
.yb-fecha-fila select,.yb-fecha-fila input{padding:6px 7px;border:1px solid var(--borde-2);border-radius:var(--radio);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-family:inherit}
.yb-fecha-fila select{flex:1 1 150px}
.yb-fecha-fila input[hidden]{display:none}
.yb-pop{left:auto;right:0}

/* Sub-pestañas + alcance (última encuesta / todas). */
.yb-subbarra{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-bottom:12px;border-bottom:1px solid var(--borde)}
.yb-subtabs{border-bottom:none;padding:0}
.yb-subtabs .tab{font-size:13px;padding:8px 14px}
.yb-alcance{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.yb-alcance[hidden]{display:none}
.yb-alcance .chips-etq{margin:0}
.yb-alcance .chip-periodo{padding:4px 10px;font-size:11.5px}

/* KPIs por pilar */
.yb-kpis-card{padding:14px 16px;margin-bottom:14px}
.yb-kpis{display:grid;grid-template-columns:1.25fr repeat(4,1fr) 1.15fr;gap:12px}
.yb-kpi{min-width:0;padding:4px 10px;border-left:1px solid var(--borde)}
.yb-kpi:first-child{border-left:none;padding-left:0}
.yb-kpi .etq{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yb-kpi .num{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.yb-kpi-global .num{font-size:32px}
.yb-kpi .de{font-size:12px;font-weight:600;color:var(--muted)}
.yb-kpi .det{font-size:11px;color:var(--muted);margin-top:2px}
.yb-kpi .det b{color:var(--ink)}
.yb-kpi-meta{display:flex;flex-direction:column;gap:2px}
.yb-pista{height:6px;background:var(--lienzo);border-radius:3px;margin-top:5px;overflow:hidden}
.yb-pista span{display:block;height:100%;border-radius:3px}
.yb-col-der{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Columnas por mes (etiqueta directa encima, color = nivel). */
.yb-cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding:4px 2px 0;margin-bottom:10px;overflow-x:auto}
.yb-col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;height:100%;min-width:34px}
.yb-col-val{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.yb-col-pista{flex:1;width:70%;display:flex;align-items:flex-end;border-bottom:1px solid var(--borde-2)}
.yb-col-pista span{display:block;width:100%;border-radius:3px 3px 0 0}
.yb-col-etq{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.yb-scroll-corto{max-height:220px}
.yb-scroll-alto{max-height:560px}

/* Agotados: productos como "pills" */
.yb-pills{white-space:normal;max-width:520px}
.yb-pill{display:inline-block;margin:1px 3px 1px 0;padding:1px 7px;border-radius:999px;font-size:10.5px;
  background:#fdf0f0;color:var(--sem-muybajo);border:1px solid #f6c9ce;white-space:nowrap}
.yb-pill-mas{background:var(--lienzo);color:var(--ink-2);border-color:var(--borde)}

/* Galería de fotos (tarjetas como en Yoobic) */
.yb-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.yb-foto{background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio-lg);overflow:hidden;
  cursor:pointer;box-shadow:var(--sombra);text-decoration:none;color:inherit;display:block}
.yb-foto:hover,.yb-foto:focus-visible{border-color:var(--accent);outline:none}
.yb-foto-img{aspect-ratio:4/3;background:var(--lienzo);overflow:hidden}
.yb-foto-img img{width:100%;height:100%;object-fit:cover;display:block}
.yb-foto-cuerpo{padding:8px 10px 10px;font-size:12px;line-height:1.35}
.yb-foto-usr{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:11.5px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yb-avatar{flex:0 0 18px;height:18px;border-radius:50%;border:1px solid var(--ink-2);display:inline-flex;
  align-items:center;justify-content:center;font-size:10px;color:var(--ink-2)}
.yb-foto-pdv{margin-top:4px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yb-foto-dir{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yb-foto-tit{margin-top:5px;font-weight:700;color:var(--ink)}
.yb-foto-fecha{color:var(--ink-2);font-size:11.5px}
.yb-mas{text-align:center;margin:16px 0}

/* Modal de fotos: últimas fotos e historial antes / después */
.modal .caja.caja-yb{max-width:1100px;max-height:90vh}
.yb-modal-cab{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.yb-modal-cab>div:first-child{flex:1;min-width:200px}
.yb-modal-cab h3{margin:0 0 2px}
.yb-cerrar{width:26px;height:26px;font-size:14px}
.yb-modal-sub{font-size:12.5px;color:var(--ink-2);margin:6px 0 8px}
.yb-modal-sub select{padding:4px 6px;border:1px solid var(--borde-2);border-radius:var(--radio);font-family:inherit}
.yb-galeria-modal{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.yb-mini-pilares{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-2);margin:4px 0 10px}
.yb-mini.g{font-weight:700;color:var(--ink)}
.yb-mini em{font-style:normal;font-size:10.5px;margin-left:3px}
.yb-mini em.sube{color:var(--sem-alto)}
.yb-mini em.baja{color:var(--sem-muybajo)}
.yb-comparar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.yb-lado{border:1px solid var(--borde);border-radius:var(--radio-lg);padding:10px;min-width:0}
.yb-lado-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.yb-lado-cab select{max-width:65%;padding:4px 6px;border:1px solid var(--borde-2);border-radius:var(--radio);font-family:inherit;font-size:12px}
.yb-lado a{display:block}
.yb-lado-fotos{display:grid;gap:6px}
.yb-lado-fotos.varias{grid-template-columns:repeat(2,minmax(0,1fr))}
img.yb-grande{width:100%;max-height:40vh;object-fit:contain;background:var(--lienzo);border-radius:var(--radio);display:block}
.yb-lado-fotos.varias img.yb-grande{max-height:24vh}
.yb-linea-tiempo{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;margin-top:10px;border-top:1px solid var(--borde)}
.yb-hito{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:2px solid transparent;
  border-radius:var(--radio);background:var(--surface);cursor:pointer;font-family:inherit;font-size:10.5px;color:var(--ink-2)}
.yb-hito img{width:86px;height:64px;object-fit:cover;border-radius:4px;display:block}
.yb-hito:hover{border-color:var(--borde-2)}
.yb-hito.es-a{border-color:var(--ink-2)}
.yb-hito.es-d{border-color:var(--accent)}

/* Bloque Perfect Store del popup del mapa */
.popup-ps{margin:8px 0;padding:8px 9px;border:1px solid var(--borde);border-radius:var(--radio);background:var(--surface-2)}
.popup-ps .ps-cab{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px}
.popup-ps .ps-global .grande{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.popup-ps .ps-fila{display:grid;grid-template-columns:118px 1fr auto auto;align-items:center;gap:5px;font-size:11.5px;margin-top:3px}
.popup-ps .ps-nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.popup-ps .ps-pista{height:6px;background:var(--lienzo);border-radius:3px;overflow:hidden}
.popup-ps .ps-pista span{display:block;height:100%}
.popup-ps .ps-agot{font-size:11.5px;margin-top:5px}
.popup-ps .btn-portafolio{margin-top:6px}

@media(max-width:1100px){
  .yb-kpis{grid-template-columns:repeat(3,1fr)}
  .yb-kpi:nth-child(4){border-left:none;padding-left:0}
}
@media(max-width:700px){
  .yb-kpis{grid-template-columns:1fr 1fr}
  .yb-kpi{border-left:none;padding-left:0}
  .yb-comparar{grid-template-columns:1fr}
  .yb-galeria{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
}

/* ══════════ Base de la pestaña Ventas: barra, switches y resumen del mes (vt-*) ══════════
   Quedan de la antigua pestaña Ventas (cartera del KAM, retirada el 2026-10-13); las usan
   la barra y el resumen del mes de "Ventas" (JsVentas3.html, antes "Ventas 3.0"). Zebra BI:
   etiquetas directas, color solo con significado. SOLO DATOS REALES: en la barra, lo rayado
   es el mismo mes del año pasado completo (no una proyección). */
body:not(.vista-mapa) .btn-centrar{display:none}

.vt-barra{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:10px 14px;margin-bottom:10px}
.vt-ctrl{display:flex;gap:8px;align-items:flex-end;margin-left:auto;flex-wrap:wrap}
.vt-campo{display:flex;flex-direction:column;gap:2px}
.vt-campo span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.vt-campo select{min-width:170px;max-width:240px;padding:7px 8px;border:1px solid var(--borde-2);border-radius:var(--radio);
  background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit}
.vt-campo select:focus,.vt-buscar:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-suave)}

/* Switches del resumen: vs plan / vs sell-out · $ / # · ventana de meses */
.vt-hero-cab{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.vt-hero-cab h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.vt-switches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vt-switch{display:inline-flex;padding:2px;border:1px solid var(--borde-2);border-radius:999px;background:var(--surface)}
.vt-switch button{border:none;background:none;padding:5px 12px;border-radius:999px;font:inherit;font-size:12px;
  font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.vt-switch button.activo{background:var(--ink);color:#fff}
.vt-switch button:disabled{cursor:default;opacity:.4}
.vt-switch.chico button{padding:4px 9px;font-size:11.5px}

/* Rótulos, cifras y deltas */
.vt-etq{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.vt-det{font-size:12px;color:var(--muted);margin-top:2px}
.vt-det b{color:var(--ink)}
.vt-num-xl{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.vt-num-l{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.vt-num-m{font-size:17px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.vt-pos{color:var(--sem-alto);font-weight:600}
