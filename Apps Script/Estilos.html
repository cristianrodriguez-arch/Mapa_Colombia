.vt-neg{color:var(--error);font-weight:600}
.vt-na{color:var(--muted)}
.vt-nota{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 0}
/* Asterisco "valorizado a PVL": muy discreto, a pedido del usuario. */
.vt-pvl{color:var(--muted);font-weight:400;margin-left:1px;cursor:help}
.vt-pvl-nota{font-size:10px;color:#a3a6ad;margin-top:8px}

/* Resumen */
.vt-hero{padding:14px 16px}
.vt-hero-tit{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.vt-hero-tit span{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:4px}
.vt-hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vt-hero-der{text-align:right}
.vt-bg{position:relative;height:26px;margin:24px 0 6px}
.vt-bg-pista{position:absolute;left:0;top:3px;bottom:3px;background:#e9eaee;border-radius:3px}
.vt-bg-rayado{position:absolute;left:0;top:7px;bottom:7px;border-radius:2px;
  background:repeating-linear-gradient(135deg,rgba(43,40,48,.35) 0 2px,transparent 2px 5px)}
.vt-bg-barra{position:absolute;left:0;top:7px;bottom:7px;border-radius:2px;background:var(--ink)}
.vt-bg-barra.so{background:var(--serie)}
.vt-bg-raya{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink)}
.vt-bg-raya span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;
  font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap}
/* Cerca de los bordes el rótulo se ancla hacia adentro para no salirse de la tarjeta. */
.vt-bg-raya.izq span{left:-1px;transform:none}
.vt-bg-raya.der span{left:auto;right:-1px;transform:none}
.vt-bg-meta{position:absolute;top:0;bottom:0;width:0;border-left:2px dotted var(--muted)}
.vt-bg-meta span{position:absolute;top:100%;left:0;transform:translateX(-50%);margin-top:1px;font-size:10px;color:var(--muted);white-space:nowrap}
.vt-bg-ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink-2);margin:14px 0 4px}
.vt-bg-ley span{display:inline-flex;align-items:center;gap:5px}
.vt-bg-ley i{display:inline-block;width:14px;height:8px;border-radius:2px}
.vt-bg-ley .sw-barra{background:var(--ink)}
.vt-bg-ley .sw-barra.so{background:var(--serie)}
.vt-bg-ley .sw-raya{width:2px;height:12px;background:var(--ink)}
.vt-bg-ley .sw-rayado{background:repeating-linear-gradient(135deg,rgba(43,40,48,.45) 0 2px,transparent 2px 5px);border:1px solid var(--borde-2)}
.vt-bg-ley .sw-pista{background:#e9eaee}
.vt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--borde)}

/* Buscador, enlaces y tablas */
.vt-buscar{width:100%;padding:8px 10px;margin-bottom:8px;border:1px solid var(--borde-2);border-radius:var(--radio);
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.vt-link{border:none;background:none;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline;cursor:pointer}
.vt-link:hover{color:var(--accent)}
.vt-scroll-alto{max-height:520px}
.vt-mas{margin-top:10px;width:100%}

@media(max-width:780px){
  .vt-barra{position:static;padding:10px 12px}
  .vt-ctrl{margin-left:0;width:100%}
  .vt-campo{flex:1 1 140px}
  .vt-campo select{min-width:0;max-width:none;width:100%}
  .vt-num-xl{font-size:24px}
  .vt-num-l{font-size:26px}
  .vt-hero-der{text-align:left}
  .vt-stats{grid-template-columns:1fr 1fr}
  .hist-legend{flex-wrap:wrap;gap:6px 12px}
  /* En el teléfono nada de scroll dentro del scroll: la tabla crece con la página. */
  .vt-scroll-alto{max-height:none}
}

/* ══════════ Ventas (JsVentas3.html; antes "Ventas 3.0") · sell-in y sell-out estilo Zebra BI ══════════
   Réplica del visual "Crecimiento por EAN $#" del Power BI: PY en cifra, AC en
   barras grises, ΔPY en barras divergentes (verde / rojo), ΔPY% en pines con
   flecha cuando se salen de la escala y "Var % vs mes pasado" en cifra. Cada
   columna es una pista de ancho fijo con su eje al centro (ΔPY, ΔPY%). */
#vistaVentas3{min-height:0;overflow-y:auto;padding:2px}
#vistaVentas3[hidden]{display:none}
.vt3-grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;align-items:start}
.vt3-lado{display:flex;flex-direction:column;gap:10px;position:sticky;top:66px}
.vt3-meses{padding:10px 12px}
.vt3-meses-tit{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.vt3-rapidos{display:flex;gap:10px;font-size:11.5px;margin-bottom:6px}
.vt3-lista-meses{display:flex;flex-direction:column;gap:1px}
.vt3-mes{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.vt3-mes.on{background:var(--lienzo);color:var(--ink);font-weight:600}
.vt3-mes input{margin:0;accent-color:var(--ink)}
.vt3-kpi{padding:14px 12px;text-align:center}
.vt3-kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.vt3-kpi .e{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:2px}
.vt3-kpi-d{font-size:11.5px;font-weight:600;margin-top:4px;color:var(--muted)}
.vt3-kpi-d.pos{color:var(--sem-alto)}
.vt3-kpi-d.neg{color:var(--error)}
#vt3Kpis{display:flex;flex-direction:column;gap:10px}
.vt3-panel{padding:12px 14px;min-width:0;position:relative}
.vt3-cab{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:8px}
.vt3-cab h3{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
.vt3-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.vt3-filtros[hidden]{display:none}

/* Filas del gráfico */
.vt3-chart{font-size:11.5px;font-variant-numeric:tabular-nums}
.vt3-fila{display:grid;grid-template-columns:minmax(150px,1.6fr) 64px minmax(130px,2.2fr) minmax(130px,2fr) minmax(120px,1.6fr) 74px;
  align-items:center;gap:0 6px;min-height:19px;padding:1px 4px;border-radius:3px;cursor:pointer;position:relative}
/* iPad / pantallas medianas: columnas más angostas para que la tabla (con Inventario) quepa sin
   desplazamiento horizontal. En el celular manda la regla de tarjetas de más abajo. */
@media(max-width:1100px){
  .vt3-fila{grid-template-columns:minmax(104px,1.4fr) 54px minmax(84px,2fr) minmax(84px,1.6fr) minmax(80px,1.4fr) 58px}
  .vt3-chart.con-inv .vt3-fila{grid-template-columns:minmax(104px,1.4fr) 54px minmax(84px,2fr) minmax(84px,1.6fr) minmax(80px,1.4fr) 58px 64px}
}
/* Barra de Ventas: el resumen del mes (vt-hero, motor en JsVentas.html) a la izquierda y los
   controles a la derecha. No es sticky: con el resumen adentro taparía media pantalla. */
.vt3-barra{position:static;align-items:flex-start;padding:10px 14px}
.vt3-res{flex:1 1 640px;min-width:0}
.vt3-res .vt-hero{padding:0;border:0;box-shadow:none;background:none;border-radius:0}
/* Resumen COMPACTO (pedido del usuario 2026-10-11: "menos alto"). Mismo contenido que en la
   antigua pestaña Ventas, en tres franjas: [título + switches] / [venta del mes · barra · Δ%] /
   [indicadores en una línea]. La leyenda de la barra se omite (cada marca tiene su rótulo). */
.vt3-res .vt-hero{display:grid;grid-template-columns:minmax(220px,auto) minmax(160px,1fr) auto;
  grid-template-areas:"cab cab cab" "izq bar der" "stats stats stats";column-gap:24px;row-gap:2px;align-items:center}
.vt3-res .vt-hero-cab{grid-area:cab;margin-bottom:0}
.vt3-res .vt-hero-top{display:contents}
.vt3-res .vt-hero-top>div:first-child{grid-area:izq}
.vt3-res .vt-hero-der{grid-area:der}
.vt3-res .vt-bg{grid-area:bar;height:20px;margin:16px 0 12px}
.vt3-res .vt-bg-ley,.vt3-res .vt-pvl-nota{display:none}
.vt3-res .vt-num-xl,.vt3-res .vt-num-l{font-size:22px}
.vt3-res .vt-det{margin-top:0;font-size:11.5px}
.vt3-res .vt-stats{grid-area:stats;display:flex;flex-wrap:wrap;gap:2px 24px;margin-top:4px;padding-top:6px}
.vt3-res .vt-stat{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.vt3-res .vt-num-m{font-size:14px}
.vt3-res .vt-nota{grid-column:1/-1}
@media(max-width:700px){
  .vt3-res .vt-hero{grid-template-columns:minmax(0,1fr);grid-template-areas:"cab" "izq" "der" "bar" "stats"}
}
.vt3-barra .vt-ctrl{align-self:flex-start}
.vt3-sub{font-size:11.5px;color:var(--muted);margin:-2px 0 8px}
/* Filas elegidas con clic (se acumulan): resaltadas; las demás, atenuadas. */
.vt3-fila.sel{background:var(--accent-suave);box-shadow:inset 3px 0 0 var(--accent)}
.vt3-fila.sel .nom{font-weight:700}
.vt3-fila.atenuada{opacity:.45}
.vt3-fila.atenuada:hover{opacity:.85}
/* Sell-in por cliente: dos columnas más (Plan y % Cumpl.). */
.vt3-chart.con-plan .vt3-fila{grid-template-columns:minmax(150px,1.6fr) 64px minmax(120px,2fr) minmax(120px,1.8fr) minmax(110px,1.5fr) 74px 64px 58px}
.vt3-fila .cump b{font-weight:600}
.vt3-fila:hover{background:var(--lienzo)}
.vt3-fila:hover .ac i{background:#3c3c3c}
.vt3-fila:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.vt3-fila>span{position:relative;height:17px;display:flex;align-items:center;min-width:0;white-space:nowrap}
.vt3-fila .nom{display:block;height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.vt3-fila .nom small{display:none}
.vt3-fila .num{justify-content:flex-end;color:var(--ink-2)}
.vt3-fila .mv{display:none}
.vt3-fila .ac{border-left:1px solid #b8b8b8}
.vt3-fila .ac i{display:block;height:13px;background:#9a9a9a;border-radius:0 1px 1px 0}
.vt3-fila .ac b{font-weight:500;margin-left:4px;color:var(--ink)}
/* ΔPY y ΔPY%: eje vertical al centro de la pista */
.vt3-fila .d::before,.vt3-fila .p::before{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#8a8a8a}
.vt3-fila .d i{position:absolute;top:2px;height:13px}
.vt3-fila .d i.pos{background:#a5d46a}
.vt3-fila .d i.neg{background:#f26d6d}
.vt3-fila .d b,.vt3-fila .p b{position:absolute;font-weight:500;white-space:nowrap;color:var(--ink)}
.vt3-fila .p i{position:absolute;top:8px;height:2px}
.vt3-fila .p i.pos{background:#a5d46a}
.vt3-fila .p i.neg{background:#f26d6d}
.vt3-fila .p em{position:absolute;top:5px;width:8px;height:8px;margin:0 -4px;border-radius:50%;background:#555}
.vt3-fila .p em.fuera.pos{background:none;border-radius:0;width:0;height:0;margin:0 -2px;top:4px;
  border-left:8px solid #a5d46a;border-top:5px solid transparent;border-bottom:5px solid transparent}
.vt3-fila .p em.fuera.neg{background:none;border-radius:0;width:0;height:0;margin:0 -6px;top:4px;
  border-right:8px solid #f26d6d;border-top:5px solid transparent;border-bottom:5px solid transparent}
.vt3-fila .p b{font-style:italic}
.vt3-fila .p b.adentro{background:var(--surface);padding:0 3px;top:1px;line-height:15px}
.vt3-fila:hover .p b.adentro{background:var(--lienzo)}
.vt3-encab{cursor:default;border-bottom:1px solid var(--borde-2);margin-bottom:3px;padding-bottom:3px}
.vt3-encab:hover{background:none}
.vt3-encab .vt3-th{border:none;background:none;font:inherit;font-size:11px;color:var(--ink-2);cursor:pointer;padding:0;text-align:right}
.vt3-encab .vt3-th.ac{text-align:left}
.vt3-encab .vt3-th.d,.vt3-encab .vt3-th.p{text-align:center}
.vt3-encab .vt3-th.act{color:var(--ink);font-weight:700}
.vt3-encab>.vt3-th:first-child{text-align:left}
.vt3-total{border-top:2px solid var(--ink);margin-top:3px;padding-top:3px;font-weight:700;cursor:default}
.vt3-total:hover{background:none}
.vt3-total .d::before,.vt3-total .p::before{display:none}
.vt3-total .d,.vt3-total .p{justify-content:center}
.vt3-total b{font-weight:700}
.vt3-fila b.pos,.vt3-panel .pos{color:var(--sem-alto)}
.vt3-fila b.neg,.vt3-panel .neg{color:var(--error)}
.vt3-fila .d b.pos,.vt3-fila .d b.neg,.vt3-fila .p b.pos,.vt3-fila .p b.neg{color:var(--ink)}
.vt3-total .d b.pos,.vt3-total .p b.pos{color:var(--sem-alto)}
.vt3-total .d b.neg,.vt3-total .p b.neg{color:var(--error)}

/* Tooltip estilo Power BI */
.vt3-tip{position:absolute;z-index:30;min-width:220px;max-width:280px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--borde);border-radius:4px;box-shadow:0 6px 20px rgba(17,24,39,.16);pointer-events:none;font-size:13px}
.vt3-tip[hidden]{display:none}
.vt3-tip .t{font-weight:700;letter-spacing:.03em;margin-bottom:6px}
.vt3-tip table{border-collapse:collapse;width:100%}
.vt3-tip td{padding:2px 0;font-variant-numeric:tabular-nums}
.vt3-tip td:first-child{text-align:right;padding-right:12px;color:var(--ink-2);width:60%}

@media(max-width:1000px){
  .vt3-grid{grid-template-columns:minmax(0,1fr)}
  .vt3-lado{position:static}
  .vt3-lista-meses{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px}
  .vt3-lista-meses::-webkit-scrollbar{display:none}
  .vt3-mes{flex-shrink:0;border:1px solid var(--borde-2);border-radius:999px;padding:3px 10px}
  .vt3-mes input{display:none}
  .vt3-mes.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #vt3Kpis{display:grid;grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  /* En el teléfono: nombre arriba; AC y ΔPY% abajo; PY, ΔPY y var. vs mes pasado en una línea de texto. */
  .vt3-fila{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"nom nom" "ac p" "mv mv";
    padding:6px 2px;border-bottom:1px solid var(--borde);gap:2px 8px}
  .vt3-fila .nom{grid-area:nom;font-weight:600;white-space:normal}
  .vt3-fila .nom small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
  .vt3-fila .ac{grid-area:ac}.vt3-fila .p{grid-area:p}
  .vt3-fila .py,.vt3-fila .d,.vt3-fila .vmp,.vt3-fila .pl,.vt3-fila .cump,.vt3-fila .inv,.vt3-fila .so-th-inv{display:none}
  .vt3-chart.con-inv .vt3-fila{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .vt3-chart.con-plan .vt3-fila{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .vt3-fila .mv{display:block;grid-area:mv;font-size:10.5px;color:var(--muted);white-space:normal;height:auto}
  .vt3-encab{display:none}
  .vt3-total{grid-template-areas:"nom nom" "ac p"}
  .vt3-total .mv{display:none}
  .vt3-kpi .v{font-size:20px}
}

/* ── Riel en pantallas ≤ 1000 px: colapsado fijo (80 px) y el expandido se abre
   como cajón modal encima del contenido, con velo; se cierra al elegir destino. ── */
@media(max-width:1000px){
  .shell,.shell.rail-expandido{grid-template-columns:80px minmax(0,1fr)}
  .nav-rail{padding:10px 6px}
  .rail-expandido .nav-rail{position:fixed;z-index:3000;top:0;bottom:0;left:0;width:var(--rail-exp);
    padding:12px;box-shadow:0 10px 28px rgba(46,46,43,.22)}
  .rail-expandido::after{content:'';position:fixed;inset:0;z-index:2999;background:rgba(46,46,43,.32)}
}
/* ── Teléfono (≤ 600 px): como en Material 3, el riel se va y la navegación pasa a
   una barra inferior (Ventas · Mapa · Perfect Store · Más). "Más" abre el riel
   expandido como cajón modal desde la izquierda, con los informes clásicos. ── */
.nav-barra{display:none}
@media(max-width:600px){
  .shell,.shell.rail-expandido{grid-template-columns:minmax(0,1fr)}
  .nav-rail{display:none}
  .rail-expandido .nav-rail{display:flex;width:min(300px,86vw);border-radius:0 16px 16px 0;
    background:var(--surface-2);padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
