<script>
/* ══════════ JsDigital · subpestaña "Digital" de Ventas (2026-11-19) ══════════
   Réplica del Looker Studio "VENTAS DIGITAL". FUENTE: getDigitalJson (Code.js) = libro MAESTRA LOOKER,
   hoja MAESTRA (Fecha × Sold To ID × EAN × Canal × Sub_Canal × Affiliate, Units y Amount) y hoja
   BUDGET YTG (objetivo digital por cliente de los meses que faltan del año).
   Cubo: f = [[iCli, iSku, iMes, iCanal, iAff, und, imp]] · b = [[iCli, 'AAAA-MM', imp]].

   DEFINICIONES (las del Looker):
     SO PDV   = Sell Out de TIENDA (Canal ≠ DIGITAL) · SO DIG = Sell Out con Canal = DIGITAL
     % SO DIG = SO DIG ÷ (SO PDV + SO DIG): la participación de lo digital en el Sell Out total
     YTD      = los meses del filtro Fecha del año elegido (por defecto enero → último mes con dato)
     YTD -1   = los mismos meses del año anterior · ΔV-1 % = SO DIG YTD ÷ SO DIG YTD -1 − 1
     Performance (siempre en pesos): YTD = enero → mes anterior al primer mes del budget (BUDGET YTG);
       BUDGET YTG = suma del budget de esos meses (oct–dic) · BUDGET FY DIG = SO DIG YTD + BUDGET YTG
       % CUMPL. YTD = SO DIG YTD ÷ BUDGET FY DIG. Verificado contra el Looker (Medipiel 2026:
       5.485 M + 1.499 M = 6.985 M, 79 %).
   FILTROS (mismo modelo que Sell Out PDV): Año y Vista fijos, Fecha (Desde–Hasta) y "+ Añadir filtro"
   para Affiliate (por defecto Colombia), Canal (canal comercial del cliente, el de Sell Out PDV),
   Cliente, BU, Marca, EAN y Sub canal. El Sub canal solo recorta la venta DIGITAL (la de tienda sigue
   entera, así % SO DIG = participación de ese subcanal). Clic en barras / filas = filtro.
   ═══════════════════════════════════════════════════════════════ */

var dgD=null,dgCargando=false,dgError='';
var dgE={anio:0,desde:1,hasta:12,unidad:'$',orden:{k:'d',dir:'desc'},ordenP:{k:'fy',dir:'desc'},ab:{},
  f:{aff:['Colombia'],ccom:[],cli:[],bu:[],marca:[],sku:[],sub:[]}};
var dgFs={aff:{Colombia:1},ccom:null,cli:null,bu:null,marca:null,sku:null,sub:null};
var DG_CAMPOS=[
  {dim:'aff',  etq:'Affiliate'},
  {dim:'ccom', etq:'Canal'},                    // canal comercial del cliente (Cadenas, Tiendas de piel…)
  {dim:'cli',  etq:'Cliente',        tope:600},
  {dim:'bu',   etq:'BU'},
  {dim:'marca',etq:'Marca'},
  {dim:'sku',  etq:'EAN description',tope:600},
  {dim:'sub',  etq:'Sub canal'}];               // solo recorta la venta digital
var DG_DIM_ETQ={aff:'Affiliate',ccom:'Canal',cli:'Cliente',bu:'BU',marca:'Marca',sku:'EAN',sub:'Sub canal'};
var DG_CHIPS_MAX=5;
var DG_SEL={},dgVisibles={aff:true,cli:true,bu:true,marca:true,sub:true};
try{var _dv=JSON.parse(localStorage.getItem('visor.dgFiltros')||'null');if(_dv){dgVisibles={};_dv.forEach(function(d){dgVisibles[d]=true})}}catch(e){}
try{var _du=localStorage.getItem('visor.dgUnidad');if(_du==='#'||_du==='$')dgE.unidad=_du}catch(e){}
function dgGuardar(){try{localStorage.setItem('visor.dgUnidad',dgE.unidad);
  localStorage.setItem('visor.dgFiltros',JSON.stringify(Object.keys(dgVisibles)))}catch(e){}}

/* ══════════ Carga ══════════ */
function dgAlEntrar(){if(dgD){dgRender();return}dgCargar(false)}
function dgCargar(forzar){
  if(dgCargando)return;
  dgCargando=true;dgError='';if(forzar)dgD=null;
  dgPintarEstado();
  if(!esGas()){setTimeout(function(){dgRecibir(dgDemo())},200);return}
  google.script.run
    .withSuccessHandler(function(j){var d;try{d=JSON.parse(j)}catch(e){dgFallo(me(e));return}dgRecibir(d)})
    .withFailureHandler(function(e){dgFallo(me(e))})
    .getDigitalJson(forzar===true)}
function dgFallo(m){dgCargando=false;dgError=m;dgPintarEstado()}
function dgRecibir(d){
  dgCargando=false;
  if(d&&d.error){dgFallo(d.error);return}
  dgD=dgPreparar(d);
  if(dgAnios().indexOf(dgE.anio)===-1)dgE.anio=dgD.anioMax;
  dgRangoDefecto();
  dgPrepararFiltros();
  dgConstruirCampos();
  dgRender();
  cargarLib('choices',function(){dgCrearSelectores()})}
function dgPreparar(d){
  var X={meses:d.meses||[],ip:{},py:[],meta:d.meta||{},
    clientes:(d.clientes||[]).map(function(c){return{id:String(c[0]),nombre:c[1]||String(c[0])}}),
    skus:(d.skus||[]).map(function(s){return{ean:String(s[0]||''),nombre:s[1]||String(s[0]),bu:s[2]||'SIN BU',marca:s[3]||'SIN MARCA'}}),
    canales:(d.canales||[]).map(function(c){var ca=String(c[0]||'').toUpperCase();return{canal:ca,sub:String(c[1]||ca).toUpperCase(),dig:ca==='DIGITAL'}}),
    affiliates:d.affiliates||[],f:d.f||[],b:d.b||[],cliAff:{},anioMax:0};
  X.meses.forEach(function(m,i){X.ip[m]=i;X.anioMax=Math.max(X.anioMax,Number(m.slice(0,4)))});
  X.meses.forEach(function(m,i){var j=X.ip[(Number(m.slice(0,4))-1)+m.slice(4)];X.py[i]=j==null?-1:j});
  X.f.forEach(function(r){(X.cliAff[r[0]]||(X.cliAff[r[0]]={}))[X.affiliates[r[4]]]=1});
  return X}
function dgPintarEstado(){
  var est=document.getElementById('dgEstado'),cont=document.getElementById('dgContenido');if(!est)return;
  if(dgD&&!dgCargando){est.style.display='none';if(cont)cont.style.display='block';return}
  if(cont)cont.style.display='none';est.style.display='block';
  est.innerHTML=dgError?'<b>No pude cargar Ventas Digital.</b><br>'+esc(dgError)+
    '<br><span class="mini">Fuente: libro MAESTRA LOOKER, hojas MAESTRA y BUDGET YTG.</span> '+
    '<button type="button" class="btn" onclick="dgCargar(true)">Reintentar</button>':
    '<span class="mtd-spinner"></span>Cargando Ventas Digital (MAESTRA LOOKER)…'}

/* ══════════ Filtros ══════════ */
function dgAnios(){var o={};(dgD?dgD.meses:[]).forEach(function(m){o[Number(m.slice(0,4))]=1});
  return Object.keys(o).map(Number).sort(function(a,b){return b-a})}
function dgMesesAnio(a){var o=[];(dgD?dgD.meses:[]).forEach(function(m){if(Number(m.slice(0,4))===a)o.push(Number(m.slice(5,7)))});
  return o.sort(function(x,y){return x-y})}
function dgRangoDefecto(){var ms=dgMesesAnio(dgE.anio);dgE.desde=ms.length?ms[0]:1;dgE.hasta=ms.length?ms[ms.length-1]:12}
function dgSetFiltro(dim,arr){
  arr=(arr||[]).map(String).filter(function(v){return v!==''&&v!=='__mas__'});
  dgE.f[dim]=arr;
  if(!arr.length){dgFs[dim]=null;return}
  var m={};arr.forEach(function(v){m[v]=1});dgFs[dim]=m}
function dgPrepararFiltros(){
  var D=dgD,ok={aff:{},cli:{},bu:{},marca:{},sku:{},sub:{}};
  D.affiliates.forEach(function(a){ok.aff[a]=1});
  D.clientes.forEach(function(c,i){ok.cli[i]=1});
  D.skus.forEach(function(s,i){ok.sku[i]=1;ok.bu[s.bu]=1;ok.marca[s.marca]=1});
  D.canales.forEach(function(c){if(c.dig)ok.sub[c.sub]=1});
  Object.keys(dgE.f).forEach(function(d){if(d==='ccom')return;dgSetFiltro(d,dgE.f[d].filter(function(v){return ok[d][v]}))})}
/* Canal comercial del cliente: el mismo mapa por SAP ID de Sell Out PDV (Ventas MTD / SI vs SO). */
function dgCanalCli(i){var c=dgD.clientes[i],m=typeof soMapaCanalCli==='function'?soMapaCanalCli():{};return(c&&m[c.id])||'SIN CANAL'}
function dgOpciones(dim){
  var D=dgD;if(!D)return[];
  function lista(o){return Object.keys(o).sort().map(function(v){return{valor:v,etiqueta:v}})}
  var o={};
  if(dim==='aff'){D.affiliates.forEach(function(a){o[a]=1});return lista(o)}
  if(dim==='ccom'){D.clientes.forEach(function(c,i){o[dgCanalCli(i)]=1});return lista(o)}
  if(dim==='cli')return D.clientes.map(function(c,i){return{valor:String(i),etiqueta:c.nombre}})
    .filter(function(x){var i=Number(x.valor),af=D.cliAff[i];
      return(!dgFs.ccom||dgFs.ccom[dgCanalCli(i)])&&(!dgFs.aff||!af||Object.keys(af).some(function(a){return dgFs.aff[a]}))})
    .sort(function(a,b){return a.etiqueta.localeCompare(b.etiqueta,'es')});
  if(dim==='bu'){D.skus.forEach(function(s){o[s.bu]=1});return lista(o)}
  if(dim==='marca'){D.skus.forEach(function(s){if(!dgFs.bu||dgFs.bu[s.bu])o[s.marca]=1});return lista(o)}
  if(dim==='sku')return D.skus.map(function(s,i){return{valor:String(i),etiqueta:s.nombre+(s.ean?' · '+s.ean:'')}})
    .filter(function(x){var s=D.skus[Number(x.valor)];return(!dgFs.bu||dgFs.bu[s.bu])&&(!dgFs.marca||dgFs.marca[s.marca])})
    .sort(function(a,b){return a.etiqueta.localeCompare(b.etiqueta,'es')});
  if(dim==='sub'){D.canales.forEach(function(c){if(c.dig)o[c.sub]=1});return lista(o)}
  return[]}
function dgConstruirCampos(){
  var cont=document.getElementById('dgCampos');if(!cont||(cont.dataset&&cont.dataset.listo))return;
  if(cont.dataset)cont.dataset.listo='1';
  cont.innerHTML=DG_CAMPOS.map(function(c){
    return'<div class="campo yb-campo" data-dim="'+c.dim+'"'+(dgVisibles[c.dim]||dgE.f[c.dim].length?'':' hidden')+'>'+
      '<label for="dgSel_'+c.dim+'"><span>'+esc(c.etq)+'</span>'+
      '<button type="button" class="chip-x" title="Quitar este filtro" onclick="dgQuitarDim(event,\''+c.dim+'\')">✕</button>'+
      '</label><select id="dgSel_'+c.dim+'" multiple></select></div>'}).join('')}
function dgCrearSelectores(){
  if(Object.keys(DG_SEL).length||!dgD)return;
  dgConstruirCampos();
  DG_CAMPOS.forEach(function(c){var dim=c.dim;
    DG_SEL[dim]=new Selector({dim:dim,id:'dgSel_'+dim,multi:true,tope:c.tope||400,
      ops:function(){return dgOpciones(dim)},sel:function(){return dgE.f[dim]},
      alCambiar:function(v){dgSetFiltro(dim,v);dgRender();dgSincronizar(false)}})});
  dgSincronizar(true)}
function dgSincronizar(forzar){Object.keys(DG_SEL).forEach(function(d){forzar?DG_SEL[d].fijar():DG_SEL[d].refrescar(false)})}
function dgMostrarDim(dim){
  var caja=document.querySelector&&document.querySelector('#dgCampos .yb-campo[data-dim="'+dim+'"]');
  if(caja&&caja.hidden){caja.hidden=false;if(DG_SEL[dim])DG_SEL[dim].refrescar(true)}}
function dgAgregarDim(dim){dgVisibles[dim]=true;dgGuardar();dgMostrarDim(dim);dgCerrarPop()}
function dgQuitarDim(ev,dim){
  if(ev){ev.preventDefault();ev.stopPropagation()}
  delete dgVisibles[dim];dgGuardar();
  var caja=document.querySelector('#dgCampos .yb-campo[data-dim="'+dim+'"]');if(caja)caja.hidden=true;
  if(dgE.f[dim].length){dgSetFiltro(dim,[]);dgRender();dgSincronizar(true)}}
function dgAlternarPop(ev){
  if(ev)ev.stopPropagation();
  var pop=document.getElementById('dgPop');if(!pop)return;
  if(!pop.hidden){pop.hidden=true;return}
  var libres=DG_CAMPOS.filter(function(c){var caja=document.querySelector('#dgCampos .yb-campo[data-dim="'+c.dim+'"]');return!caja||caja.hidden});
  document.getElementById('dgPopLista').innerHTML=libres.length?libres.map(function(c){
    return'<button type="button" class="pop-op" onclick="dgAgregarDim(\''+c.dim+'\')">'+esc(c.etq)+'</button>'}).join(''):
    '<div class="pop-vacio">Ya están todos los filtros en la barra</div>';
  pop.hidden=false}
function dgCerrarPop(){var pop=document.getElementById('dgPop');if(pop)pop.hidden=true}
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('click',function(e){
  var pop=document.getElementById('dgPop');
  if(pop&&!pop.hidden&&(!e.target.closest||!e.target.closest('.pop-anclaje')))pop.hidden=true});

function dgAlternar(dim,val){
  var a=dgE.f[dim].slice(),v=String(val),i=a.indexOf(v);
  if(i===-1)a.push(v);else a.splice(i,1);
  dgSetFiltro(dim,a);if(a.length)dgMostrarDim(dim);
  dgRender();dgSincronizar(true)}
function dgSetAnio(a){dgE.anio=a;dgRangoDefecto();dgRender()}
function dgSetUnidad(u){dgE.unidad=u;dgGuardar();dgRender()}
function dgSetRango(){
  var d=document.getElementById('dgDesde'),h=document.getElementById('dgHasta');if(!d||!h)return;
  var a=Number(d.value),b=Number(h.value);if(a>b){var t=a;a=b;b=t}
  dgE.desde=a;dgE.hasta=b;dgRender()}
/* Clic en un mes de la gráfica: solo ese mes; otro clic vuelve al año completo. */
function dgClicMes(m){if(dgE.desde===m&&dgE.hasta===m)dgRangoDefecto();else{dgE.desde=m;dgE.hasta=m}dgRender()}
function dgLimpiar(){Object.keys(dgE.f).forEach(function(d){dgSetFiltro(d,[])});dgRangoDefecto();dgRender();dgSincronizar(true)}
function dgRangoCompleto(){var ms=dgMesesAnio(dgE.anio);return!ms.length||(dgE.desde<=ms[0]&&dgE.hasta>=ms[ms.length-1])}
function dgRangoTxt(){return SIVSO_MESES[dgE.desde-1]+(dgE.hasta!==dgE.desde?'–'+SIVSO_MESES[dgE.hasta-1]:'')+' '+dgE.anio}

/* ══════════ Cálculo ══════════ */
/* Índices de mes del YTD: los del año elegido dentro del rango Desde–Hasta. */
function dgSel(){
  var out=[];dgD.meses.forEach(function(m,i){if(Number(m.slice(0,4))!==dgE.anio)return;var mm=Number(m.slice(5,7));
    if(mm>=dgE.desde&&mm<=dgE.hasta)out.push(i)});
  return out}
function dgPasaCli(i,ig){
  if(ig!=='cli'&&dgFs.cli&&!dgFs.cli[i])return false;
  if(ig!=='ccom'&&dgFs.ccom&&!dgFs.ccom[dgCanalCli(i)])return false;
  return true}
function dgPasaSku(i,ig){var s=dgD.skus[i];if(!s)return false;
  if(ig!=='sku'&&dgFs.sku&&!dgFs.sku[i])return false;
  if(ig!=='bu'&&dgFs.bu&&!dgFs.bu[s.bu])return false;
  if(ig!=='marca'&&dgFs.marca&&!dgFs.marca[s.marca])return false;
  return true}
/* Recorre las filas que pasan los filtros (menos `ig`) y llama fn(fila, esDigital, valor, canal).
   imp=true fuerza pesos (Performance: el budget solo existe en pesos). */
function dgPasada(ig,fn,imp){
  var D=dgD,okC=[],okS=[],fa=ig!=='aff'&&dgFs.aff,fsub=ig!=='sub'&&dgFs.sub,u=!imp&&dgE.unidad==='#';
  D.clientes.forEach(function(c,i){okC[i]=dgPasaCli(i,ig)});
  D.skus.forEach(function(s,i){okS[i]=dgPasaSku(i,ig)});
  for(var k=0;k<D.f.length;k++){var r=D.f[k];
    if(!okC[r[0]]||!okS[r[1]])continue;
    if(fa&&!fa[D.affiliates[r[4]]])continue;
    var c=D.canales[r[3]];if(!c)continue;
    if(c.dig&&fsub&&!fsub[c.sub])continue;
    fn(r,c.dig,u?r[5]:r[6],c)}}
/* Serie mensual (todos los meses del cubo) de tienda (t) y digital (d). */
function dgSerie(ig){
  var n=dgD.meses.length,t=new Float64Array(n),d=new Float64Array(n);
  dgPasada(ig,function(r,dig,v){if(dig)d[r[2]]+=v;else t[r[2]]+=v});
  return{t:t,d:d}}
function dgSuma(a,idx){var s=0;idx.forEach(function(i){if(i>=0)s+=a[i]});return s}
function dgPyIdx(sel){return sel.map(function(i){return dgD.py[i]}).filter(function(j){return j>=0})}
function dgRatio(a,b){return b>0?a/b:null}

/* ══════════ Formato ══════════ */
function dgNum(v){if(v==null||!isFinite(v))return'–';return FMT.format(Math.round(v))}
function dgPct(v,dec){if(v==null||!isFinite(v))return'–';
  return(v*100).toLocaleString('es-CO',{minimumFractionDigits:dec==null?1:dec,maximumFractionDigits:dec==null?1:dec})+' %'}
function dgVar(v){if(v==null||!isFinite(v))return'–';return(v>0?'+':v<0?'−':'')+dgPct(Math.abs(v))}
function dgPp(v){if(v==null||!isFinite(v))return'–';
  return(v>0?'+':v<0?'−':'')+(Math.abs(v)*100).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' pp'}
function dgU(){return dgE.unidad==='#'?'und':'$'}

/* ══════════ Pintado ══════════ */
function dgRender(){
  dgPintarEstado();if(!dgD||dgCargando)return;
  dgPintarControles();dgPintarChips();
  var sel=dgSel(),S=dgSerie(null);
  dgPintarKpis(S,sel);dgPintarMensual(S,sel);dgPintarSub(sel);dgPintarHistorico(S);dgPintarComp(sel);dgPintarPerf()}

function dgPintarControles(){
  function chip(on,fn,t){return'<button type="button" class="chip-periodo'+(on?' activo':'')+'" onclick="'+fn+'">'+t+'</button>'}
  var e=document.getElementById('dgAnioChips');
  if(e)e.innerHTML=dgAnios().map(function(a){return chip(a===dgE.anio,'dgSetAnio('+a+')',a)}).join('');
  e=document.getElementById('dgUnidadChips');
  if(e)e.innerHTML=chip(dgE.unidad==='$','dgSetUnidad(\'$\')','$ Pesos')+chip(dgE.unidad==='#','dgSetUnidad(\'#\')','# Unidades');
  var ms=dgMesesAnio(dgE.anio),ops=function(v){return ms.map(function(m){return'<option value="'+m+'"'+(m===v?' selected':'')+'>'+SIVSO_MESES[m-1]+'</option>'}).join('')};
  e=document.getElementById('dgDesde');if(e)e.innerHTML=ops(dgE.desde);
  e=document.getElementById('dgHasta');if(e)e.innerHTML=ops(dgE.hasta);
  e=document.getElementById('dgUnidadTxt');if(e)e.innerText='Cifras en '+(dgE.unidad==='#'?'unidades':'pesos')+' · '+dgRangoTxt();
  var n=dgRangoCompleto()?0:1;Object.keys(dgE.f).forEach(function(d){n+=dgE.f[d].length});
  e=document.getElementById('dgContador');if(e){e.innerText=n;e.hidden=!n}}
function dgPintarChips(){
  var D=dgD,items=[];
  if(!dgRangoCompleto())items.push({etq:'Fecha: '+dgRangoTxt(),dim:'fecha'});
  Object.keys(dgE.f).forEach(function(d){
    if(dgE.f[d].length>DG_CHIPS_MAX){items.push({etq:DG_DIM_ETQ[d]+': '+dgE.f[d].length+' filtrados',dim:d,todos:true});return}
    dgE.f[d].forEach(function(v){
      var t=d==='cli'?(D.clientes[v]||{}).nombre:(d==='sku'?(D.skus[v]||{}).nombre:v);
      items.push({etq:DG_DIM_ETQ[d]+': '+(t||v),dim:d,valor:v})})});
  mtdPintarChips('dgChips',items,function(it){
    if(it.dim==='fecha')dgRangoDefecto();
    else{dgSetFiltro(it.dim,it.todos?[]:dgE.f[it.dim].filter(function(x){return x!==it.valor}));dgSincronizar(true)}
    dgRender()},dgLimpiar)}

function dgCard(v,e,d,cls){return'<div class="card so-kpi'+(cls?' '+cls:'')+'"><div class="e">'+e+'</div><div class="v">'+v+'</div>'+(d||'')+'</div>'}
function dgDelta(v,txt){if(v==null||!isFinite(v))return'<div class="d">sin año anterior</div>';
  return'<div class="d '+(v>=0?'pos':'neg')+'">'+(v>=0?'▲ ':'▼ ')+txt+' vs '+(dgE.anio-1)+'</div>'}
function dgPintarKpis(S,sel){
  var k=document.getElementById('dgKpis');if(!k)return;
  var py=dgPyIdx(sel),t=dgSuma(S.t,sel),d=dgSuma(S.d,sel),tp=dgSuma(S.t,py),dp=dgSuma(S.d,py);
  var p=dgRatio(d,t+d),pp=dgRatio(dp,tp+dp),vt=tp>0?t/tp-1:null,vd=dp>0?d/dp-1:null;
  k.innerHTML=dgCard(dgNum(t),'SO PDV YTD',dgDelta(vt,dgVar(vt)))+
    dgCard(dgNum(d),'SO DIG YTD',dgDelta(vd,dgVar(vd)))+
    dgCard(dgPct(p,2),'% SO DIG YTD',p!=null&&pp!=null?dgDelta(p-pp,dgPp(p-pp)):'<div class="d">sin año anterior</div>')}

/* 1. Venta mensual: barras al 100 % (tienda abajo, digital arriba), meses del año; los del rango resaltados. */
function dgPintarMensual(S,sel){
  var c=document.getElementById('dgMensual');if(!c)return;
  var D=dgD,ms=dgMesesAnio(dgE.anio);
  if(!ms.length){c.innerHTML='<div class="mtd-vacio">Sin datos en '+dgE.anio+'</div>';return}
  var h='<div class="dg-cols" style="grid-template-columns:repeat('+ms.length+',minmax(0,1fr))">';
  ms.forEach(function(m){
    var i=D.ip[dgE.anio+'-'+(m<10?'0':'')+m],t=S.t[i]||0,d=S.d[i]||0,tot=t+d,pd=tot>0?d/tot:0,pt=tot>0?t/tot:0;
    var en=m>=dgE.desde&&m<=dgE.hasta;
    h+='<button type="button" class="dg-col'+(en?'':' atenuada')+'" onclick="dgClicMes('+m+')" title="'+SIVSO_MESES[m-1]+' '+dgE.anio+

/* v = [tienda YTD, digital YTD, tienda YTD-1, digital YTD-1] → columnas de la tabla. */
function dgMed(v,nombre,key){return{key:key,nombre:nombre,t:v[0],d:v[1],dpy:v[3],var:v[3]>0?v[1]/v[3]-1:null,

function dgOrdenar(k){var o=dgE.orden;dgE.orden=o.k===k?{k:k,dir:o.dir==='desc'?'asc':'desc'}:{k:k,dir:k==='nombre'?'asc':'desc'};dgPintarComp(dgSel())}
