<script>
/* ══════════════════════════════════════════════════════════════════════
   NÚCLEO · configuración, estado global, formatos y carga de datos.
   Todo el filtrado posterior ocurre EN MEMORIA sobre estos arreglos:
   google.script.run solo se usa al abrir cada pestaña y para los detalles que
   se piden bajo demanda (portafolio, distribución de SKU, conteo de SKUs).
   Tocar un filtro nunca vuelve al servidor.

   ARRANQUE (orden que NO se debe invertir):
     1. iniciarUIBasica()  pinta la pestaña por defecto (Ventas MTD) y pide su
                           ÚNICA llamada al servidor; precarga Choices.js.
     2. Cuando Ventas MTD ya está en pantalla, programarMapa() inicia el mapa en
        segundo plano (cargarLib Leaflet → iniciarMapaUI → cargarDatos: 5
        llamadas). Si el usuario abre "Mapa" antes, mapaAlEntrar() lo adelanta.
     Antes todo esto corría junto al inicio (7 llamadas, un overlay que tapaba la
     app y dos CDN bloqueantes), y Ventas MTD esperaba al mapa que no usa.
   ══════════════════════════════════════════════════════════════════════ */

/* ── Paletas (color con significado, nunca decorativo) ──────────────── */
/* muybajo unificado con --error/--accent (rojo de marca): "esto necesita
   atención" es el mismo rojo en cualquier parte de la app, no un tono aparte. */
var SEM={alto:'#1e8e3e',medio:'#f2b600',bajo:'#ef7d00',muybajo:'#e41f33',sin:'#9ca3af'};
var CIUDADES={'BOGOTA':'#2a78d6','BOGOTÁ':'#2a78d6','MEDELLIN':'#008300','MEDELLÍN':'#008300',
  'CALI':'#e87ba4','CARTAGENA':'#eda100','BARRANQUILLA':'#8b5cf6'};
var FMT=new Intl.NumberFormat('es-CO');
var MESN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ── Formato ────────────────────────────────────────────────────────── */
function fc(v){var a=Math.abs(v);
  if(a>=1e9)return'$ '+(v/1e9).toFixed(1)+' MM';
  if(a>=1e6)return'$ '+(v/1e6).toFixed(1)+' M';
  if(a>=1e3)return'$ '+(v/1e3).toFixed(0)+' K';
  return'$ '+FMT.format(Math.round(v))}
function fd(v){return'$ '+FMT.format(Math.round(v))}
function em(m){var p=m.split('-');return MESN[Number(p[1])-1]+' '+p[0].slice(2)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
/* MAYÚSCULAS y sin tildes: el buscador de los filtros ignora acentos. */
function normTxt(s){return String(s==null?'':s).toUpperCase()
  .normalize('NFD').replace(/\p{Diacritic}/gu,'')}

/* ── Estado: datos crudos ───────────────────────────────────────────── */
var puntosG=[],bricksG=[],ventasG={},productosG={},asignacionesG={};
var mesesD=[],busD=[],idxSel={},conteoSkuG={};

/* ── Estado: selección del usuario ──────────────────────────────────────
   Cada dimensión es un ARREGLO (multi-selección). Arreglo vacío = sin
   filtro. Entre dimensiones se cruza con AND; dentro de una dimensión,
   los valores se combinan con OR. `sku` es la excepción: uno solo, porque
   dispara una consulta de distribución al servidor.                      */
var filtros={grupo:[],channel:[],region:[],poblacion:[],potencial:[],
             agente:[],brick:[],zona:[],pdv:[],bu:[],mes:[]};
var fset={};                         /* espejo de `filtros` como mapas O(1) */
var skuSel='',distSku=null,cargandoSku=false;
var modoColor='rendimiento';

var listo={puntos:false,bricks:false,ventas:false,port:false,asignaciones:false};
var asignado=false;
/* Ciclo de vida del mapa: 'no' → 'cargando' → 'listo' ('error' si falla el CDN).
   mapaSucio = hubo datos nuevos mientras otra pestaña estaba visible; se repinta
   una sola vez al volver a Mapa (actualizar() recrea todos los marcadores). */
var mapaEstado='no',mapaSucio=false,pintadoBase=false,pintadoAsig=false;

/* ── Carga de librerías externas bajo demanda ───────────────────────────
   Leaflet y Choices.js ya no son <script> bloqueantes del <head>: cargarLib()
   las inyecta cuando hacen falta y avisa con cb(ok). Las hojas de estilo van
   ANTES de #libs-ancla (que está antes de Estilos.html) para que los overrides
   propios sigan ganando la cascada por orden. */
var LIBS={
  choices:{css:'https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css',
           js:'https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js',
           ok:function(){return typeof Choices==='function'},cross:false},
  leaflet:{css:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
           js:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
           ok:function(){return typeof L!=='undefined'&&!!L.map},cross:true}};
var libEstado={};
function cargarLib(nombre,cb){
  var l=LIBS[nombre],e=libEstado[nombre];
  if(l.ok()){cb(true);return}
  if(e&&e.fin){cb(e.ok);return}
  if(e){e.cbs.push(cb);return}
  e=libEstado[nombre]={fin:false,ok:false,cbs:[cb]};
  function fin(ok){
    if(e.fin)return;e.fin=true;e.ok=ok&&l.ok();
    e.cbs.forEach(function(f){try{f(e.ok)}catch(err){console.error(err)}});e.cbs=[]}
  var ancla=document.getElementById('libs-ancla')||document.head.lastChild;
  var k=document.createElement('link');k.rel='stylesheet';k.href=l.css;
  if(l.cross)k.crossOrigin='';
  ancla.parentNode.insertBefore(k,ancla);
  var s=document.createElement('script');s.src=l.js;s.async=true;
  if(l.cross)s.crossOrigin='';
  s.onload=function(){fin(true)};s.onerror=function(){fin(false)};
  setTimeout(function(){fin(false)},20000);          // CDN colgado: no esperar para siempre
  document.head.appendChild(s)}

/* ── Utilidades de entorno ──────────────────────────────────────────── */
function esGas(){return typeof google!=='undefined'&&google.script&&google.script.run}
function me(e){return e&&e.message?e.message:String(e)}
function avisar(m,g){var c=document.getElementById('avisos');c.style.display='flex';
  var d=document.createElement('div');d.className='aviso'+(g?' grave':'');d.innerText=m;c.appendChild(d)}

/* ══════════════ Riel de navegación (Material 3 Expressive) ══════════
   Colapsado (por defecto) ↔ expandido. En escritorio el expandido empuja el
   contenido y se recuerda (localStorage 'visor.rail'); en pantallas ≤ 1000 px
   se abre como cajón modal encima del contenido y no se recuerda. El mapa se
   reajusta solo: observarTamano() (JsMapa) vigila el ancho de .mapa-wrap. */
var RAIL_CLAVE='visor.rail';
function railModal(){return window.matchMedia&&window.matchMedia('(max-width:1000px)').matches}
function fijarRail(exp,recordar){
  var sh=document.getElementById('shell'),b=document.getElementById('btnRail');if(!sh)return;
  sh.classList.toggle('rail-expandido',exp);
  if(b){b.setAttribute('aria-expanded',exp?'true':'false');b.title=exp?'Contraer menú':'Expandir menú'}
  if(recordar&&!railModal())try{localStorage.setItem(RAIL_CLAVE,exp?'exp':'col')}catch(e){}}
function alternarRail(){
  var sh=document.getElementById('shell');if(!sh)return;
  fijarRail(!sh.classList.contains('rail-expandido'),true)}
function cerrarRailModal(){if(railModal())fijarRail(false,false)}
function iniciarRail(){
  var exp=false;try{exp=!railModal()&&localStorage.getItem(RAIL_CLAVE)==='exp'}catch(e){}
  fijarRail(exp,false);
  var sh=document.getElementById('shell');
  // Clic en el velo (fuera del cajón) o Escape cierran el riel modal.
  if(sh)sh.addEventListener('click',function(ev){
    if(railModal()&&sh.classList.contains('rail-expandido')&&!ev.target.closest('.nav-rail,.nav-barra'))fijarRail(false,false)});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')cerrarRailModal()});
  iniciarInfo()}

/* ══════════════ Botón ⓘ de las gráficas ═══════════════════════════════
   La explicación de cada gráfica vive en un <span class="hint info-pop"> dentro del
   botón .info del título: solo se ve al pasar el cursor (o con foco / toque). El JS de
   cada pestaña la sigue llenando con innerText como antes; aquí se parte en renglones
   cortos (uno por cada " · ") para que se lea como una lista resumida. */
function infoRenglones(t){
  return String(t||'').split(' · ').map(function(x){x=x.trim();return x.charAt(0).toUpperCase()+x.slice(1)})
    .filter(Boolean).join('\n')}
/* Tarjetas colapsables: botón ˄/˅ arriba a la derecha de cada tarjeta de `raiz`; plegada solo
   deja ver su cabecera (título, o las cifras en la tarjeta de KPIs). Se recuerda en localStorage
   (visor.colapsadas, por id de vista + título). `alAbrir(card)` repinta lo que se midió oculto. */
function iniciarColapsables(raiz,alAbrir){
  if(!raiz||!raiz.querySelectorAll)return;
  var guard={};try{guard=JSON.parse(localStorage.getItem('visor.colapsadas')||'{}')||{}}catch(e){}
  Array.prototype.forEach.call(raiz.querySelectorAll('.card'),function(card,i){
    if(card.dataset.colapsable)return;
    var cab=null;
    for(var k=0;k<card.children.length;k++){var c=card.children[k];
      if(c.matches&&c.matches('.mtd-panel-cab,.sivso-graf-cab,.so-visual-cab,h3,.cifras')){cab=c;break}}
    if(!cab)return;
    card.dataset.colapsable='1';cab.classList.add('cab-col');card.classList.add('con-colapsar');
    var h3=card.querySelector('h3'),clave=(raiz.id||'')+':'+(h3?h3.textContent.replace(/\s+/g,' ').trim().slice(0,40):'kpis'+i);
    var b=document.createElement('button');b.type='button';b.className='btn-colapsar';
    function fijar(plegada){card.classList.toggle('colapsada',plegada);b.setAttribute('aria-expanded',plegada?'false':'true');
      b.title=plegada?'Mostrar la sección':'Contraer la sección';b.setAttribute('aria-label',b.title)}
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>';
    b.onclick=function(){var plegada=!card.classList.contains('colapsada');fijar(plegada);
      try{var g=JSON.parse(localStorage.getItem('visor.colapsadas')||'{}')||{};if(plegada)g[clave]=1;else delete g[clave];
        localStorage.setItem('visor.colapsadas',JSON.stringify(g))}catch(e){}
      if(!plegada&&alAbrir)alAbrir(card)};
    card.appendChild(b);fijar(!!guard[clave])})}

function iniciarInfo(){
  if(typeof MutationObserver==='undefined'||!document.querySelectorAll)return;
  var obs=new MutationObserver(function(ms){ms.forEach(function(m){
    var el=m.target.nodeType===3?m.target.parentNode:m.target;
    if(el&&el.textContent.indexOf(' · ')!==-1)el.textContent=infoRenglones(el.textContent)})});
  document.querySelectorAll('.info-pop').forEach(function(el){
    if(el.textContent.indexOf(' · ')!==-1)el.textContent=infoRenglones(el.textContent);
    obs.observe(el,{childList:true,characterData:true,subtree:true})})}

/* ══════════════ Arranque diferido del mapa ═════════════════════════ */
function programarMapa(){
  if(mapaEstado!=='no')return;
  var ir=function(){iniciarMapa()};
  // En idle (con tope de 3 s) para no competir con el render de Ventas MTD.
  if(window.requestIdleCallback)requestIdleCallback(ir,{timeout:3000});else setTimeout(ir,600)}

/* Primera vez que el usuario abre "Mapa" (o cada vez que vuelve a él). */
function mapaAlEntrar(){
  if(mapaEstado==='no')iniciarMapa();
  else if(mapaEstado==='listo'&&mapaSucio){mapaSucio=false;actualizar()}}

function iniciarMapa(){
  if(mapaEstado!=='no')return;
  mapaEstado='cargando';
  var t=document.getElementById('overlayTexto');if(t)t.innerText='Preparando el mapa…';
  // Los datos se piden YA, en paralelo con Leaflet y Choices (antes se esperaba a las dos
  // librerías para recién pedir los 5 archivos). Las respuestas que lleguen antes de que el
  // mapa esté armado esperan en mapaPend y se procesan al final (mapaRecibir).
  cargarDatos();
  var okL=null,okC=false;
  function armar(){
    if(okL===null||!okC)return;
    if(!okL){
      mapaEstado='error';
      if(t)t.innerText='No se pudo cargar el mapa (Leaflet no llegó desde el CDN). Recarga la página.';
      avisar('Leaflet no cargó desde el CDN: el mapa no está disponible.',true);return}
    // Orden importante (ver CLAUDE.md): Choices primero, luego el mapa.
    iniciarMapaUI();
    mapaEstado='listo';
    var pend=mapaPend;mapaPend=[];pend.forEach(function(f){f()});
    actOverlay();
    despues()}
  cargarLib('leaflet',function(ok){okL=ok;armar()});
  cargarLib('choices',function(){okC=true;armar()});
  function despues(){
      // Con el mapa ya en marcha se precarga SI vs SO (la caché del servidor está tibia).
      setTimeout(function(){if(typeof sivsoPrefetch==='function')sivsoPrefetch()},2000);
      // …y Yoobic: el popup de cada PDV y las capas Perfect Store lo usan.
      setTimeout(function(){if(typeof ybPrefetch==='function')ybPrefetch()},2600)}}

/* ══════════════ Carga de datos del mapa ═════════════════════════════ */
/* Las 5 llamadas salen en paralelo y, con la caché del servidor fría o con
   varias cuentas de Google abiertas, alguna falla de forma pasajera ("HTTP 0",
   "Acceso denegado: DriveApp") aunque las demás respondan. Se reintenta hasta
   2 veces con espera creciente; la primera corrida ya dejó la caché tibia. */
var REINTENTOS_MAPA=2;
var mapaPend=[];   // respuestas que llegaron antes de que el mapa (Leaflet + UI) estuviera armado
function mapaRecibir(f){if(mapaEstado==='listo')f();else mapaPend.push(f)}
function llamarMapa(fn,ok,etq,grave,flag,n){
  n=n||0;
  function falla(m){
    if(n<REINTENTOS_MAPA){setTimeout(function(){llamarMapa(fn,ok,etq,grave,flag,n+1)},1500*(n+1));return}
    if(/HTTP 0|DriveApp|denegado|denied/i.test(m))
      m+=' — Si tienes varias cuentas de Google abiertas, abre el visor en una ventana de incógnito solo con tu cuenta de ISDIN.';
    mapaRecibir(function(){avisar(etq+': '+m,grave);listo[flag]=true;boot()})}
  google.script.run
    .withSuccessHandler(function(j){
      // Se valida ANTES de procesar: una respuesta vacía o rota (p. ej. "" de una caché mal
      // leída) antes lanzaba dentro del handler y el overlay quedaba "Cargando…" para siempre.
      var d;try{d=JSON.parse(j)}catch(e){falla('respuesta ilegible del servidor ('+me(e)+')');return}
      mapaRecibir(function(){ok(d)})})
    .withFailureHandler(function(e){falla(me(e))})[fn]();
}
function cargarDatos(){
  if(!esGas()){setTimeout(function(){mapaRecibir(cargarMock)},250);return}
  // Sell Out primero: es el más pesado (so_pdv.json, ~4,5 MB) y el que más tarda.
  llamarMapa('getVentasJson',recVentas,'Sell Out',true,'ventas');
  llamarMapa('getPuntosJson',recPuntos,'PDV',true,'puntos');
  llamarMapa('getBricksJson',recBricks,'Bricks',true,'bricks');
  llamarMapa('getPortafolioJson',recPort,'Portafolio',false,'port');
  llamarMapa('getAsignacionesJson',recAsignaciones,'Asignación',false,'asignaciones');
}

function recPuntos(p){
  puntosG=(p.puntos||[]).filter(function(x){return x.posId&&x.posId!=='0'});
  // Un mapa sin PDV no es un error del servidor (la hoja respondió), así que antes no
  // salía ningún aviso: el Sell Out quedaba en $0 sin explicación. Se dice qué pasó.
  if(!puntosG.length){var st=p.stats||{};
    avisar('PDV: la hoja "CO_Puntos_Maestro clientes" no dejó ningún PDV para el mapa. '+
      'Filas leídas: '+(st.filas||0)+' · con coordenada: '+(st.conCoordenada||0)+
      ' · con Nº Oficina Farmacia (POS_ID): '+(st.conPosId||0)+
      ' · columna POS_ID detectada: '+(st.columnaPosIdDetectada||'(no encontrada)')+
      '. Sin POS_ID no se puede cruzar con el Sell Out. Revisa "Diagnóstico".'+
      (st.motivosSinCoordenada?' Coordenadas descartadas: '+JSON.stringify(st.motivosSinCoordenada)+
        (st.muestraSinCoordenada&&st.muestraSinCoordenada.length?' · ejemplo: '+JSON.stringify(st.muestraSinCoordenada[0]):''):''),true)}
  puntosG.forEach(function(x){x.poblacion=normGeo(x.poblacion);x.region=normGeo(x.region)});
  listo.puntos=true;boot()}
function recBricks(p){bricksG=p.bricks||[];
  var st=p.stats||{};
  if(!bricksG.length||!st.conGeometria)
    avisar('Bricks: la hoja "Bricks" devolvió '+bricksG.length+' bricks y '+(st.conGeometria||0)+
      ' con geometría; el mapa no puede dibujar los polígonos ni asignar zona. Revisa "Diagnóstico".',true);
  listo.bricks=true;boot()}
function recVentas(p){
  mesesD=p.meses||[];var pdv=p.pdv||{};ventasG={};var bs={};
  Object.keys(pdv).forEach(function(pos){var bus=pdv[pos].bu||{};ventasG[pos]=bus;
    Object.keys(bus).forEach(function(b){bs[b]=1})});
  busD=Object.keys(bs).sort();
  // idxSel debe existir antes de marcar ventas como listas y antes de boot().
  aplicarPreset('TODOS',true);
  // Si el portafolio llegó primero, se revalida el SKU con los meses ya definidos.
  if(listo.port)validarSku();
  listo.ventas=true;boot()}
// so_portafolio.json del ETL: {meses, sku:{SKU:{desc,familia,bu,serie}}}.
// Se normaliza al formato interno {d,bu,f,s}; también acepta {productos:{d,bu,f,s}}.
function recPort(p){
  var src=p.productos||p.sku||{};productosG={};
  Object.keys(src).forEach(function(k){var x=src[k]||{};
    productosG[k]={d:x.d||x.desc||k,bu:String(x.bu||'').trim().toUpperCase(),
      f:x.f||x.familia||'',s:x.s||x.serie||[]}});
  validarSku();listo.port=true;boot()}
function recAsignaciones(p){asignacionesG=p.pdv||{};listo.asignaciones=true;boot();
  if(typeof ybCoberturaRefrescar==='function')ybCoberturaRefrescar()}

/* boot() lo llama cada una de las 5 respuestas. Antes disparaba actualizar()
   en TODAS (hasta 5 corridas completas que recreaban todos los marcadores);
   ahora una sola cuando puntos+bricks+ventas están listos y otra cuando llegan
   las asignaciones (las necesitan los badges y el filtro de agente). */
function boot(){
  actOverlay();
  if(listo.bricks&&listo.puntos&&!asignado){
    asignarBricks();dibujarBricks();asignado=true;
    // Yoobic necesita los PDV (Cliente/Ciudad del CRM) y su brick (→ Zona).
    if(typeof ybAlCargarMapa==='function')ybAlCargarMapa();
    // En un mapa oculto (0x0) fitBounds calcularía un zoom absurdo: el
    // ResizeObserver de JsMapa reencuadra cuando la pestaña se hace visible.
    if(map&&map.getSize().x>0&&bbBricks&&bbBricks.isValid())map.fitBounds(bbBricks,{padding:[30,30]})}
  if(listo.puntos&&listo.bricks&&listo.ventas){
    if(!pintadoBase){pintadoBase=true;pintadoAsig=listo.asignaciones;actualizar()}
    else if(listo.asignaciones&&!pintadoAsig){pintadoAsig=true;actualizar()}}
}

function actOverlay(){
  var o=document.getElementById('overlay');if(!o)return;
  if(listo.puntos&&listo.bricks&&listo.ventas&&listo.port&&listo.asignaciones){o.style.display='none';return}
  var f=[];if(!listo.puntos)f.push('PDV');if(!listo.bricks)f.push('bricks');
  if(!listo.ventas)f.push('Sell Out');if(!listo.port)f.push('portafolio');
  if(!listo.asignaciones)f.push('asignación');
  document.getElementById('overlayTexto').innerText='Cargando '+f.join(', ')+'…'}

/* ── Diagnóstico ────────────────────────────────────────────────────── */
function abrirDiag(){document.getElementById('modalDiag').style.display='flex';
  var p=document.getElementById('diagTexto');
  if(!esGas()){p.innerText='Solo disponible dentro de Apps Script.';return}
  var mtd=(typeof mtdTextoConciliacion==='function')?mtdTextoConciliacion():'';
  p.innerText=mtd+'Consultando…';
  google.script.run.withSuccessHandler(function(j){p.innerText=mtd+JSON.stringify(JSON.parse(j),null,2)})
    .withFailureHandler(function(e){p.innerText=mtd+'Error: '+me(e)}).getDiagnosticoJson()}
function cerrarDiag(){document.getElementById('modalDiag').style.display='none'}

/* ══════════════ Datos de prueba (solo fuera de Apps Script) ══════════
   Index.html abierto directo en el navegador entra aquí: permite revisar
   el layout y la densidad del mapa sin desplegar. Generador determinista
   (LCG) para que dos capturas seguidas sean idénticas.                  */
function cargarMock(){
  var sem=42;function rnd(){sem=(sem*1103515245+12345)%2147483648;return sem/2147483648}
  var CIUS=[{c:'BOGOTA',dep:'BOGOTA D.C.',lat:4.66,lng:-74.08,pre:'BOG',n:150},
            {c:'MEDELLIN',dep:'ANTIOQUIA',lat:6.25,lng:-75.57,pre:'MED',n:90},
            {c:'CALI',dep:'VALLE DEL CAUCA',lat:3.44,lng:-76.52,pre:'CAL',n:70},
            {c:'CARTAGENA',dep:'BOLIVAR',lat:10.40,lng:-75.50,pre:'CTG',n:50}];
  var GRUPOS=['BELLA PIEL','LA REBAJA','CRUZ VERDE','FARMATODO','COPIDROGAS','INDEPENDIENTE'];
  var CANALES=['Ph Independents','Corporations','Chains','Dermo'];
  var POTS=['AA','A','B','C'];
  var AGS=[{delegado:'Ana Pérez',team:'VM'},{delegado:'Luis Gómez',team:'LAM'},
           {delegado:'Marta Ruiz',team:'VM'},{delegado:'Jorge Díaz',team:'LAM'}];
  var BUS=['FOTO','DERMA','CORPORAL'];
  var meses=[];for(var m=1;m<=9;m++)meses.push('2026-'+(m<10?'0':'')+m);
  var puntos=[],bricks=[],ventas={},asig={},k=0;

  CIUS.forEach(function(ci){
    for(var gx=0;gx<2;gx++)for(var gy=0;gy<2;gy++){
      var x0=ci.lng-0.06+gx*0.06,y0=ci.lat-0.06+gy*0.06;
      var id=ci.pre+'-'+(gx*2+gy+1);
      bricks.push({brickId:id,nombre:'ZONA '+(gx*2+gy+1),zona:ci.c,ciudad:ci.c,
        departamento:ci.dep,nombreBrick:ci.c+', ZONA '+(gx*2+gy+1),
        geometry:{type:'Polygon',coordinates:[[[x0,y0],[x0+0.06,y0],[x0+0.06,y0+0.06],
          [x0,y0+0.06],[x0,y0]]]}});
    }
    for(var i=0;i<ci.n;i++){
      k++;var pos='MOCK'+k;
      var lat=ci.lat-0.06+rnd()*0.12,lng=ci.lng-0.06+rnd()*0.12;
      puntos.push({id:'A'+k,idSap:rnd()<0.55?'SAP-'+k:'',posId:pos,
        name:GRUPOS[(k*7)%GRUPOS.length]+' '+ci.c.slice(0,3)+' '+(i+1),
        lat:lat,lng:lng,grupo:GRUPOS[(k*7)%GRUPOS.length],channel:CANALES[k%CANALES.length],
        region:ci.dep,poblacion:ci.c,potencial:POTS[Math.floor(rnd()*4)],
        afinidad:'',direccion:'Cl '+(10+k%90)+' # '+(1+k%40),brickCrm:''});
      if(rnd()<0.62){var a=AGS[Math.floor(rnd()*AGS.length)];
        asig[pos]=[{delegado:a.delegado,team:a.team,tipo:'Farmacia/Parafarmacia',cuentaId:'',cuentaNombre:''}]}
      if(rnd()<0.8){var bu={};
        BUS.forEach(function(b){if(rnd()<0.6)return;var s=[];
          meses.forEach(function(mm,mi){if(rnd()<0.25)return;
            var u=Math.round(2+rnd()*60);s.push([mi,u,Math.round(u*(38000+rnd()*45000))])});
          if(s.length)bu[b]=s});
        if(Object.keys(bu).length)ventas[pos]={bu:bu}}
    }
  });

  var prods={};
  ['FP GEL CREAM SPF50 250ML','FP FUSION WATER SPF50','FP COMPACT ARENA SPF50+ 10G',
   'FOTOULTRA AGE REPAIR','ISDINCEUTICS FLAVO-C','GERMISDIN HIGIENE','UREADIN 10 LOCION',
   'NUTRADEICA CHAMPU','FOTOPROTECTOR PEDIATRICS','ISDINCEUTICS MELACLEAR'].forEach(function(d,i){
    var s=[];meses.forEach(function(mm,mi){var u=Math.round(80+rnd()*900);
      s.push([mi,u,Math.round(u*(40000+rnd()*30000))])});
    prods['84294202519'+(10+i)]={d:d,bu:BUS[i%BUS.length],f:'',s:s}});

  recPuntos({puntos:puntos});
  recBricks({bricks:bricks});
  recVentas({meses:meses,pdv:ventas});
  recPort({productos:prods});
  recAsignaciones({pdv:asig});
}
</script>
