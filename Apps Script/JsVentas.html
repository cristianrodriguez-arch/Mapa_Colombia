<script>
/* ══════════ JsVentas · pestaña "Ventas" (cartera del KAM) ══════════
   Primera pestaña desde el 2026-10-10. Une en UNA vista lo que antes vivía en
   "Ventas MTD" (sell-in del mes, se actualiza a diario) y "SI vs SO" (sell-out
   e inventario que los clientes reportan cada mes), pensada para el KAM y
   primero para el celular.

   REGLA DEL USUARIO (2026-10-10): SOLO DATOS REALES. Nada de proyecciones,
   "esperado a hoy", estados derivados de una proyección ni inventario estimado:
   los clientes compran a ritmos muy distintos (semanal, quincenal, mensual) y
   ninguna fórmula de cierre es confiable. Todo lo que se muestra es observado:
   plan, venta, Venta -1 (año anterior), sell-in/sell-out y el inventario que REPORTA el cliente.

   No pide nada nuevo al servidor: reutiliza los payloads de las otras dos
   pestañas (ventasMtdData + sivsoData, que trae además sivsoData.doh = DOH
   objetivo por SAP ID de la hoja 'Info SO-INV'). Todo se calcula aquí.

   Dependencias: FMT, esc, normTxt (JsNucleo) · ventasMtdData, mtdVenta1, mtdUlista,
   mtdCargando, mtdErrorCarga, cargarVentasMtd, mtdMoneda, mtdMonedaCorta,
   mtdPctEntero, mtdPctTxt, mtdTabla, mtdTd, mtdOrdenActual, mtdComparador,
   MTD_ORDEN, mtdDescargarCsv, mtdCsvFecha, MTD_MESES, MTD_MESES_LARGO,
   mtdVistaActiva (JsVentasMtd) · sivsoData, sivsoCargando, sivsoErrorCarga,
   cargarSIvsSO (JsSIvsSO).

   DEFINICIONES (ver DOCUMENTACION_KPIS.md §3.3):
     · Dos modos de la barra (switch): "vs plan" = sell-in del mes en curso contra
       su plan y el año anterior; "vs sell-out" = sell-in contra sell-out de una
       ventana de meses cerrados reportados (último mes · 3 meses · año).
     · Venta -1 = 'Real -1' de PLANTILLA: con el mes EN CURSO es el año anterior
       HASTA LA MISMA FECHA (verificado 2026-10-10: Cruz Verde 461,6 M contra
       4.789,8 M de oct-2025 completo). Δ y Δ% comparan contra eso (rótulos pedidos
       por el usuario: "Venta -1", "Δ%", "Venta YTD"; nada de "A-1").
     · Mismo mes del año pasado completo (lo RAYADO de la barra) = Histórico.
     · Sell-in/sell-out de la ventana = hoja 'Data' (misma fuente para los dos); la
       ventana termina en el último mes con sell-out en Data.
     · Días de inventario (DOH) = INV del ÚLTIMO mes reportado por el cliente ÷
       (sell-out promedio de los 3 meses que terminan ahí ÷ 30). Siempre con su
       mes al lado. En pesos (SO e INV valorizados a PVL, el mismo precio).
     · Tendencia del sell-out = sus 3 últimos meses reportados contra los mismos
       meses del año anterior.
   ═══════════════════════════════════════════════════════════════ */

var VT_DIAS_LABORALES={1:1,2:1,3:1,4:1,5:1};   // getDay(): lunes a viernes
var VT_DATOS_HASTA_AYER=true;  // la descarga del día trae las ventas hasta ayer
var VT_DOH_DEF=60;             // DOH objetivo cuando 'Info SO-INV' no trae el del cliente
var VT_ALTO=1.25;              // DOH reportado > objetivo × 1,25 → sobreinventario
var VT_BAJO=0.5;               // DOH reportado < objetivo × 0,5  → bajo inventario
var VT_SOBRE_PROD=2;           // por producto: DOH > objetivo × 2 → sobrestock
var VT_PROM_N=3;               // meses del promedio de sell-out (DOH y tendencia)
var VT_SO_REZAGO=4;            // meses sin reportar sell-out antes de tratarlo como "sin sell-out reciente"
var VT_LS='vt_v2';

/* Acción sugerida por cliente según SU inventario reportado y SU sell-out (datos
   reportados, nada estimado): [texto, color del punto, explicación]. Color con
   significado (Zebra BI): verde = oportunidad, rojo = problema, naranja = vigilar. */
var VT_ACC={
  empujar:['Empujar pedido','#1e8e3e','Poco inventario y su sell-out crece: necesita producto.'],
  oportunidad:['Oportunidad de pedido','#1e8e3e','Inventario sano y sell-out creciendo: hay espacio para venderle más.'],
  activar:['Activar sell-out','#e41f33','Sobreinventario y su sell-out cae: el producto no está rotando.'],
  vigilar:['Vigilar inventario','#ef7d00','Tiene más inventario que su objetivo, pero su sell-out crece.'],
  quiebre:['Revisar quiebre','#ef7d00','Poco inventario y su sell-out cae: puede estar vendiendo menos por falta de producto.'],
  ok:['Sin alerta','#4b5563','Inventario dentro de su objetivo.'],
  sinso:['Sin sell-out','#9ca3af','No reporta sell-out o inventario recientes.']};
var VT_SENAL={quiebre:['Riesgo de quiebre','#e41f33'],sobre:['Sobrestock','#ef7d00'],sinrot:['Sin rotación','#ef7d00']};

var vtEstado={kam:'',canal:'',vista:'clientes',modo:'plan',unidad:'$',vent:3,
  seg:'',q:'',qp:'',bu:'',marca:'',orden:'',ficha:null,topeProd:60};
var vtMod=null;                      // modelo derivado; se invalida con datos, filtros, unidad o ventana
var vtSO=null,vtH=null,vtPM=null;    // índices por carga (sell-out, histórico, PLANTILLA)
var vtListaVista=[],vtProdVista=[],vtVistaProdCli=[];   // lo que se ve (clic → ficha, CSV)

/* ══════════ Calendario: días hábiles de Colombia ══════════ */
function vtPascua(y){   // algoritmo de Meeus/Jones/Butcher (calendario gregoriano)
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
      g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;
  return new Date(y,Math.floor(n/31)-1,(n%31)+1)}
function vtClave(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var vtFestCache={};
/* Festivos de Colombia (Ley 51 de 1983, "Ley Emiliani"): fijos, trasladables al
   lunes siguiente y los que dependen de la Pascua. */
function vtFestivosCO(y){
  if(vtFestCache[y])return vtFestCache[y];
  var s={};
  function marcar(d){s[vtClave(d)]=1}
  function alLunes(d){var w=d.getDay();if(w!==1)d.setDate(d.getDate()+((8-w)%7));marcar(d)}
  [[1,1],[5,1],[7,20],[8,7],[12,8],[12,25]].forEach(function(x){marcar(new Date(y,x[0]-1,x[1]))});
  [[1,6],[3,19],[6,29],[8,15],[10,12],[11,1],[11,11]].forEach(function(x){alLunes(new Date(y,x[0]-1,x[1]))});
  function pascua(n){var p=vtPascua(y);p.setDate(p.getDate()+n);return p}
  marcar(pascua(-3));marcar(pascua(-2));                       // Jueves y Viernes Santo
  alLunes(pascua(39));alLunes(pascua(60));alLunes(pascua(68)); // Ascensión, Corpus, Sagrado Corazón
  return(vtFestCache[y]=s)}
function vtEsHabil(d){return!!VT_DIAS_LABORALES[d.getDay()]&&!vtFestivosCO(d.getFullYear())[vtClave(d)]}
/* Días hábiles del mes m (1-12) hasta el día `hasta` incluido (null = mes completo). */
function vtHabilesMes(y,m,hasta){
  var n=0,fin=new Date(y,m,0).getDate();if(hasta!=null)fin=Math.min(fin,hasta);
  for(var d=1;d<=fin;d++)if(vtEsHabil(new Date(y,m-1,d)))n++;
  return n}

/* Día al que llegan los datos de Ventas MTD. */
function vtFechaDatos(){
  var m=(ventasMtdData&&ventasMtdData.meta)||{},iso=m.libroActualizado||m.actualizadoEn;
  var d=iso?new Date(iso):new Date();if(isNaN(d.getTime()))d=new Date();
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(VT_DATOS_HASTA_AYER)d.setDate(d.getDate()-1);
  return d}

/* Mes del informe (periodo de la hoja CUMPLIMIENTO) y cuántos días hábiles van y
   quedan: es un HECHO del calendario, no se usa para proyectar nada. k = índice
   absoluto de mes (año×12 + mes−1), el mismo de sivsoData.filas. */
function vtAvance(){
  var p=((ventasMtdData&&ventasMtdData.meta)||{}).periodo||{},hoy=vtFechaDatos();
  var anio=p.anio||hoy.getFullYear(),mes=p.mes||hoy.getMonth()+1;
  var kp=anio*12+mes-1,kh=hoy.getFullYear()*12+hoy.getMonth(),tot=vtHabilesMes(anio,mes,null);
  var trans=kh>kp?tot:(kh<kp?0:vtHabilesMes(anio,mes,hoy.getDate()));
  return{anio:anio,mes:mes,k:kp,tot:tot,trans:trans,rest:tot-trans,cerrado:kh>kp,fecha:hoy}}

/* ══════════ Índices (una vez por carga de datos) ══════════ */
function vtNormProd(n){return normTxt(n).replace(/\s+/g,' ').trim()}

function vtIndexar(av){
  var D=ventasMtdData;
  if(!vtH){
    // Histórico: el mismo mes del año anterior COMPLETO (lo rayado de la barra) y
    // los meses anteriores del año pasado (Venta -1 YTD).
    var h={a1Prev:{},a1Mes:{}};
    (D.hist||[]).forEach(function(r){
      var id=r[2];
      if(r[0]===av.anio-1&&r[1]<av.mes)h.a1Prev[id]=(h.a1Prev[id]||0)+r[3];
      if(r[0]===av.anio-1&&r[1]===av.mes)h.a1Mes[id]=(h.a1Mes[id]||0)+r[3]});
    vtH=h}
  if(!vtPM){
    // PLANTILLA por cliente × producto (nombre normalizado: se cruza con 'Data').
    var pm={};
    (D.prod||[]).forEach(function(r){
      var nom=D.productos[r[1]]||'(sin nombre)',pk=vtNormProd(nom),c=pm[r[0]]||(pm[r[0]]={});
      var x=c[pk]||(c[pk]={nombre:nom,v:0,a1:0,u:0});
      x.v+=r[2];x.a1+=r[3];x.u+=r[4]});
    vtPM=pm}
  if(!vtSO&&sivsoData){
    // Sell-in/sell-out/INV por cliente y por cliente × producto, indexado por mes k.
    var cli={},prod={},kMax=-1;
    function acum(m,f){var x=m[f.k]||(m[f.k]={si:0,so:0,inv:0,siU:0,soU:0,invU:0,inv1:0});
      x.si+=f.si||0;x.so+=f.so||0;x.siU+=f.siU||0;x.soU+=f.soU||0;
      if(f.tieneInv){x.inv+=f.inv||0;x.invU+=f.invU||0;x.inv1=1}}
    (sivsoData.filas||[]).forEach(function(f){
      var c=cli[f.sapId]||(cli[f.sapId]={sap:f.sapId,nombre:f.cliente,kam:f.kam,canal:f.channel,mens:{},prods:{},kSO:-1});
      acum(c.mens,f);
      if(f.so&&f.k>c.kSO)c.kSO=f.k;
      if(f.so&&f.k>kMax)kMax=f.k;
      var pk=vtNormProd(f.producto)||String(f.productId);
      acum((c.prods[pk]||(c.prods[pk]={mens:{}})).mens,f);
      if(!prod[pk])prod[pk]={nombre:f.producto||f.productId,bu:(f.bu||'').trim(),brand:(f.brand||'').trim()}});
    vtSO={cli:cli,prod:prod,kMax:kMax}}}

/* ══════════ Cálculos (solo datos observados) ══════════ */
function vtU(x,campo){return vtEstado.unidad==='#'?(x[campo+'U']||0):(x[campo]||0)}

/* Ventana de meses cerrados del modo "vs sell-out": termina en el último mes con
   sell-out en 'Data'. vent = 1 | 3 | 'anio'. */
function vtVentana(){
  var k1=vtSO&&vtSO.kMax>=0?vtSO.kMax:-1;
  if(k1<0)return null;
  var k0=vtEstado.vent==='anio'?Math.floor(k1/12)*12:k1-(Number(vtEstado.vent)||3)+1;
  return{k0:k0,k1:k1,etq:k0===k1?vtMesEtq(k1):MTD_MESES[k0%12]+'–'+vtMesEtq(k1)}}

/* Suma de sell-in y sell-out de una serie mensual en la ventana y en los mismos
   meses del año anterior (en la unidad elegida). */
function vtSumVentana(mens,w){
  var r={si:0,so:0,siLY:0,soLY:0};if(!w||!mens)return r;
  for(var k=w.k0;k<=w.k1;k++){
    var x=mens[k],y=mens[k-12];
    if(x){r.si+=vtU(x,'si');r.so+=vtU(x,'so')}
    if(y){r.siLY+=vtU(y,'si');r.soLY+=vtU(y,'so')}}
  return r}

/* Salud del canal con lo que REPORTA el cliente: último mes con sell-out (kSO), último
   mes con foto de inventario (kInv), DOH de esa foto y tendencia del sell-out. kSOf /
   kInvf fuerzan los meses (por producto se usan los del CLIENTE: un producto sin fila
   de INV ese mes tiene inventario 0, no una foto vieja). DOH siempre en pesos. */
function vtSalud(mens,obj,kSOf,kInvf){
  var kSO=-1,kInv=-1;
  Object.keys(mens).forEach(function(kk){var k=Number(kk),x=mens[k];
    if(x.so&&k>kSO)kSO=k;if(x.inv1&&k>kInv)kInv=k});
  if(kSOf!=null)kSO=kSOf;if(kInvf!=null)kInv=kInvf;
  if(kSO<0)return{sinDatos:true};
  function suma(kFin,campo){var s=0;for(var k=kFin-VT_PROM_N+1;k<=kFin;k++)s+=mens[k]?mens[k][campo]:0;return s}
  var r={kSO:kSO,kInv:kInv,obj:obj,promSO:suma(kSO,'so')/VT_PROM_N};
  r.so3=suma(kSO,'so');r.so3LY=suma(kSO-12,'so');
  r.dSO3=r.so3LY>0?r.so3/r.so3LY-1:null;
  var si6=0,so6=0;
  for(var k=kSO-5;k<=kSO;k++)if(mens[k]){si6+=mens[k].si;so6+=mens[k].so}
  r.sellThrough=si6>0?so6/si6:null;
  if(kInv<0)return r;
  var x=mens[kInv]||{};
  r.inv=x.inv||0;r.invU=x.invU||0;
  r.promSOInv=suma(kInv,'so')/VT_PROM_N;
  r.dohRep=r.promSOInv>0?r.inv/(r.promSOInv/30):null;
  return r}

function vtEstadoInv(sal,obj){
  if(sal.sinDatos||sal.viejo||sal.dohRep==null)return'sindatos';
  if(sal.dohRep>obj*VT_ALTO)return'alto';
  if(sal.dohRep<obj*VT_BAJO)return'bajo';
  return'sano'}
function vtEstadoSO(sal){
  if(sal.sinDatos||sal.viejo)return'sindatos';
  return sal.dSO3==null?'sinbase':(sal.dSO3>=0?'crece':'cae')}

/* Matriz inventario reportado × tendencia del sell-out. Sin año anterior para
   comparar ("sinbase") se decide solo por el inventario. */
function vtAccion(inv,so){
  if(inv==='sindatos')return'sinso';
  if(inv==='alto')return so==='cae'?'activar':'vigilar';
  if(inv==='bajo')return so==='cae'?'quiebre':'empujar';
  return so==='crece'?'oportunidad':'ok'}

/* Señal por producto (dentro de un cliente, con los meses del cliente). */
function vtSenal(r,obj){
  if(!r||r.sinDatos||r.kInv==null||r.kInv<0)return'';
  if(r.promSOInv>0&&(r.dohRep==null||r.dohRep<obj*VT_BAJO))return'quiebre';
  if(r.dohRep!=null&&r.dohRep>obj*VT_SOBRE_PROD)return'sobre';
  if(!(r.promSOInv>0)&&r.inv>0)return'sinrot';
  return''}

function vtObjetivo(sap){
  var d=sivsoData&&sivsoData.doh?sivsoData.doh[sap]:null;
  return d>0?{d:d,def:false}:{d:VT_DOH_DEF,def:true}}

/* Universo: la cartera de CUMPLIMIENTO más los clientes que solo existen en
   'Data' con sell-out reciente (no tienen plan, pero su canal sí cuenta). */
function vtUniverso(av){
  var D=ventasMtdData,u=[],vistos={};
  (D.clientes||[]).forEach(function(f){
    var sap=f.sapId||'';if(sap)vistos[sap]=1;
    u.push({id:f.id,sap:sap,cliente:f.cliente||sap||f.id,kam:f.kam||'SIN KAM',canal:f.canal||'SIN CANAL',m:f,
      so:vtSO&&sap?vtSO.cli[sap]||null:null})});
  if(vtSO)Object.keys(vtSO.cli).forEach(function(sap){
    var c=vtSO.cli[sap];
    if(vistos[sap]||c.kSO<0||av.k-c.kSO>VT_SO_REZAGO)return;
    u.push({id:sap,sap:sap,cliente:c.nombre||sap,kam:c.kam||'SIN KAM',canal:c.canal||'SIN CANAL',m:null,so:c})});
  return u}

/* Un cliente que solo existe en 'Data' (sin fila en CUMPLIMIENTO) no tiene venta,
   plan ni Venta -1 del mes: su Venta -1 se suma aparte (ver vtA1Fuera). */
function vtCalcCliente(u,av,w){
  var m=u.m||{},real=m.realMes||0,plan=m.planMes||0;
  var a1=(u.m&&mtdVenta1[u.id])||0,a1Mes=u.m?(vtH.a1Mes[u.id]||0):0;
  var x={u:u,id:u.id,sap:u.sap,cliente:u.cliente,kam:u.kam,canal:u.canal,interno:!!m.interno,
    real:real,plan:plan,a1:a1,a1Mes:a1Mes,realAnio:m.realAnio||0,planAnio:m.planAnio||0,
    a1Ytd:u.m?(vtH.a1Prev[u.id]||0)+a1:0};
  x.cumpl=plan>0?real/plan:null;
  x.dA1=a1>0?real/a1-1:null;x.dA1Abs=a1>0?real-a1:null;
  x.falta=plan>0?Math.max(0,plan-real):0;
  x.dA1Ytd=x.a1Ytd>0?x.realAnio/x.a1Ytd-1:null;
  x.cumplAnio=x.planAnio>0?x.realAnio/x.planAnio:null;
  var o=vtObjetivo(u.sap);x.obj=o.d;x.objDef=o.def;
  x.sal=u.so?vtSalud(u.so.mens,x.obj):{sinDatos:true};
  if(!x.sal.sinDatos&&av.k-x.sal.kSO>VT_SO_REZAGO)x.sal.viejo=true;
  x.eInv=vtEstadoInv(x.sal,x.obj);x.eSO=vtEstadoSO(x.sal);
  x.acc=vtAccion(x.eInv,x.eSO);
  // Para el resumen de su ficha en modo "vs sell-out" (mismos campos que vtTotales).
  x.conSO=(!x.sal.sinDatos&&!x.sal.viejo)?1:0;
  var hayInv=x.conSO&&x.sal.kInv>=0&&x.sal.dohRep!=null;
  x.inv=hayInv?x.sal.inv:0;x.invU=hayInv?x.sal.invU:0;x.dohRep=hayInv?x.sal.dohRep:null;
  // Ventana del modo "vs sell-out".
  var v=vtSumVentana(u.so?u.so.mens:null,w);
  x.si=v.si;x.so=v.so;x.siLY=v.siLY;x.soLY=v.soLY;
  x.ratio=x.si>0?x.so/x.si:null;
  x.dSO=x.soLY>0?x.so/x.soLY-1:null;x.dSI=x.siLY>0?x.si/x.siLY-1:null;
  return x}

/* Venta -1 de los clientes que NO están en la cartera de CUMPLIMIENTO (perdidos, los que
   solo salen en PLANTILLA o en el Histórico, los que solo reportan sell-out),
   filtrado por KAM/canal: el total "Δ% vs Venta -1" debe incluirlos, como en Ventas MTD
   (si no, perder un cliente se vería como crecimiento). */
function vtA1Fuera(todos){
  var conMes={},o={a1:0,a1Prev:0,a1Mes:0};
  todos.forEach(function(x){if(x.u.m)conMes[x.id]=1});
  (typeof mtdUlista!=='undefined'?mtdUlista:[]).forEach(function(u){
    if(conMes[u.id]||!vtPasa(u))return;
    o.a1+=mtdVenta1[u.id]||0;o.a1Prev+=vtH.a1Prev[u.id]||0;o.a1Mes+=vtH.a1Mes[u.id]||0});
  return o}

function vtTotales(filas,fuera){
  fuera=fuera||{a1:0,a1Prev:0,a1Mes:0};
  var t={real:0,plan:0,a1:fuera.a1,a1Mes:fuera.a1Mes,realAnio:0,planAnio:0,a1Ytd:fuera.a1Prev,
    si:0,so:0,siLY:0,soLY:0,inv:0,invU:0,promSOInv:0,conSO:0,alDia:0};
  filas.forEach(function(x){
    t.real+=x.real;t.plan+=x.plan;t.a1+=x.a1;t.a1Mes+=x.a1Mes;
    t.realAnio+=x.realAnio;t.planAnio+=x.planAnio;t.a1Ytd+=x.a1Ytd;
    t.si+=x.si;t.so+=x.so;t.siLY+=x.siLY;t.soLY+=x.soLY;
    var s=x.sal;
    if(!s.sinDatos&&!s.viejo){t.conSO++;
      if(s.kInv>=0&&s.dohRep!=null){t.inv+=s.inv;t.invU+=s.invU;t.promSOInv+=s.promSOInv}}});
  t.cumpl=t.plan>0?t.real/t.plan:null;
  t.dA1=t.a1>0?t.real/t.a1-1:null;t.dA1Abs=t.a1>0?t.real-t.a1:null;
  t.falta=t.plan>0?Math.max(0,t.plan-t.real):0;
  t.dA1Ytd=t.a1Ytd>0?t.realAnio/t.a1Ytd-1:null;
  t.cumplAnio=t.planAnio>0?t.realAnio/t.planAnio:null;
  t.ratio=t.si>0?t.so/t.si:null;
  t.dSO=t.soLY>0?t.so/t.soLY-1:null;t.dSI=t.siLY>0?t.si/t.siLY-1:null;t.dSOAbs=t.soLY>0?t.so-t.soLY:null;
  t.dohRep=t.promSOInv>0?t.inv/(t.promSOInv/30):null;
  return t}

function vtPasa(u){return(!vtEstado.kam||u.kam===vtEstado.kam)&&(!vtEstado.canal||u.canal===vtEstado.canal)}

function vtModelo(){
  if(vtMod)return vtMod;
  var av=vtAvance();
  vtIndexar(av);
  var w=vtVentana();
  var todos=vtUniverso(av).map(function(u){return vtCalcCliente(u,av,w)});
  var filas=todos.filter(function(x){return vtPasa(x.u)});
  vtMod={av:av,w:w,todos:todos,filas:filas,tot:vtTotales(filas,vtA1Fuera(todos)),prods:null};
  return vtMod}

/* Productos del contexto (KAM/canal): PLANTILLA del mes + sell-in/sell-out de la
   ventana + inventario reportado por cliente × producto. Se calcula solo al abrir
   Productos o una ficha. */
function vtModeloProductos(){
  var M=vtModelo();if(M.prods)return M.prods;
  var g={},w=M.w;
  M.filas.forEach(function(x){
    var pm=vtPM[x.id]||{},ok=x.u.so&&!x.sal.sinDatos&&!x.sal.viejo,so=ok?x.u.so.prods:{},ks={};
    Object.keys(pm).forEach(function(k){ks[k]=1});Object.keys(so).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(pk){
      var a=pm[pk],s=so[pk],info=vtSO&&vtSO.prod[pk];
      var p=g[pk]||(g[pk]={pk:pk,nombre:(a&&a.nombre)||(info&&info.nombre)||pk,bu:(info&&info.bu)||'',
        brand:(info&&info.brand)||'',venta:0,a1:0,und:0,si:0,so:0,siLY:0,soLY:0,inv:0,invU:0,promSOInv:0,
        cliCompra:0,cliSO:0,quiebre:0,sobre:0,det:[]});
      var r=s?vtSalud(s.mens,x.obj,x.sal.kSO,x.sal.kInv):null,v=vtSumVentana(s?s.mens:null,w);
      if(a){p.venta+=a.v;p.a1+=a.a1;p.und+=a.u;if(a.v>0)p.cliCompra++}
      p.si+=v.si;p.so+=v.so;p.siLY+=v.siLY;p.soLY+=v.soLY;if(v.so>0)p.cliSO++;
      var sg='';
      if(r&&!r.sinDatos){
        // DOH del producto solo con los clientes que reportan inventario.
        if(r.kInv>=0){p.inv+=r.inv;p.invU+=r.invU;p.promSOInv+=r.promSOInv}
        sg=vtSenal(r,x.obj);if(sg==='quiebre')p.quiebre++;if(sg==='sobre')p.sobre++}
      p.det.push({x:x,a:a||null,r:r,v:v,senal:sg})})});
  var lista=Object.keys(g).map(function(k){var p=g[k];
    p.dA1=p.a1>0?p.venta/p.a1-1:null;
    p.dSO=p.soLY>0?p.so/p.soLY-1:null;
    p.doh=p.promSOInv>0?p.inv/(p.promSOInv/30):null;return p})
    .filter(function(p){return p.venta||p.a1||p.si||p.so||p.inv});
  M.prods={lista:lista,idx:g};
  return M.prods}

/* ══════════ Estado, filtros y navegación ══════════ */
function vtGuardar(){
  try{localStorage.setItem(VT_LS,JSON.stringify({kam:vtEstado.kam,canal:vtEstado.canal,vista:vtEstado.vista,
    modo:vtEstado.modo,unidad:vtEstado.unidad,vent:vtEstado.vent}))}catch(e){}}
function vtRestaurar(){
  try{var g=JSON.parse(localStorage.getItem(VT_LS)||'null');
    if(g){vtEstado.kam=g.kam||'';vtEstado.canal=g.canal||'';vtEstado.vista=g.vista==='productos'?'productos':'clientes';
      vtEstado.modo=g.modo==='so'?'so':'plan';vtEstado.unidad=g.unidad==='#'?'#':'$';
      vtEstado.vent=(g.vent===1||g.vent===3||g.vent==='anio')?g.vent:3}}
  catch(e){}}
vtRestaurar();

function vtAlEntrar(){
  if(ventasMtdData===null&&!mtdCargando)cargarVentasMtd();
  if(typeof sivsoData!=='undefined'&&sivsoData===null&&!sivsoCargando&&typeof cargarSIvsSO==='function')cargarSIvsSO();
  vtRender()}

function vtSetCanal(v){vtEstado.canal=v;vtEstado.seg='';vtMod=null;vtEstado.ficha=null;vtGuardar();vtRender()}

function vtSetVent(v){vtEstado.vent=v;vtMod=null;vtGuardar();vtRender()}
function vtVer(v){vtEstado.vista=v;vtEstado.ficha=null;vtGuardar();vtRender();vtArriba()}
function vtSetSeg(s){vtEstado.seg=vtEstado.seg===s?'':s;vtRender()}
function vtSetOrden(o){vtEstado.orden=o;vtRender()}
function vtBuscar(q){vtEstado.q=q;vtPintarLista()}
function vtBuscarProd(q){vtEstado.qp=q;vtEstado.topeProd=60;vtPintarProductos()}
function vtSetBu(b){vtEstado.bu=vtEstado.bu===b?'':b;vtEstado.topeProd=60;vtPintarProductos()}
function vtSetMarca(m){vtEstado.marca=m;vtEstado.topeProd=60;vtPintarProductos()}
function vtMasProd(){vtEstado.topeProd+=100;vtPintarProductos()}
function vtAbrirCliente(i){var x=vtListaVista[i];if(!x)return;vtEstado.ficha={tipo:'cliente',id:x.id};vtRender();vtArriba()}
function vtAbrirClienteId(id){vtEstado.ficha={tipo:'cliente',id:id};vtRender();vtArriba()}
function vtAbrirProducto(pk){vtEstado.ficha={tipo:'producto',pk:pk};vtRender();vtArriba()}
function vtCerrarFicha(){vtEstado.ficha=null;vtRender()}
function vtArriba(){var v=document.getElementById('vistaVentas');if(v&&v.scrollTo)v.scrollTo(0,0)}

/* ══════════ Formato ══════════ */
function vtCorto(n){   // "ANGELICA MONSALVE" → "Angelica Monsalve"
  return String(n||'').toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function vtMesEtq(k){return MTD_MESES[k%12]+' '+Math.floor(k/12)}
function vtDias(v){return v==null||!isFinite(v)?'–':FMT.format(Math.round(v))+' d'}
function vtPct(v){return v==null||!isFinite(v)?'–':mtdPctEntero(v)}
/* Cifras de sell-in/sell-out/inventario en la unidad elegida ($ o #). */
function vtCant(v){return vtEstado.unidad==='#'?FMT.format(Math.round(v||0))+' und':mtdMonedaCorta(v)}
function vtCantLarga(v){return vtEstado.unidad==='#'?FMT.format(Math.round(v||0))+' und':mtdMoneda(v)}
function vtDelta(v){
  if(v==null||!isFinite(v))return'<span class="vt-na">–</span>';
  return'<span class="'+(v>=0?'vt-pos':'vt-neg')+'">'+(v>0?'+':'')+mtdPctTxt(v)+'</span>'}
function vtDeltaAbs(v){
  if(v==null||!isFinite(v))return'<span class="vt-na">–</span>';
  return'<span class="'+(v>=0?'vt-pos':'vt-neg')+'">'+(v>0?'+':v<0?'−':'')+mtdMonedaCorta(Math.abs(v))+'</span>'}
function vtDeltaUnd(v){
  if(v==null||!isFinite(v))return'<span class="vt-na">–</span>';
  return'<span class="'+(v>=0?'vt-pos':'vt-neg')+'">'+(v>0?'+':v<0?'−':'')+FMT.format(Math.round(Math.abs(v)))+' und</span>'}
function vtChip(acc){var a=VT_ACC[acc]||VT_ACC.ok;
  return'<span class="vt-chip" title="'+esc(a[2])+'"><span class="d" style="background:'+a[1]+'"></span><span class="t">'+esc(a[0])+'</span></span>'}
function vtChipSenal(s){if(!s)return'';var a=VT_SENAL[s];
  return'<span class="vt-chip"><span class="d" style="background:'+a[1]+'"></span>'+esc(a[0])+'</span>'}
/* "Sell-out e inventario valorizados a PVL": asterisco discreto. */
var VT_PVL='<span class="vt-pvl" title="Sell-out e inventario valorizados a PVL (precio de venta del laboratorio)">*</span>';
var VT_PVL_NOTA='<div class="vt-pvl-nota">* Sell-out e inventario valorizados a PVL.</div>';

/* Barra de bala (bullet), con datos reales:
     modo plan → pista = plan · rayado = mismo mes del año pasado completo ·
                 sólida = venta del mes · raya = Venta -1 (a la misma fecha)
     modo so   → pista = sell-in · rayado = sell-out del año anterior ·
                 sólida = sell-out (de la ventana)                          */
function vtBarraDatos(x,modo){
  if(modo==='so')return{pista:x.si,rayado:x.soLY,barra:x.so,raya:null,color:'var(--accent)'};
  return{pista:x.plan,rayado:x.a1Mes,barra:x.real,raya:x.a1>0?x.a1:null,color:'var(--ink)'}}
function vtBullet(x,modo){
  var b=vtBarraDatos(x,modo),max=Math.max(b.pista||0,b.rayado||0,b.barra||0)*1.02;
  if(!(max>0))return'<div class="vt-bul vacio"></div>';
  function p(v){return(Math.max(0,Math.min(1,v/max))*100).toFixed(1)+'%'}
  return'<div class="vt-bul">'+(b.pista>0?'<span class="pista" style="width:'+p(b.pista)+'"></span>':'')+
    (b.rayado>0?'<span class="rayado" style="width:'+p(b.rayado)+'"></span>':'')+
    '<span class="barra" style="width:'+p(b.barra)+';background:'+b.color+'"></span>'+
    (b.raya?'<span class="raya" style="left:'+p(b.raya)+'"></span>':'')+'</div>'}

/* ══════════ Render ══════════ */
function vtRender(){
  var cuerpo=document.getElementById('vtCuerpo');if(!cuerpo)return;
  vtPintarSeg();
  if(!ventasMtdData){
    cuerpo.innerHTML=mtdErrorCarga?
      '<div class="card mtd-estado"><b>No pude cargar las ventas.</b><br>'+esc(mtdErrorCarga)+
        '<br><button class="btn" style="margin-top:10px" onclick="vtActualizar()">Reintentar</button></div>':
      '<div class="mtd-estado"><span class="mtd-spinner"></span>Cargando ventas…</div>';
    vtPintarControles(null);
    return}
  var M=vtModelo();
  // Un KAM/canal recordado que ya no existe se descarta y el modelo se rehace.
  if(vtPintarControles(M)){M=vtModelo();vtPintarControles(M)}
  if(vtEstado.ficha&&vtEstado.ficha.tipo==='cliente'){vtRenderFichaCliente(M);return}
  if(vtEstado.ficha&&vtEstado.ficha.tipo==='producto'){vtRenderFichaProducto(M);return}
  if(vtEstado.vista==='productos'){vtRenderProductos(M);return}
  vtRenderClientes(M)}

function vtPintarSeg(){
  ['clientes','productos'].forEach(function(v){
    var b=document.getElementById('vtSeg'+(v==='clientes'?'Clientes':'Productos'));
    if(b){b.classList.toggle('activo',vtEstado.vista===v);
      b.setAttribute('aria-selected',vtEstado.vista===v?'true':'false')}})}

/* Selectores de KAM y Canal (nativos: en el celular abren el selector del sistema). */
function vtPintarControles(M){
  var sk=document.getElementById('vtKam'),sc=document.getElementById('vtCanal');
  var sub=document.getElementById('vtSub');
  if(!M){if(sub)sub.innerText='';return false}
  var kams={},canales={};
  M.todos.forEach(function(x){
    if(!vtEstado.canal||x.canal===vtEstado.canal)kams[x.kam]=(kams[x.kam]||0)+1;
    if(!vtEstado.kam||x.kam===vtEstado.kam)canales[x.canal]=(canales[x.canal]||0)+1});
  var reset=false;
  if(vtEstado.kam&&!kams[vtEstado.kam]){vtEstado.kam='';reset=true}
  if(vtEstado.canal&&!canales[vtEstado.canal]){vtEstado.canal='';reset=true}
  if(reset){vtMod=null;return true}
  function ops(obj,sel,todos){
    return'<option value="">'+todos+'</option>'+Object.keys(obj).sort(function(a,b){return a.localeCompare(b,'es')})
      .map(function(k){return'<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>'+esc(vtCorto(k))+' ('+obj[k]+')</option>'}).join('')}
  if(sk)sk.innerHTML=ops(kams,vtEstado.kam,'Todos los KAM');
  if(sc)sc.innerHTML=ops(canales,vtEstado.canal,'Todos los canales');
  var av=M.av;
  if(sub)sub.innerHTML=esc(MTD_MESES_LARGO[av.mes-1]+' '+av.anio)+' · '+
    (av.cerrado?'mes cerrado':'día hábil <b>'+av.trans+'</b> de '+av.tot)+
    ' · <span title="Día anterior a la última modificación del libro de Ventas MTD">ventas al '+
    esc(av.fecha.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}))+'</span>'+
    (M.w?' · sell-out a '+esc(vtMesEtq(M.w.k1)):'');
  return false}

/* Switch de la barra (vs plan / vs sell-out) + unidad ($/#) + ventana de meses.
   conModo=false (Productos y su ficha): sin el switch de la barra y con unidad y
   ventana siempre activas, porque esas tablas muestran sell-in y sell-out. */
function vtHtmlSwitches(conModo){
  if(conModo===undefined)conModo=true;
  var so=!conModo||vtEstado.modo==='so';
  function b(on,txt,fn,dis){return'<button type="button" class="'+(on?'activo':'')+'" onclick="'+fn+'"'+(dis?' disabled':'')+'>'+txt+'</button>'}
  return'<div class="vt-switches">'+
    (conModo?'<div class="vt-switch" role="group" aria-label="Comparar">'+b(!so,'vs plan',"vtSetModo('plan')")+b(so,'vs sell-out',"vtSetModo('so')")+'</div>':'')+
    '<div class="vt-switch chico" role="group" aria-label="Unidad" title="'+(so?'Pesos o unidades':'El plan solo existe en pesos: las unidades aplican en vs sell-out y en Productos')+'">'+
      b(vtEstado.unidad==='$','$',"vtSetUnidad('$')",!so)+b(vtEstado.unidad==='#','#',"vtSetUnidad('#')",!so)+'</div>'+
    (so?'<div class="vt-switch chico" role="group" aria-label="Meses">'+
      b(vtEstado.vent===1,'Último mes','vtSetVent(1)')+b(vtEstado.vent===3,'3 meses','vtSetVent(3)')+
      b(vtEstado.vent==='anio','Año',"vtSetVent('anio')")+'</div>':'')+
  '</div>'}

/* ── Vista Clientes: resumen + matriz + mensual + lista ── */

        '<div class="vt-segs" id="vtSegs"></div>'+
        '<input type="search" class="vt-buscar" placeholder="Buscar cliente…" value="'+esc(vtEstado.q)+'" oninput="vtBuscar(this.value)">'+
        (soListo?'':'<div class="vt-nota"><span class="mtd-spinner"></span>Cargando sell-out e inventario…</div>')+
        '<div id="vtLista"></div></section></div>'+
    '<div class="vt-col-b">'+vtHtmlMatriz(M)+vtHtmlMensual(M)+vtHtmlNotas(M)+'</div></div>';
  document.getElementById('vtCuerpo').innerHTML=h;
  vtPintarLista()}

/* Resumen (cartera completa o un cliente, en su ficha). n = null en la ficha. */
function vtHtmlHero(t,M,titulo,n){
  var av=M.av,so=vtEstado.modo==='so';
  function stat(etq,val,det){return'<div class="vt-stat"><div class="vt-etq">'+etq+'</div><div class="vt-num-m">'+val+'</div>'+
    (det?'<div class="vt-det">'+det+'</div>':'')+'</div>'}

  var mesLY=MTD_MESES_LARGO[av.mes-1].toLowerCase()+' '+(av.anio-1);
  var b=vtBarraDatos(t,'plan'),max=Math.max(b.pista,b.rayado,b.barra)*1.03;

      '<div class="vt-bg-barra" style="width:'+p(t.real)+'"></div>'+
      (t.a1>0&&!av.cerrado?'<div class="vt-bg-raya'+(t.a1/max<0.2?' izq':(t.a1/max>0.8?' der':''))+'" style="left:'+p(t.a1)+'" title="'+
        esc(vtCorto(mesLY))+' a la misma fecha: '+esc(mtdMoneda(t.a1))+'"><span>Venta -1 '+mtdMonedaCorta(t.a1)+'</span></div>':'')+
      (t.plan>0?'<div class="vt-bg-meta" style="left:'+p(t.plan)+'"><span>plan</span></div>':'')+
    '</div>'+
    '<div class="vt-bg-ley"><span><i class="sw-barra"></i>Venta del mes</span><span><i class="sw-pista"></i>Plan del mes</span>'+
      '<span><i class="sw-rayado"></i>'+esc(vtCorto(mesLY))+' completo</span>'+
      (av.cerrado?'':'<span><i class="sw-raya"></i>'+esc(vtCorto(mesLY))+' a la misma fecha</span>')+'</div>':'';
  return'<section class="card vt-hero">'+cab+
    '<div class="vt-hero-top"><div><div class="vt-etq">Venta del mes</div>'+
      '<div class="vt-num-xl">'+mtdMoneda(t.real)+'</div>'+
      '<div class="vt-det">'+(t.plan>0?'de '+mtdMoneda(t.plan)+' de plan · <b>'+vtPct(t.cumpl)+'</b> cumplido':'sin plan este mes')+'</div></div>'+

      stat(esc(vtCorto(mesLY))+' completo',t.a1Mes>0?mtdMonedaCorta(t.a1Mes):'–','mismo mes del año pasado')+
      stat('Venta YTD',mtdMonedaCorta(t.realAnio),
        (t.cumplAnio!=null?vtPct(t.cumplAnio)+' del plan del año · ':'')+'Δ% '+vtDelta(t.dA1Ytd)+' vs Venta -1 YTD')+

function vtHtmlHeroSO(t,M,cab,stat,n){
  var w=M.w;
  if(!vtSO||!w)return'<section class="card vt-hero">'+cab+'<div class="vt-nota"><span class="mtd-spinner"></span>'+

  var etqLY=w.k0===w.k1?vtMesEtq(w.k1-12):MTD_MESES[w.k0%12]+'–'+vtMesEtq(w.k1-12);

      (t.si>0?'<div class="vt-bg-pista" style="width:'+p(t.si)+'"></div>':'')+
      (t.soLY>0?'<div class="vt-bg-rayado" style="width:'+p(t.soLY)+'" title="Sell-out '+esc(etqLY)+': '+esc(vtCantLarga(t.soLY))+'"></div>':'')+
      '<div class="vt-bg-barra so" style="width:'+p(t.so)+'"></div>'+

      '<span><i class="sw-rayado"></i>Sell-out '+esc(etqLY)+'</span></div>':'';
  var invTxt=t.dohRep!=null?vtDias(t.dohRep):'–';
  return'<section class="card vt-hero">'+cab+
    '<div class="vt-hero-top"><div><div class="vt-etq">Sell-out'+VT_PVL+' · '+esc(w.etq)+'</div>'+
      '<div class="vt-num-xl">'+vtCantLarga(t.so)+'</div>'+
      '<div class="vt-det">de '+vtCantLarga(t.si)+' de sell-in · <b>'+vtPct(t.ratio)+'</b> vendido al consumidor</div></div>'+
      '<div class="vt-hero-der"><div class="vt-etq">Δ% sell-out vs año anterior</div><div class="vt-num-l">'+vtDelta(t.dSO)+'</div>'+
        '<div class="vt-det">'+(t.soLY>0?'Δ '+(vtEstado.unidad==='#'?vtDeltaUnd(t.dSOAbs):vtDeltaAbs(t.dSOAbs))+' · '+esc(etqLY)+' '+vtCant(t.soLY):'sin año anterior')+
        '</div></div></div>'+
    barra+
    '<div class="vt-stats">'+
      stat('Sell-in',vtCant(t.si),'Δ% '+vtDelta(t.dSI)+' vs año anterior')+
      stat('Sell-out ÷ sell-in',vtPct(t.ratio),'de lo facturado, lo vendido al consumidor')+
      stat('Inventario reportado'+VT_PVL,invTxt,(vtEstado.unidad==='#'?FMT.format(Math.round(t.invU))+' und':mtdMonedaCorta(t.inv))+
        ' · último mes reportado por cada cliente')+
      stat('Reportan sell-out',(n==null?(t.conSO?'Sí':'No'):t.conSO+' de '+n),'clientes con sell-out reciente')+
    '</div>'+VT_PVL_NOTA+'</section>'}

/* Matriz: inventario reportado (filas) × tendencia del sell-out (columnas). */
function vtHtmlMatriz(M){
  if(!vtSO)return'<section class="card vt-matriz-card"><h3>¿Empujar pedido o activar sell-out?</h3>'+
    '<div class="vt-nota"><span class="mtd-spinner"></span>'+
    (sivsoErrorCarga?'No pude cargar el sell-out: '+esc(sivsoErrorCarga):'Cargando sell-out e inventario…')+'</div></section>';
  var celdas={},sinSo=0,sinBase=0;
  M.filas.forEach(function(x){
    if(x.eInv==='sindatos'){sinSo++;return}
    if(x.eSO==='sinbase'){sinBase++;return}
    var k=x.eInv+':'+x.eSO,z=celdas[k]||(celdas[k]={n:0,so:0});
    z.n++;z.so+=x.sal.so3||0});
  function celda(inv,so,acc){
    var z=celdas[inv+':'+so]||{n:0},k='m:'+inv+':'+so,sel=vtEstado.seg===k,a=VT_ACC[acc];
    return'<button type="button" class="vt-m-celda'+(sel?' sel':'')+(z.n?'':' vacia')+'" onclick="vtSetSeg(\''+k+'\')"'+
      (z.n?'':' disabled')+' title="'+esc(a[2])+'">'+
      '<span class="acc"><span class="d" style="background:'+a[1]+'"></span>'+esc(a[0])+'</span>'+
      '<span class="n">'+z.n+'</span><span class="det">'+(z.n?mtdMonedaCorta(z.so)+' de sell-out en 3 meses':'')+'</span></button>'}
  return'<section class="card vt-matriz-card"><h3>¿Empujar pedido o activar sell-out?</h3>'+
    '<div class="hint">Días de inventario que reporta cada cliente contra su objetivo (filas) y su sell-out de los últimos 3 meses '+
      'reportados contra los mismos meses del año anterior (columnas). Clic en una casilla para ver esos clientes.</div>'+
    '<div class="vt-matriz">'+
      '<span></span><span class="vt-m-col">Sell-out crece</span><span class="vt-m-col">Sell-out cae</span>'+
      '<span class="vt-m-fila">Sobre-<br>inventario</span>'+celda('alto','crece','vigilar')+celda('alto','cae','activar')+
      '<span class="vt-m-fila">Inventario<br>sano</span>'+celda('sano','crece','oportunidad')+celda('sano','cae','ok')+
      '<span class="vt-m-fila">Bajo<br>inventario</span>'+celda('bajo','crece','empujar')+celda('bajo','cae','quiebre')+
    '</div>'+
    ((sinSo||sinBase)?'<div class="vt-m-pie">'+(sinSo?'<button type="button" class="vt-link" onclick="vtSetSeg(\'sinso\')">'+sinSo+
      (sinSo===1?' cliente':' clientes')+' sin sell-out reciente</button>':'')+(sinSo&&sinBase?' · ':'')+
      (sinBase?'<button type="button" class="vt-link" onclick="vtSetSeg(\'sinbase\')">'+sinBase+' sin año anterior para comparar</button>':'')+'</div>':'')+
  '</section>'}

/* Sell-in vs sell-out por mes de la cartera (hoja Data), con los días de inventario. */
function vtHtmlMensual(M){
  if(!vtSO||!M.w)return'';
  var mens={};
  M.filas.forEach(function(x){
    if(!x.u.so)return;
    Object.keys(x.u.so.mens).forEach(function(k){var a=x.u.so.mens[k],z=mens[k]||(mens[k]={si:0,so:0,inv:0,siU:0,soU:0,invU:0,inv1:0});
      z.si+=a.si;z.so+=a.so;z.siU+=a.siU;z.soU+=a.soU;if(a.inv1){z.inv+=a.inv;z.invU+=a.invU;z.inv1=1}})});
  return'<section class="card mtd-panel vt-mensual"><h3>Sell-in vs sell-out por mes</h3>'+
    '<div class="hint">Cartera filtrada · hoja Data · '+(vtEstado.unidad==='#'?'unidades':'pesos')+'</div>'+
    vtGrafMeses(vtSerieData(mens,M.w.k1))+VT_PVL_NOTA+'</section>'}

/* 12 meses de Data que terminan en kFin: sell-in, sell-out y DOH (si hay foto). */
function vtSerieData(mens,kFin){
  var s=[];
  for(var k=kFin-11;k<=kFin;k++){var d=mens[k]||{};
    s.push({k:k,si:vtU(d,'si'),so:vtU(d,'so'),doh:vtDohMes(mens,k)})}
  return s}
function vtDohMes(mens,k){
  var x=mens[k];if(!x||!x.inv1)return null;
  var s=0;for(var j=k-VT_PROM_N+1;j<=k;j++)s+=mens[j]?mens[j].so:0;
  s/=VT_PROM_N;return s>0?x.inv/(s/30):null}

/* Barras pareadas (sell-in oscuro · sell-out rojo), etiquetas directas y DOH abajo. */
function vtGrafMeses(serie){
  var max=0;serie.forEach(function(m){max=Math.max(max,m.si,m.so)});
  if(max<=0)return'<div class="mtd-vacio">Sin datos en los últimos 12 meses</div>';
  var ALTO=140,esc_=ALTO/(max*1.12),hayDoh=serie.some(function(m){return m.doh!=null});
  function corta(v){return vtEstado.unidad==='#'?FMT.format(Math.round(v/1000))+'k':mtdMonedaCorta(v).replace('$','')}
  var h=serie.map(function(m){
    var si=Math.round(Math.max(0,m.si)*esc_),so=Math.round(Math.max(0,m.so)*esc_);
    return'<div class="vt-g-col" title="'+esc(vtMesEtq(m.k)+' · sell-in '+vtCantLarga(m.si)+' · sell-out '+vtCantLarga(m.so)+
      (m.doh!=null?' · '+Math.round(m.doh)+' días de inventario':''))+'">'+
      '<div class="vt-g-val">'+(m.so?corta(m.so):'')+'</div>'+
      '<div class="vt-g-par" style="height:'+ALTO+'px">'+
        '<div class="vt-g-bar si" style="height:'+si+'px"></div>'+
        '<div class="vt-g-bar so" style="height:'+so+'px"></div></div>'+
      '<div class="vt-g-mes">'+MTD_MESES[m.k%12]+'</div>'+
      (hayDoh?'<div class="vt-g-doh">'+(m.doh!=null?Math.round(m.doh):'')+'</div>':'')+'</div>'}).join('');
  return'<div class="vt-graf">'+(hayDoh?'<div class="vt-g-dohetq">DOH</div>':'')+h+'</div>'+
    '<div class="hist-legend"><span class="it"><span class="sw-venta"></span>Sell-in</span>'+
    '<span class="it"><span class="sw-so"></span>Sell-out</span>'+
    (hayDoh?'<span class="it">DOH = días de inventario reportados al cierre del mes</span>':'')+'</div>'}

function vtHtmlNotas(M){
  var defs=M.filas.filter(function(x){return x.objDef&&!x.sal.sinDatos}).length;
  return'<section class="card vt-notas"><h3>Cómo leer esta vista</h3><ul>'+
    '<li><b>vs plan</b>: la barra sólida es la venta del mes, el gris el plan y lo <b>rayado</b> el mismo mes del año pasado completo; '+
      'la raya negra, lo que se llevaba el año pasado a la misma fecha.</li>'+
    '<li><b>vs sell-out</b>: la barra roja es el sell-out, el gris el sell-in de los mismos meses y lo rayado el sell-out del año anterior.</li>'+
    '<li><b>Venta -1</b> = lo vendido el año pasado <i>a la misma fecha</i>; <b>Δ%</b> = crecimiento o decrecimiento contra ella.</li>'+
    '<li><b>Inventario</b> = días de inventario <i>reportados</i> por el cliente en su último mes, contra su objetivo de la hoja Info SO-INV'+
      (defs?' ('+defs+' sin objetivo: se usan '+VT_DOH_DEF+' días)':'')+'.</li></ul></section>'}

/* Lista (se repinta sola al buscar, sin rehacer la vista). */
function vtFiltrarLista(M){
  var seg=vtEstado.seg,q=normTxt(vtEstado.q||'');
  return M.filas.filter(function(x){
    if(q&&normTxt(x.cliente).indexOf(q)===-1)return false;
    if(!seg)return true;
    if(seg==='sinso')return x.eInv==='sindatos';
    if(seg==='sinbase')return x.eInv!=='sindatos'&&x.eSO==='sinbase';
    if(seg.indexOf('m:')===0){var p=seg.split(':');return x.eInv===p[1]&&x.eSO===p[2]}
    return x.acc===seg})}

function vtOrdenar(l){
  function num(f,dir){return function(a,b){var x=f(a),y=f(b),nx=x==null||!isFinite(x),ny=y==null||!isFinite(y);
    if(nx||ny)return nx&&ny?0:(nx?1:-1);return dir*(y-x)}}
  var cmp={falta:num(function(x){return x.plan>0?x.falta:null},1),venta:num(function(x){return x.real},1),
    plan:num(function(x){return x.plan},1),cumpl:num(function(x){return x.cumpl},-1),
    da1:num(function(x){return x.dA1},-1),so:num(function(x){return x.so},1),
    dso:num(function(x){return x.dSO},-1),ratio:num(function(x){return x.ratio},-1),
    doh:num(function(x){return x.eInv==='sindatos'?null:x.sal.dohRep},1),
    nombre:function(a,b){return a.cliente.localeCompare(b.cliente,'es')}}[vtEstado.orden]||function(){return 0};
  return l.slice().sort(function(a,b){var r=cmp(a,b);return r||(b.real-a.real)})}

function vtPintarLista(){
  var M=vtModelo(),cont=document.getElementById('vtLista');if(!cont)return;
  vtPintarSegs(M);
  var l=vtOrdenar(vtFiltrarLista(M)),so=vtEstado.modo==='so';
  vtListaVista=l;
  if(!l.length){cont.innerHTML='<div class="mtd-vacio">Sin clientes con este filtro</div>';return}
  cont.innerHTML='<div class="vt-fila vt-fila-cab" aria-hidden="true"><span>Cliente</span>'+
    (so?'<span>Sell-out · sell-in · año anterior</span><span>Sell-in</span><span>Sell-out</span><span>SO ÷ SI</span><span>Δ% sell-out</span>':
        '<span>Venta · plan · Venta -1</span><span>Venta</span><span>% plan</span><span>Δ% Venta -1</span><span>Falta</span>')+
    '<span>Inventario</span><span>Acción</span></div>'+
    l.map(function(x,i){return vtHtmlFila(x,i,M.av)}).join('')}

function vtPintarSegs(M){
  var cont=document.getElementById('vtSegs');if(!cont)return;
  var n={};M.filas.forEach(function(x){n[x.acc]=(n[x.acc]||0)+1});
  var segs=[['','Todos',M.filas.length]].concat(['empujar','oportunidad','activar','vigilar','quiebre']
    .map(function(a){return[a,VT_ACC[a][0],n[a]||0]}));
  var s=vtEstado.seg,extra='';
  if(s.indexOf('m:')===0||s==='sinso'||s==='sinbase'){
    var p=s.split(':'),et=s==='sinso'?'Sin sell-out reciente':(s==='sinbase'?'Sin año anterior para comparar':
      ({alto:'Sobreinventario',sano:'Inventario sano',bajo:'Bajo inventario'}[p[1]]+' · sell-out '+p[2]));
    extra='<button type="button" class="chip-filtro" onclick="vtSetSeg(\''+s+'\')" title="Quitar filtro">'+esc(et)+
      '<span class="x" aria-hidden="true">×</span></button>'}
  cont.innerHTML=segs.filter(function(g){return g[0]===''||g[2]>0}).map(function(g){
    return'<button type="button" class="chip-periodo'+(s===g[0]?' activo':'')+'" onclick="vtSetSeg(\''+g[0]+'\')">'+
      esc(g[1])+' <span class="vt-cnt">'+g[2]+'</span></button>'}).join('')+extra}

function vtHtmlFila(x,i,av){
  var so=vtEstado.modo==='so',inv='–',invDet='';
  if(x.sal.sinDatos)invDet='sin sell-out';
  else if(x.sal.viejo)invDet='reporta hasta '+vtMesEtq(x.sal.kSO);
  else if(x.sal.dohRep==null)invDet='sin inventario';
  else{inv=vtDias(x.sal.dohRep);invDet=vtMesEtq(x.sal.kInv)+' · objetivo '+x.obj+' d'}
  function c(cls,etq,val,det){return'<span class="vt-f-num '+cls+'" data-th="'+etq+'"><b>'+val+'</b>'+
    (det?'<small>'+det+'</small>':'')+'</span>'}
  var cifras=so?
    c('v','Sell-in',vtCant(x.si),x.siLY>0?'Δ% '+vtDelta(x.dSI):'')+
    c('r','Sell-out',vtCant(x.so),'')+
    c('p','SO ÷ SI',vtPct(x.ratio),'')+
    c('a','Δ% sell-out',vtDelta(x.dSO),x.soLY>0?'año ant. '+vtCant(x.soLY):'sin año anterior'):
    c('v','Venta',mtdMonedaCorta(x.real),x.plan>0?'de '+mtdMonedaCorta(x.plan):'sin plan')+
    c('r','% plan',x.plan>0?vtPct(x.cumpl):'–','')+
    c('p','Δ% Venta -1',vtDelta(x.dA1),x.a1>0?'Venta -1 '+mtdMonedaCorta(x.a1):'sin Venta -1')+
    c('a','Falta',x.plan>0?(x.falta>0?mtdMonedaCorta(x.falta):'—'):'–',x.a1Mes>0?'Venta -1 mes '+mtdMonedaCorta(x.a1Mes):'');
  return'<button type="button" class="vt-fila" onclick="vtAbrirCliente('+i+')">'+
    '<span class="vt-f-nom"><b>'+esc(x.cliente)+(x.interno?' <small>(interno)</small>':'')+'</b><small>'+
      esc(vtCorto(x.kam))+' · '+esc(x.canal)+'</small></span>'+
    '<span class="vt-f-bul">'+vtBullet(x,so?'so':'plan')+'</span>'+cifras+
    c('i','Inventario',inv,invDet)+
    '<span class="vt-f-acc">'+vtChip(x.acc)+'</span></button>'}

/* ── Ficha de cliente ── */
function vtRenderFichaCliente(M){
  var id=vtEstado.ficha.id,x=null;
  M.todos.forEach(function(y){if(y.id===id)x=y});

  var h='<div class="vt-ficha">'+

      vtHtmlHero(x,M,vtEstado.modo==='so'?'Canal':MTD_MESES_LARGO[M.av.mes-1]+' '+M.av.anio,null).replace('vt-hero"','vt-hero vt-hero-ficha"')+
      vtHtmlCanal(x)+
    '</div>'+
    '<section class="card mtd-panel"><h3>Últimos 12 meses · sell-in vs sell-out</h3>'+
      '<div class="hint">Hoja Data · lo que este cliente compra (sell-in) y lo que reporta haber vendido al consumidor (sell-out).</div>'+
      (x.u.so&&M.w?vtGrafMeses(vtSerieData(x.u.so.mens,M.w.k1))+VT_PVL_NOTA:'<div class="mtd-vacio">Este cliente no reporta sell-out en la hoja Data</div>')+
    '</section>'+
    '<section class="card mtd-panel"><div class="mtd-panel-cab"><h3>Productos de este cliente</h3>'+
      '<button class="mtd-btn-csv" onclick="vtCsvProdCliente()">⬇ CSV</button></div>'+
      '<div class="hint" id="vtHintProdCli"></div>'+
      '<div class="mtd-scroll vt-scroll-alto"><table class="mtd-tabla" id="vtTablaProdCli"></table></div></section>'+
  '</div>';
  document.getElementById('vtCuerpo').innerHTML=h;
  vtTablaProdCliente(x,M)}

/* Tarjeta "Canal e inventario": solo lo que el cliente reportó. */
function vtHtmlCanal(x){
  var s=x.sal,obj=x.obj;
  if(!vtSO)return'<section class="card vt-canal"><h3>Canal e inventario</h3><div class="vt-nota"><span class="mtd-spinner"></span>Cargando sell-out…</div></section>';
  if(s.sinDatos)return'<section class="card vt-canal"><h3>Canal e inventario</h3>'+
    '<p class="vt-frase">Este cliente no reporta sell-out en la hoja Data.</p></section>';
  var frase=s.viejo?'Su último sell-out reportado es de <b>'+vtMesEtq(s.kSO)+'</b>.':'';
  if(!s.viejo){
    frase=s.kInv>=0&&s.dohRep!=null?
      'Su último inventario reportado (<b>'+vtMesEtq(s.kInv)+'</b>) equivale a <b>'+vtDias(s.dohRep)+'</b> de su sell-out '+
        '(objetivo '+obj+' d'+(x.objDef?', por defecto':'')+').':
      'Reporta sell-out pero no inventario.';
    if(s.dSO3!=null)frase+=' Su sell-out de los últimos 3 meses (a '+vtMesEtq(s.kSO)+') va <b>'+
      (s.dSO3>=0?'+':'')+mtdPctTxt(s.dSO3)+'</b> contra los mismos meses del año pasado.';
    if(s.sellThrough!=null)frase+=' De cada $100 que le facturamos en los últimos 6 meses, vendió <b>$'+
      Math.round(s.sellThrough*100)+'</b> al consumidor.'}
  function cif(etq,val,det){return'<div class="vt-stat"><div class="vt-etq">'+etq+'</div><div class="vt-num-m">'+val+'</div>'+
    (det?'<div class="vt-det">'+det+'</div>':'')+'</div>'}
  return'<section class="card vt-canal"><h3>Canal e inventario</h3><p class="vt-frase">'+frase+'</p><div class="vt-stats">'+
    cif('Sell-out promedio'+VT_PVL,mtdMonedaCorta(s.promSO),'por mes · 3 meses a '+vtMesEtq(s.kSO))+
    cif('Inventario reportado'+VT_PVL,s.kInv>=0?mtdMonedaCorta(s.inv):'–',s.kInv>=0?'al cierre de '+vtMesEtq(s.kInv):'sin foto')+
    cif('Días de inventario',vtDias(s.dohRep),'objetivo '+obj+' d')+
    cif('Sell-out ÷ sell-in',vtPct(s.sellThrough),'últimos 6 meses')+
  '</div>'+VT_PVL_NOTA+'</section>'}

/* Filas de producto de un cliente (o de un producto en todos los clientes). */
function vtFilaProd(a,r,v,obj){
  var f={venta:a?(vtEstado.unidad==='#'?a.u:a.v):0,a1:a?a.a1:0,si:v.si,so:v.so,soLY:v.soLY,
    inv:r&&!r.sinDatos&&r.kInv>=0?(vtEstado.unidad==='#'?r.invU:r.inv):null,
    doh:r&&!r.sinDatos?r.dohRep:null,senal:vtSenal(r,obj)};
  f.dA1=vtEstado.unidad!=='#'&&f.a1>0?f.venta/f.a1-1:null;
  f.dSO=f.soLY>0?f.so/f.soLY-1:null;
  f.ord={quiebre:3,sobre:2,sinrot:1,'':0}[f.senal];
  return f}
function vtColsProd(primera){
  var und=vtEstado.unidad==='#';
  return[primera,
    {k:'venta',t:'Venta mes',tipo:'num',celda:function(f,t){return mtdTd(und?FMT.format(Math.round(f.venta))+' und':mtdMonedaCorta(f.venta),t)}},
    {k:'dA1',t:'Δ% Venta -1',tipo:'num',celda:function(f,t){return mtdTd(vtDelta(f.dA1),t)}},
    {k:'si',t:'Sell-in',tipo:'num',celda:function(f,t){return mtdTd(f.si?vtCant(f.si):'–',t)}},
    {k:'so',t:'Sell-out',tipo:'num',celda:function(f,t){return mtdTd(f.so?vtCant(f.so):'–',t)}},
    {k:'dSO',t:'Δ% sell-out',tipo:'num',celda:function(f,t){return mtdTd(vtDelta(f.dSO),t)}},
    {k:'inv',t:'Inventario',tipo:'num',celda:function(f,t){return mtdTd(f.inv==null?'–':vtCant(f.inv),t)}},
    {k:'doh',t:'Días inv.',tipo:'num',celda:function(f,t){return mtdTd(vtDias(f.doh),t)}},
    {k:'ord',t:'Señal',tipo:'num',celda:function(f,t){return mtdTd(vtChipSenal(f.senal),t)}}]}

function vtTablaProdCliente(x,M){
  var ok=x.u.so&&!x.sal.sinDatos&&!x.sal.viejo,pm=vtPM[x.id]||{},so=ok?x.u.so.prods:{},ks={},filas=[];
  Object.keys(pm).forEach(function(k){ks[k]=1});Object.keys(so).forEach(function(k){ks[k]=1});
  Object.keys(ks).forEach(function(pk){
    var a=pm[pk],s=so[pk],info=vtSO&&vtSO.prod[pk];
    var r=s?vtSalud(s.mens,x.obj,x.sal.kSO,x.sal.kInv):null,v=vtSumVentana(s?s.mens:null,M.w);
    var f=vtFilaProd(a,r,v,x.obj);
    f.pk=pk;f.nombre=(a&&a.nombre)||(info&&info.nombre)||pk;
    if(f.venta||f.a1||f.si||f.so||f.inv)filas.push(f)});
  var q=filas.filter(function(f){return f.senal==='quiebre'}).length,sb=filas.filter(function(f){return f.senal==='sobre'}).length;
  document.getElementById('vtHintProdCli').innerText=filas.length+' productos'+
    (q?' · '+q+' en riesgo de quiebre':'')+(sb?' · '+sb+' con sobrestock':'')+
    ' · venta del mes y Δ% contra la Venta -1 · sell-in y sell-out '+(M.w?M.w.etq:'')+
    ' · días de inventario reportados · clic en un producto para verlo en todos los clientes';
  vtVistaProdCli=filas;
  mtdTabla({id:'vtTablaProdCli',filas:filas,orden:{k:'ord',dir:'desc'},vacio:'Sin productos',
    alOrdenar:function(v){vtVistaProdCli=v},
    clic:{valor:function(f){return f.pk},activo:function(){return false},haySel:function(){return false},
      alClic:function(pk){vtAbrirProducto(pk)},titulo:'Ver este producto en todos los clientes'},
    columnas:vtColsProd({k:'nombre',t:'Producto',tipo:'txt',celda:function(f){return'<td>'+esc(f.nombre)+'</td>'}})})}

/* ── Vista Productos ── */
var vtBuLista=[],vtProdFirma='';
function vtRenderProductos(M){
  var P=vtModeloProductos(),bus={},marcas={};
  P.lista.forEach(function(p){if(p.bu)bus[p.bu.toUpperCase()]=p.bu;
    if(p.brand&&(!vtEstado.bu||p.bu.toUpperCase()===vtEstado.bu))marcas[p.brand]=1});
  if(vtEstado.marca&&!marcas[vtEstado.marca])vtEstado.marca='';
  var h='<section class="card mtd-panel vt-prod-card"><div class="vt-hero-cab"><h3>Productos'+
    (vtEstado.kam?' · cartera de '+esc(vtCorto(vtEstado.kam)):'')+'</h3>'+vtHtmlSwitches(false)+'</div>'+
    '<div class="hint">Venta del mes (PLANTILLA) y Δ% contra la Venta -1 · sell-in y sell-out '+(M.w?esc(M.w.etq):'')+
      ' (hoja Data) · días de inventario reportados · clic en un producto para verlo cliente por cliente.'+
      ' <button class="mtd-btn-csv" onclick="vtCsvProductos()">⬇ CSV</button></div>'+
    '<div class="vt-prod-filtros"><input type="search" class="vt-buscar" placeholder="Buscar producto…" value="'+esc(vtEstado.qp)+
      '" oninput="vtBuscarProd(this.value)"><div class="vt-prod-fila"><div class="chips-periodo" id="vtBus">'+
      (vtBuLista=Object.keys(bus).sort()).map(function(k,i){return'<button type="button" class="chip-periodo'+
        (vtEstado.bu===k?' activo':'')+'" data-bu="'+esc(k)+'" onclick="vtSetBu(vtBuLista['+i+'])">'+esc(bus[k])+'</button>'}).join('')+
      '</div><select class="vt-orden" onchange="vtSetMarca(this.value)" aria-label="Marca"><option value="">Todas las marcas</option>'+
      Object.keys(marcas).sort().map(function(m){return'<option value="'+esc(m)+'"'+(vtEstado.marca===m?' selected':'')+'>'+esc(m)+'</option>'}).join('')+
      '</select></div></div>'+
    (vtSO?'':'<div class="vt-nota"><span class="mtd-spinner"></span>Cargando sell-out…</div>')+
    '<div class="mtd-scroll vt-scroll-alto"><table class="mtd-tabla" id="vtTablaProd"></table></div>'+
    '<div id="vtProdMas"></div>'+VT_PVL_NOTA+'</section>';
  document.getElementById('vtCuerpo').innerHTML=h;
  vtPintarProductos()}

function vtFirmaOrden(){var o=MTD_ORDEN.vtTablaProd;return o?o.k+'|'+o.dir:''}
function vtPintarProductos(){
  var P=vtModeloProductos(),q=normTxt(vtEstado.qp||''),bu=vtEstado.bu,marca=vtEstado.marca,und=vtEstado.unidad==='#';
  if(!document.getElementById('vtTablaProd'))return;
  document.querySelectorAll('#vtBus .chip-periodo').forEach(function(b){
    b.classList.toggle('activo',!!bu&&b.getAttribute('data-bu')===bu)});
  var l=P.lista.filter(function(p){return(!q||normTxt(p.nombre).indexOf(q)!==-1)&&
      (!bu||p.bu.toUpperCase()===bu)&&(!marca||p.brand===marca)})
    .map(function(p){var f={pk:p.pk,nombre:p.nombre,bu:p.bu,venta:und?p.und:p.venta,a1:p.a1,
      dA1:und?null:p.dA1,si:p.si,so:p.so,soLY:p.soLY,dSO:p.dSO,inv:und?p.invU:p.inv,doh:p.doh,
      cliCompra:p.cliCompra,cliSO:p.cliSO,quiebre:p.quiebre,sobre:p.sobre};
      f.alertas=f.quiebre*10+f.sobre;return f});
  var columnas=VT_COLS_PROD();
  // Se pintan solo los primeros `tope`, pero el orden elegido con clic en un
  // encabezado se aplica a la lista COMPLETA (y el CSV sale en ese orden).
  var ord=mtdOrdenActual({id:'vtTablaProd',columnas:columnas,orden:null});
  l.sort(ord?mtdComparador(ord.col,ord.dir):function(a,b){return b.venta-a.venta||b.so-a.so});
  var tope=vtEstado.topeProd,vis=l.slice(0,tope);
  vtProdVista=l;vtProdFirma=vtFirmaOrden();
  mtdTabla({id:'vtTablaProd',filas:vis,orden:null,vacio:'Sin productos con este filtro',
    // Un clic en un encabezado repinta solo `vis`: si cambió el orden, se rehace todo.
    alOrdenar:function(){if(vtFirmaOrden()!==vtProdFirma)setTimeout(vtPintarProductos,0)},
    clic:{valor:function(p){return p.pk},activo:function(){return false},haySel:function(){return false},
      alClic:function(pk){vtAbrirProducto(pk)},titulo:'Ver este producto cliente por cliente'},
    columnas:columnas});
  var mas=document.getElementById('vtProdMas');
  if(mas)mas.innerHTML=l.length>tope?'<button class="btn vt-mas" onclick="vtMasProd()">Mostrar más ('+
    (l.length-tope)+' restantes)</button>':(l.length?'<div class="hint">'+l.length+' productos · "Clientes" = compraron este mes / con sell-out en la ventana</div>':'')}
function VT_COLS_PROD(){
  var c=vtColsProd({k:'nombre',t:'Producto',tipo:'txt',celda:function(p){return'<td>'+esc(p.nombre)+'<span class="sub">'+esc(p.bu||'')+'</span></td>'}});
  c.splice(c.length-1,1,
    {k:'cliCompra',t:'Clientes',tipo:'num',celda:function(p,t){return mtdTd(p.cliCompra+' / '+p.cliSO,t)}},
    {k:'alertas',t:'Alertas',tipo:'num',celda:function(p,t){
      return mtdTd((p.quiebre?'<span class="vt-alerta q">'+p.quiebre+' quiebre</span>':'')+
        (p.sobre?'<span class="vt-alerta s">'+p.sobre+' sobrestock</span>':'')||'–',t)}});
  return c}

/* ── Ficha de producto: cliente por cliente ── */
function vtRenderFichaProducto(M){
  var P=vtModeloProductos(),p=P.idx[vtEstado.ficha.pk];
  if(!p){vtEstado.ficha=null;vtRender();return}
  var und=vtEstado.unidad==='#',mens={};
  p.det.forEach(function(d){
    var cp=d.x.u.so&&d.x.u.so.prods[p.pk];if(!cp)return;
    Object.keys(cp.mens).forEach(function(k){var a=cp.mens[k],z=mens[k]||(mens[k]={si:0,so:0,inv:0,siU:0,soU:0,invU:0,inv1:0});
      z.si+=a.si;z.so+=a.so;z.siU+=a.siU;z.soU+=a.soU;if(a.inv1){z.inv+=a.inv;z.invU+=a.invU;z.inv1=1}})});
  function cif(etq,val,det){return'<div class="vt-stat"><div class="vt-etq">'+etq+'</div><div class="vt-num-m">'+val+'</div>'+
    (det?'<div class="vt-det">'+det+'</div>':'')+'</div>'}
  var h='<div class="vt-ficha">'+
    '<div class="vt-ficha-cab"><button class="btn" onclick="vtCerrarFicha()">← Volver</button>'+
      '<div><h2>'+esc(p.nombre)+'</h2><span class="sub">'+esc([p.bu,p.brand].filter(Boolean).join(' · '))+
      (vtEstado.kam?' · cartera de '+esc(vtCorto(vtEstado.kam)):'')+'</span></div>'+vtHtmlSwitches(false)+'</div>'+
    '<section class="card vt-canal"><div class="vt-stats">'+
      cif('Venta del mes',und?FMT.format(Math.round(p.und))+' und':mtdMonedaCorta(p.venta),und?'':'Δ% '+vtDelta(p.dA1)+' vs Venta -1')+
      cif('Sell-out'+VT_PVL+' '+(M.w?esc(M.w.etq):''),vtCant(p.so),'Δ% '+vtDelta(p.dSO)+' vs año anterior · '+p.cliSO+' clientes')+
      cif('Días de inventario',vtDias(p.doh),'reportados, clientes con foto de inventario')+
      cif('Alertas',(p.quiebre||0)+' · '+(p.sobre||0),'clientes en riesgo de quiebre · con sobrestock')+
    '</div>'+VT_PVL_NOTA+'</section>'+
    '<section class="card mtd-panel"><h3>Últimos 12 meses · sell-in vs sell-out</h3>'+
      '<div class="hint">Hoja Data · clientes de la cartera filtrada.</div>'+
      (M.w?vtGrafMeses(vtSerieData(mens,M.w.k1)):'')+'</section>'+
    '<section class="card mtd-panel"><div class="mtd-panel-cab"><h3>Cliente por cliente</h3></div>'+
      '<div class="hint">Clic en un cliente para abrir su ficha.</div>'+
      '<div class="mtd-scroll vt-scroll-alto"><table class="mtd-tabla" id="vtTablaProdDet"></table></div></section></div>';
  document.getElementById('vtCuerpo').innerHTML=h;
  var filas=p.det.map(function(d){var f=vtFilaProd(d.a,d.r,d.v,d.x.obj);
      f.id=d.x.id;f.cliente=d.x.cliente;f.kam=d.x.kam;return f})
    .filter(function(f){return f.venta||f.a1||f.si||f.so||f.inv});
  mtdTabla({id:'vtTablaProdDet',filas:filas,orden:{k:'venta',dir:'desc'},vacio:'Ningún cliente del filtro tiene este producto',
    clic:{valor:function(f){return f.id},activo:function(){return false},haySel:function(){return false},
      alClic:function(id){vtAbrirClienteId(id)},titulo:'Abrir la ficha de este cliente'},
    columnas:vtColsProd({k:'cliente',t:'Cliente',tipo:'txt',celda:function(f){return'<td>'+esc(f.cliente)+'<span class="sub">'+esc(vtCorto(f.kam))+'</span></td>'}})})}

/* ══════════ CSV (lo que se ve, en el orden mostrado) ══════════ */
function vtCsvClientes(){
  var und=vtEstado.unidad==='#'?' (und)':'';
  mtdDescargarCsv(vtListaVista.map(function(x){return{cliente:x.cliente,kam:x.kam,canal:x.canal,real:Math.round(x.real),
    plan:Math.round(x.plan),cumpl:x.cumpl,a1:Math.round(x.a1),dA1:x.dA1,a1Mes:Math.round(x.a1Mes),
    si:Math.round(x.si),so:Math.round(x.so),ratio:x.ratio,dSO:x.dSO,
    doh:x.eInv==='sindatos'?'':Math.round(x.sal.dohRep),mesInv:x.sal.kInv>=0?vtMesEtq(x.sal.kInv):'',obj:x.obj,
    accion:(VT_ACC[x.acc]||VT_ACC.ok)[0]}}),[
    {clave:'cliente',titulo:'Cliente'},{clave:'kam',titulo:'KAM'},{clave:'canal',titulo:'Canal'},
    {clave:'real',titulo:'Venta mes'},{clave:'plan',titulo:'Plan mes'},{clave:'cumpl',titulo:'% Cumplimiento'},
    {clave:'a1',titulo:'Venta -1'},{clave:'dA1',titulo:'Δ% vs Venta -1'},{clave:'a1Mes',titulo:'Venta -1 mes completo'},
    {clave:'si',titulo:'Sell-in ventana'+und},{clave:'so',titulo:'Sell-out ventana'+und},{clave:'ratio',titulo:'Sell-out / Sell-in'},
    {clave:'dSO',titulo:'Δ% sell-out vs año anterior'},{clave:'doh',titulo:'Días de inventario reportados'},
    {clave:'mesInv',titulo:'Mes del inventario'},{clave:'obj',titulo:'DOH objetivo'},{clave:'accion',titulo:'Acción sugerida'}],
    'ventas_clientes_'+mtdCsvFecha()+'.csv')}
function vtCsvProductos(){
  mtdDescargarCsv(vtProdVista.map(function(p){return{nombre:p.nombre,bu:p.bu,venta:Math.round(p.venta),dA1:p.dA1,
    si:Math.round(p.si),so:Math.round(p.so),dSO:p.dSO,inv:Math.round(p.inv||0),doh:p.doh==null?'':Math.round(p.doh),
    cliCompra:p.cliCompra,cliSO:p.cliSO,quiebre:p.quiebre,sobre:p.sobre}}),[
    {clave:'nombre',titulo:'Producto'},{clave:'bu',titulo:'BU'},{clave:'venta',titulo:'Venta mes'},{clave:'dA1',titulo:'Δ% vs Venta -1'},
    {clave:'si',titulo:'Sell-in ventana'},{clave:'so',titulo:'Sell-out ventana'},{clave:'dSO',titulo:'Δ% sell-out vs año anterior'},
    {clave:'inv',titulo:'Inventario reportado'},{clave:'doh',titulo:'Días de inventario reportados'},
    {clave:'cliCompra',titulo:'Clientes que compraron'},{clave:'cliSO',titulo:'Clientes con sell-out'},
    {clave:'quiebre',titulo:'Clientes en riesgo de quiebre'},{clave:'sobre',titulo:'Clientes con sobrestock'}],
    'ventas_productos_'+mtdCsvFecha()+'.csv')}
function vtCsvProdCliente(){
  mtdDescargarCsv(vtVistaProdCli.map(function(f){return{nombre:f.nombre,venta:Math.round(f.venta),dA1:f.dA1,
    si:Math.round(f.si),so:Math.round(f.so),dSO:f.dSO,inv:f.inv==null?'':Math.round(f.inv),
    doh:f.doh==null?'':Math.round(f.doh),senal:f.senal?VT_SENAL[f.senal][0]:''}}),[
    {clave:'nombre',titulo:'Producto'},{clave:'venta',titulo:'Venta mes'},{clave:'dA1',titulo:'Δ% vs Venta -1'},
    {clave:'si',titulo:'Sell-in ventana'},{clave:'so',titulo:'Sell-out ventana'},{clave:'dSO',titulo:'Δ% sell-out vs año anterior'},
    {clave:'inv',titulo:'Inventario reportado'},{clave:'doh',titulo:'Días de inventario reportados'},{clave:'senal',titulo:'Señal'}],
    'ventas_cliente_productos_'+mtdCsvFecha()+'.csv')}
</script>
